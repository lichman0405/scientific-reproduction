  goal_refs: ["GOAL-EXE-40"]
  plan_ref: "sr_plan_fdm201_v1"
  inventory_refs: ["INV-0201", "INV-0202", "INV-0203", "INV-0204", "INV-0205", "INV-0206", "INV-0207"]
  evidence_refs: ["EV-INV-0201", "EV-INV-0202", "EV-INV-0203", "EV-INV-0204", "EV-INV-0205", "EV-INV-0206", "EV-INV-0207"]
  assumption_refs: ["ASM-A1-N-01", "ASM-A1-FIT-02", "ASM-A1-FIT-03", "ASM-A1-TOL-02", "ASM-A1-TOL-03"]
  resource_refs: ["RES-015", "RES-012"]
  protocol_refs: ["ANL-090"]
  ambiguity_refs: ["AMB-0011", "AMB-0012", "AMB-0013", "AMB-0014"]
  source_refs: ["sr_source_86450d48aa337786cad25c306944daae"]
  upstream_refs: ["GOAL-EXE-20"]
  handoff_refs: ["GOAL-EXE-60", "GOAL-EXE-90"]
