  evidence_refs: ["EV-INV-0101", "EV-INV-0102", "EV-INV-0103", "EV-INV-0104", "EV-INV-0105", "EV-INV-0106", "EV-INV-0107", "EV-INV-0108", "EV-INV-0109"]
  assumption_refs: ["ASM-A1-N-01", "ASM-CVR-AMB-0010-INV-0103", "ASM-CVR-AMB-0010-INV-0106", "ASM-CVR-AMB-0010-INV-0108"]
