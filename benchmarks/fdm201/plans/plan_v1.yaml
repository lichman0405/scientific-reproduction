# ---------------------------------------------------------------------------
# Work packages (WP-00..WP-90; the Goals DAG is the authoritative structure)
# ---------------------------------------------------------------------------
work_packages:
  - wp_id: "WP-00"
    title: "Source acquisition and inventory"
    branch: "bootstrap"
    goal_ids: ["GOAL-RES-001", "GOAL-RES-002", "GOAL-RES-003", "GOAL-RES-004", "GOAL-INV-001", "GOAL-INV-002", "GOAL-INV-003", "GOAL-INV-004", "GOAL-AUD-001"]
    phases:
      - "source acquisition and verification (paper, SI, CIF/depositions, linked data)"
      - "reported-item extraction (experimental, computational)"
      - "figure/table mapping (main text, SI)"
      - "completeness audit (100% mapped, zero unresolved ambiguity before plan freeze)"
    inputs: ["benchmarks/fdm201/sources/ (G01 registered source set)", "benchmarks/fdm201/inventory/INVENTORY.yaml (82 items, 14 ambiguities)"]
    outputs: ["populated and revalidated inventory", "completeness audit record"]
  - wp_id: "WP-10"
    title: "Ligand / precursor reproduction"
    branch: "experiment"
    goal_ids: ["GOAL-EXE-10"]
    phases:
      - "ligand precursor synthesis step 1"
      - "ligand precursor purification/identity check"
      - "PyBC synthesis"
      - "PyBC purification"
      - "PyBC identity/purity characterization"
      - "any reported precursor/control synthesis"
    inputs: ["SI synthesis protocol (INV-0701..0706, via GOAL-INV-004)", "reagents/solvents (RES-017)"]
    outputs: ["PyBC ligand lots with identity/purity evidence"]
  - wp_id: "WP-20"
    title: "FDM-201 synthesis and activation"
    branch: "experiment"
    goal_ids: ["GOAL-EXE-20"]
    phases:
      - "reaction mixture preparation exactly per SI"
      - "solvothermal synthesis of FDM-201"
      - "isolate/wash material"
      - "solvent exchange"
      - "activation"
      - "sample storage/handling"
      - "independent batch synthesis runs"
      - "process-level batch reproducibility analysis"
    inputs: ["SI synthesis/activation protocol (INV-0707..0714, via GOAL-INV-004)", "PyBC ligand lots (GOAL-EXE-10 output)"]
    outputs: ["activated FDM-201 samples (independent batches)", "batch records and reproducibility statistics"]
  - wp_id: "WP-30"
    title: "Structure and composition verification"
    branch: "experiment"
    goal_ids: ["GOAL-EXE-30"]
    phases:
      - "PXRD measurement for each independent batch"
      - "PXRD phase analysis"
      - "SCXRD/sample selection if formally reported and practically reproducible"
      - "structure/model comparison (against the CIF)"
      - "TGA"
      - "any formally reported spectroscopy/compositional characterization"
      - "stability PXRD under all formally reported conditions"
    inputs: ["activated FDM-201 samples (GOAL-EXE-20 output)", "CIF (GOAL-RES-003 output)"]
    outputs: ["per-batch identity evidence (PXRD/TGA/composition)", "structure/model comparison record"]
  - wp_id: "WP-40"
    title: "Porosity"
    branch: "experiment"
    goal_ids: ["GOAL-EXE-40"]
    phases:
      - "activation QC before adsorption"
      - "N2 isotherm acquisition at the reported temperature"
      - "BET analysis using frozen selection rules"
      - "pore-size analysis using the method actually reported"
      - "independent batch porosity statistics"
    inputs: ["activated FDM-201 samples (GOAL-EXE-20 output)", "reported porosity conditions (GOAL-INV-001 output)"]
    outputs: ["N2 isotherms, BET and pore-size records", "porosity comparison evidence"]
  - wp_id: "WP-50"
    title: "Single-component C3H6/C2H4 adsorption"
    branch: "experiment"
    goal_ids: ["GOAL-EXE-50"]
    phases:
      - "C3H6 adsorption isotherm at each reported temperature"
      - "C2H4 adsorption isotherm at each reported temperature"
      - "desorption branch if formally reported"
      - "repeat/batch plan"
      - "uptake comparison statistics"
    inputs: ["activated FDM-201 samples (GOAL-EXE-20 output)", "reported isotherm conditions (GOAL-INV-001 output)"]
    outputs: ["C3H6/C2H4 isotherm datasets", "uptake comparison evidence"]
  - wp_id: "WP-60"
    title: "Derived thermodynamic/selectivity analysis"
    branch: "experiment"
    goal_ids: ["GOAL-EXE-60"]
    phases:
      - "fit/interpolate isotherms using the frozen model/protocol"
      - "calculate IAST selectivity for every formally reported composition/condition"
      - "calculate Qst using the same reported method"
      - "uncertainty/sensitivity analysis appropriate to the method"
    inputs: ["isotherm datasets (GOAL-EXE-50 output)", "reported IAST/Qst procedures (GOAL-INV-002 output)"]
    outputs: ["IAST selectivity results", "Qst results with uncertainty"]
  - wp_id: "WP-70"
    title: "Breakthrough"
    branch: "experiment"
    goal_ids: ["GOAL-EXE-70"]
    phases:
      - "column setup with the inventoried WP-70 parameter set (column geometry, adsorbent mass, packing density, flow rate, gas composition/purity, temperature/pressure, detector calibration, dead-volume correction)"
      - "50/50 C3H6/C2H4 breakthrough at 298 K"
      - "328 K diluted-mixture breakthrough"
      - "regeneration protocol and cycling protocol runs"
    inputs: ["activated FDM-201 samples (GOAL-EXE-20 output)", "WP-70 parameter set (GOAL-INV-001 output)", "gases (RES-017)"]
    outputs: ["breakthrough curves and times per condition", "comparison evidence"]
  - wp_id: "WP-80"
    title: "Computational model construction"
    branch: "computation"
    goal_ids: ["GOAL-EXE-80"]
    phases:
      - "acquire the published CIF"
      - "resolve disorder/model choices"
      - "construct simulation cell"
      - "verify geometry and pore access"
      - "reproduce any linker rotation/dynamic pore argument if computationally reported"
      - "register all assumed atom types/charges/force-field settings"
    inputs: ["CIF (GOAL-RES-003 output)", "reported computational settings (GOAL-INV-002 output)"]
    outputs: ["frozen simulation model (cell + settings)"]
  - wp_id: "WP-81"
    title: "Binding-site / energy reproduction"
    branch: "computation"
    goal_ids: ["GOAL-EXE-81"]
    phases:
      - "reproduce C2H4 binding-site calculation"
      - "reproduce C3H6 binding-site calculation"
      - "reproduce binding-energy calculation method"
      - "verify convergence/model assumptions"
      - "compare recovered energy difference to the paper under frozen equivalence criteria"
    inputs: ["frozen simulation model (GOAL-EXE-80 output)", "reported binding-energy settings (GOAL-INV-002 output)"]
    outputs: ["binding-site and energy results", "comparison evidence"]
  - wp_id: "WP-82"
    title: "GCMC adsorption reproduction"
    branch: "computation"
    goal_ids: ["GOAL-EXE-82"]
    phases:
      - "reproduce C2H4 adsorption simulation"
      - "reproduce C3H6 adsorption simulation"
      - "simulate all reported temperatures/pressures required by the inventory"
      - "sampling/convergence analysis"
      - "compare simulated and experimental trends/data as formally reported"
    inputs: ["frozen simulation model (GOAL-EXE-80 output)", "reported simulation settings (GOAL-INV-002 output)", "experimental isotherms (GOAL-EXE-50 output, informational)"]
    outputs: ["GCMC uptake datasets", "simulated-vs-experimental comparison evidence"]
  - wp_id: "WP-90"
    title: "Final integration"
    branch: "integration"
    goal_ids: ["GOAL-EXE-90"]
    phases:
      - "requirement closure matrix"
      - "scientific-outcome aggregation"
      - "method-reproducibility aggregation"
      - "traceability audit"
      - "final report"
    inputs: ["all goal results and evidence records", "completeness audit record (GOAL-AUD-001)"]
    outputs: ["requirement closure matrix", "final benchmark report and verdict"]

# ---------------------------------------------------------------------------
# Experiment branch (AC-03)
# ---------------------------------------------------------------------------
experiment_branch:
  branch_id: "experiment"
  description: "Wet-lab reproduction of the reported experimental items: synthesis/activation (WP-20, GOAL-EXE-20; ligand chemistry WP-10/GOAL-EXE-10 upstream), structure/identity verification (WP-30, GOAL-EXE-30), porosity (WP-40, GOAL-EXE-40), single-component isotherms (WP-50, GOAL-EXE-50), derived thermodynamics (WP-60, GOAL-EXE-60) and breakthrough (WP-70, GOAL-EXE-70)."
  phases:
    - phase: "synthesis-and-activation"
      description: "ligand/precursor chemistry then FDM-201 synthesis, isolation, solvent exchange, activation, storage; independent batches with process-level reproducibility analysis"
      wp_ids: ["WP-10", "WP-20"]
      goal_ids: ["GOAL-EXE-10", "GOAL-EXE-20"]
      inputs: ["SI synthesis/activation protocol (INV-0701..0714, via GOAL-INV-004)", "reagents/solvents (RES-017)", "synthesis equipment (RES-013)"]
      outputs: ["activated FDM-201 samples", "batch records", "process reproducibility statistics (ANL-010)"]
    - phase: "structure-and-identity-verification"
      description: "PXRD per batch, phase analysis, structure/model comparison against the CIF, TGA, compositional checks, stability PXRD; identity acceptance evidence for downstream goals"
      wp_ids: ["WP-30"]
      goal_ids: ["GOAL-EXE-30"]
      inputs: ["activated samples (GOAL-EXE-20)", "CIF (GOAL-RES-003)"]
      outputs: ["per-batch identity verdicts", "structure/model comparison record (INV-0109, ANL-020)"]
    - phase: "porosity"
      description: "activation QC, N2 isotherm at the reported temperature, BET with frozen selection rules, pore-size analysis with the reported method, batch statistics"
      wp_ids: ["WP-40"]
      goal_ids: ["GOAL-EXE-40"]
      inputs: ["activated samples (GOAL-EXE-20)", "reported porosity conditions (GOAL-INV-001)", "adsorption instrumentation (RES-015)"]
      outputs: ["BET comparison vs 1965 m2 g-1 (INV-0201)", "pore-size comparison vs 7.9 A / 13.0 A (INV-0202)", "porosity statistics (ANL-030)"]
    - phase: "single-component-isotherms"
      description: "C3H6 and C2H4 isotherms at each reported temperature, desorption branch if reported, repeat/batch plan, uptake comparison statistics"
      wp_ids: ["WP-50"]
      goal_ids: ["GOAL-EXE-50"]
      inputs: ["activated samples (GOAL-EXE-20)", "reported isotherm conditions (GOAL-INV-001)", "adsorption instrumentation (RES-015)"]
      outputs: ["isotherm datasets", "uptake comparison vs 180.5 / 68.2 cm3 g-1 at 298 K / 1 bar (INV-0301/0302, ANL-030)"]
    - phase: "derived-thermodynamics"
      description: "frozen-model isotherm fits, IAST selectivity for every reported composition/condition, Qst by the same reported method, uncertainty/sensitivity analysis"
      wp_ids: ["WP-60"]
      goal_ids: ["GOAL-EXE-60"]
      inputs: ["isotherm datasets (GOAL-EXE-50)", "reported IAST/Qst procedures (GOAL-INV-002)"]
      outputs: ["IAST selectivity comparison vs 8.6 at 298 K / 100 kPa (INV-0401)", "Qst comparison vs 27.1 / 19.1 kJ mol-1 (INV-0402/0403, ANL-040)"]
    - phase: "breakthrough"
      description: "column setup with the full WP-70 parameter set, 50/50 run at 298 K, 328 K diluted run, regeneration and cycling runs"
      wp_ids: ["WP-70"]
      goal_ids: ["GOAL-EXE-70"]
      inputs: ["activated samples (GOAL-EXE-20)", "WP-70 parameter set (GOAL-INV-001)", "breakthrough apparatus (RES-016)", "gases (RES-017)"]
      outputs: ["breakthrough time comparison vs ~23.5 / ~64.8 min, window ~41.3 min (INV-0501, ANL-050)", "328 K run record (INV-0502)"]

# ---------------------------------------------------------------------------
# Computation branch (AC-03)
# ---------------------------------------------------------------------------
computation_branch:
  branch_id: "computation"
  description: "Computational reproduction of the reported computational items from the published CIF and the inventoried settings: model construction (WP-80, GOAL-EXE-80), binding-site/energy reproduction (WP-81, GOAL-EXE-81) and GCMC adsorption reproduction (WP-82, GOAL-EXE-82). Independent of wet-lab completion (spec section 5); final comparison may depend on experimental evidence."
  phases:
    - phase: "model-construction"
      description: "acquire the CIF (GOAL-RES-003), resolve disorder/model choices, construct the simulation cell, verify geometry and pore access, reproduce any linker-rotation argument if reported, register all assumed atom types/charges/force-field settings"
      wp_ids: ["WP-80"]
      goal_ids: ["GOAL-EXE-80"]
      inputs: ["CIF (GOAL-RES-003)", "reported computational settings (GOAL-INV-002)", "software (RES-010)", "compute access (RES-011)"]
      outputs: ["frozen simulation model (ANL-060)", "registered assumptions (ASM-A1-FF-01, ASM-FDM-0605)"]
    - phase: "binding-sites"
      description: "reproduce C2H4 and C3H6 binding-site calculations and the binding-energy calculation method with the inventoried electronic-structure settings; verify convergence; compare energies (48.72 / 38.61 kJ mol-1, REPORTED-NON-FINAL) and the energy difference under frozen equivalence criteria"
      wp_ids: ["WP-81"]
      goal_ids: ["GOAL-EXE-81"]
      inputs: ["frozen model (GOAL-EXE-80)", "reported binding-energy settings (GOAL-INV-002)"]
      outputs: ["binding energies with convergence evidence (ANL-061)", "comparison verdicts"]
    - phase: "gcmc"
      description: "reproduce C2H4 and C3H6 GCMC adsorption simulations over all reported temperatures/pressures; sampling/convergence analysis; compare simulated and experimental trends/data as formally reported"
      wp_ids: ["WP-82"]
      goal_ids: ["GOAL-EXE-82"]
      inputs: ["frozen model (GOAL-EXE-80)", "reported simulation settings (GOAL-INV-002)", "experimental isotherms (GOAL-EXE-50, informational)"]
      outputs: ["GCMC uptake datasets with block uncertainties (ANL-062)", "simulated-vs-experimental comparison (INV-0608)"]

