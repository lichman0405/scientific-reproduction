# The frozen FDM-201 reproduction plan (v0.1 benchmark; 17-FDM201-REFERENCE-
# CASE.md, DOI 10.1039/D5TA00771B). Core fields follow schemas/plan.schema.yaml
# (plan_id, version, status, inventory_audit, goal_ids, requirement_ids,
# parent_plan_version, work_packages, resource_ids, frozen_at, frozen_commit)
# and core.models.Plan; benchmark extensions below are permitted by the
# schema's additionalProperties: true.
#
# Freeze marker: Plan v1 is frozen at the fixed timestamp 2026-08-14T00:00:00Z
# with the mapping audit PASS (82/82 items mapped, 0 unmapped, 0 unresolved
# ambiguity; goals/mapping_audit.yaml). frozen_commit is recorded in the
# change-control ledger at merge/review time (the commit hash is unknowable
# before the freeze commit exists; the freeze marker is the timestamp).
#
# AC-03 objects: the experiment and computation branches, resource objects,
# assumption objects, evidence objects, analysis objects and closure objects
# are structured sections of this file; full object records live in the
# referenced companion files (resources/, evidence/, plans/assumptions.yaml,
# plans/analysis_plan.yaml, plans/closure.yaml) and are validated by
# goals/audit_check.py.
#
# Determinism: no wall clock, no randomness, no network at runtime; no
# placeholder text; every number below is traceable to the spec section 2
# seed facts (REPORTED-NON-FINAL) or is an explicit assumption.

