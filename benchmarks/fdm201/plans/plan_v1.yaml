# ---------------------------------------------------------------------------
# Evidence objects (AC-03) -- model and records in ../evidence/
# ---------------------------------------------------------------------------
evidence:
  model_ref: "benchmarks/fdm201/evidence/evidence_model.yaml"
  records_ref: "benchmarks/fdm201/evidence/evidence_records.yaml"
  note: "Evidence is assessed as Source x Claim per 06-EVIDENCE-SYSTEM.md; records follow schemas/evidence.schema.yaml (EV-* per inventory item). At Plan v1 every item has a pre-execution evidence record whose basis is the inventory's evidence_basis_enum (CROSSREF-METADATA / ACQUISITION-LOG / REFERENCE-CASE-SPEC / PUBLIC-SEARCH) and whose A/R/D assessment is derived deterministically from that basis. During execution each goal produces the expected evidence artifacts (primary-source revalidation records, raw data, analysis records) which replace the pre-execution basis."
  evidence_basis_enum: ["CROSSREF-METADATA", "REFERENCE-CASE-SPEC", "ACQUISITION-LOG", "PUBLIC-SEARCH"]
  what_counts_as_evidence:
    - "identity items (INVENTORIED): the registered source record and acquisition-log entry"
    - "reported values (REPORTED-NON-FINAL): primary-source quote + location (ANL-001 revalidation) plus, at execution, the measurement/simulation records compared under ANL-030..062"
    - "deferred items (DEFERRED-TO-EXECUTION): the population record produced by the resolving goal with the primary-source location"
    - "missing parameters (MISSING, A2): the resolution record of GOAL-INV-001 or the re-registered A2 entry with reason"

# ---------------------------------------------------------------------------
# Analysis objects (AC-03) -- full protocols in analysis_plan.yaml
# ---------------------------------------------------------------------------
analysis:
  ref: "benchmarks/fdm201/plans/analysis_plan.yaml"
  protocols: ["ANL-001", "ANL-010", "ANL-020", "ANL-030", "ANL-040", "ANL-050", "ANL-060", "ANL-061", "ANL-062", "ANL-090"]
  note: "Frozen analysis protocols (all version v1, frozen): ANL-001 primary-source revalidation (the explicit justified non-statistical validation plan of spec section 6); ANL-010 process reproducibility; ANL-020 PXRD/identity; ANL-030 isotherm and uptake comparison; ANL-040 IAST/Qst derivation; ANL-050 breakthrough comparison; ANL-060 model-construction checklist; ANL-061 binding-energy comparison; ANL-062 GCMC comparison; ANL-090 statistics/acceptance design (the statistical validation plan)."
  acceptance_thresholds:
    note: "Per-quantity tolerance bands are A1 assumptions frozen at Plan v1 (ASM-A1-TOL-01..08), replaceable only via change control once the paper's own uncertainty is inventoried."
    uptake: {ref: "ASM-A1-TOL-01", band: "relative deviation <= 10%", targets: ["180.5 cm3 g-1 (C3H6)", "68.2 cm3 g-1 (C2H4) at 298 K / 1 bar"]}
    bet: {ref: "ASM-A1-TOL-02", band: "relative deviation <= 10%", target: "1965 m2 g-1"}
    pore_size: {ref: "ASM-A1-TOL-03", band: "absolute deviation <= 0.5 A", targets: ["7.9 A", "13.0 A"]}
    iast_selectivity: {ref: "ASM-A1-TOL-04", band: "relative deviation <= 15%", target: "8.6 at 298 K / 100 kPa, 50/50 C3H6/C2H4"}
    qst: {ref: "ASM-A1-TOL-05", band: "relative deviation <= 10%", targets: ["27.1 kJ mol-1 (C3H6)", "19.1 kJ mol-1 (C2H4)"]}
    breakthrough: {ref: "ASM-A1-TOL-06", band: "relative deviation <= 20%", targets: ["C2H4 ~23.5 min", "C3H6 ~64.8 min", "window ~41.3 min"]}
    binding_energy: {ref: "ASM-A1-TOL-07", band: "relative deviation <= 15%", targets: ["48.72 kJ mol-1 (C3H6)", "38.61 kJ mol-1 (C2H4)"]}
    gcmc: {ref: "ASM-A1-TOL-08", band: "trend agreement; point-wise relative deviation <= 25% where the paper reports quantitative simulated values"}
  target_value_status: "All comparison targets are spec section 2 seed facts (REPORTED-NON-FINAL); they are revalidated against the primary source by GOAL-INV-001/002 (ANL-001) before final acceptance."

# ---------------------------------------------------------------------------
# Closure objects (AC-03) -- full contracts in closure.yaml
# ---------------------------------------------------------------------------
closure:
  ref: "benchmarks/fdm201/plans/closure.yaml"
  contracts: ["CC-BOOTSTRAP", "CC-EXPERIMENT", "CC-COMPUTATION", "CC-INTEGRATION"]
  closure_criteria_per_goal: "Every goal carries a closure_contract_ref (CC-BOOTSTRAP for GOAL-RES/INV, CC-EXPERIMENT for GOAL-EXE-10..70, CC-COMPUTATION for GOAL-EXE-80/81/82, CC-INTEGRATION for GOAL-AUD-001/GOAL-EXE-90); each contract defines statistical sufficiency, execution validity, diagnosis, recovery eligibility (R >= 3, D >= 2, scientifically actionable) and literature requirements."
  benchmark_complete: "The benchmark is complete when: every goal is closed with valid evidence; the requirement closure matrix covers all 82 inventory items; every REPORTED-NON-FINAL value is revalidated against the primary source (ANL-001); GOAL-AUD-001 passes for the final inventory (100% mapped, zero unresolved ambiguity); and GOAL-EXE-90 issues the final report with scientific-outcome and method-reproducibility verdicts."

# ---------------------------------------------------------------------------
# Change control (how Plan v1 changes after freeze)
# ---------------------------------------------------------------------------
change_control:
  plan_versioning: "Plan v1 is FROZEN. Any change to goal contracts, branches, acceptance criteria, tolerance bands, assumption classifications or the inventory mapping requires a plan amendment; material changes produce Plan v2 (status SUPERSEDED for v1) through the benchmark change-control process with a fresh GOAL-AUD-001 audit before the new freeze."
  amendment_policy:
    - "Typographical/clerical corrections (no semantic change): recorded as a change-control entry on the plan; version stays v1."
    - "Assumption reclassification or tolerance-band changes: allowed only with a recorded reason and, where the paper's reported method/uncertainty becomes known (GOAL-INV-001/002), the A1 defaults are replaced by the primary-source values; every change updates assumptions.yaml and the affected goal's acceptance."
    - "Adding execution sub-goals (e.g. per-gas/per-temperature unit processes generated from the SI per spec WP-50): allowed without a plan version bump when they refine existing GOAL-EXE-* contracts; recorded in the change-control ledger."
    - "Dropping or renaming inventory items: forbidden (the inventory is the G02-owned source of truth; the audit never drops items)."
  supersede_policy: "When Plan v2 freezes, plan_v1.yaml status becomes SUPERSEDED with a pointer to the successor; v1 remains readable for traceability (parent_plan_version on the successor)."
  frozen_commit_policy: "frozen_commit is recorded at merge/review time in the change-control ledger entry for this freeze; the freeze marker itself is the fixed timestamp 2026-08-14T00:00:00Z."
  vacuous_verification_note: "The goal verification command `python -m pytest -q tests/benchmarks -k \"fdm201 and plan\"` is VACUOUS at this milestone: tests/benchmarks/ is owned by the frozen goal DEV-M12-G07 and does not exist yet (pytest exits 4 with 'file or directory not found'). No test files are created here (that scope belongs to G07); the audit gate for this milestone is goals/audit_check.py."
