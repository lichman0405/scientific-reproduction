# FDM-201 benchmark Goals DAG (DEV-M12-G03)
#
# Machine-readable Goals DAG for the FDM-201 reference reproduction
# benchmark (17-FDM201-REFERENCE-CASE.md, DOI 10.1039/D5TA00771B). Every
# goal the benchmark will execute is defined here; the spec section 4
# work-package list is an "Example Work Packages" list, so this file
# defines the benchmark's explicit goal ids:
#   - GOAL-RES-001..004  (spec WP-00: source acquisition and verification)
#   - GOAL-INV-001..004  (spec WP-00: reported-item extraction and mapping)
#   - GOAL-AUD-001       (spec WP-00: completeness audit)
#   - GOAL-EXE-10..90    (spec WP-10..WP-90: one execution goal per work
#                         package; GOAL-EXE-81/82 map WP-81/WP-82)
#
# Every requirement_mapping / resolves_in / ambiguity resolves_in value of
# ../inventory/INVENTORY.yaml resolves against this DAG: GOAL-* ids
# directly, WP-* ids via the `wp_alias` table (WP-00 is realized by the
# bootstrap goals per `wp_realization`). audit_check.py asserts this.
#
# Determinism: fixed timestamp 2026-08-14T00:00:00Z; no wall clock, no
# randomness, no network at runtime. No placeholder text; every number
# referenced by acceptance criteria is traceable to the spec section 2 seed
# facts (marked REPORTED-NON-FINAL until revalidated against the primary
# source during execution) or is an explicit assumption (../plans/
# assumptions.yaml).

record_kind: benchmark_goals_dag
goal_id: "DEV-M12-G03"
benchmark_id: "fdm201"
reference_case_spec: "17-FDM201-REFERENCE-CASE.md"
frozen_at: "2026-08-14T00:00:00Z"

determinism:
  fixed_timestamp: "2026-08-14T00:00:00Z"
  wall_clock: "none"
  randomness: "none"
  network: "none"
  note: "Data files only. audit_check.py is deterministic, offline, and uses no wall clock, randomness or network."

# ---------------------------------------------------------------------------
# WP alias / realization tables
# ---------------------------------------------------------------------------
# Every inventory requirement_mapping / resolves_in value must resolve to a
# goal id defined in `goals`: GOAL-* ids directly, WP-* ids via wp_alias.
wp_alias:
  WP-10: "GOAL-EXE-10"
  WP-20: "GOAL-EXE-20"
  WP-30: "GOAL-EXE-30"
  WP-40: "GOAL-EXE-40"
  WP-50: "GOAL-EXE-50"
  WP-60: "GOAL-EXE-60"
  WP-70: "GOAL-EXE-70"
  WP-80: "GOAL-EXE-80"
  WP-81: "GOAL-EXE-81"
  WP-82: "GOAL-EXE-82"
  WP-90: "GOAL-EXE-90"
# WP-00 (source acquisition and inventory) is realized by the bootstrap
# goals collectively; no single goal carries the WP-00 id.
wp_realization:
  WP-00:
    - "GOAL-RES-001"
    - "GOAL-RES-002"
    - "GOAL-RES-003"
    - "GOAL-RES-004"
    - "GOAL-INV-001"
    - "GOAL-INV-002"
    - "GOAL-INV-003"
    - "GOAL-INV-004"
    - "GOAL-AUD-001"

# ---------------------------------------------------------------------------
# Goals
# ---------------------------------------------------------------------------
goals:
  # ----------------------- WP-00: source acquisition and verification ----
  - goal_id: "GOAL-RES-001"
    wp: "WP-00"
    title: "Acquire and verify the primary paper"
    purpose: "Re-verify the primary paper identity against the Crossref record and the registered source (benchmarks/fdm201/sources/records/01_primary_paper.yaml) and make the paper text accessible to execution (reading only; no content mirrored into the repository)."
    objective: "Confirm DOI 10.1039/D5TA00771B identity, journal/year match, and availability of the paper text for GOAL-INV-001..004."
    unit_process_type: "source-acquisition"
    track: "STRICT_REPRODUCTION"
    requirement_ids: ["INV-0001", "INV-0002"]
    resolves_in: ["INV-0001", "INV-0002"]
    resolves_ambiguities: []
    dependencies: []
    acceptance_criteria:
      - "AC-01: DOI 10.1039/D5TA00771B resolves to the registered record (title, journal, year, volume, pages match the inventory INV-0001)."
      - "AC-02: Author list matches the Crossref-verified list (INV-0002)."
      - "AC-03: Paper text is readable by the execution goals, or the unavailability is registered with a reason (registration-only policy; no content embedded)."
    inputs:
      - "source record sr_source_118eed96c3e6f03106c432a03542be7d"
      - "inventory items INV-0001, INV-0002"
    outputs:
      - "verified paper identity record"
      - "paper-access evidence record (EV-INV-0001, EV-INV-0002)"
    resource_ids: ["RES-001"]
    assumption_ids: []
    replication:
      independent_required: false
      planned_n_policy: "single verification pass; identity is a metadata fact (no replication)"
    analysis_protocol_ref: "ANL-001"
    closure_contract_ref: "CC-BOOTSTRAP"
    version: "v1"
    frozen: true
    frozen_at: "2026-08-14T00:00:00Z"

  - goal_id: "GOAL-RES-002"
    wp: "WP-00"
    title: "Acquire the electronic supplementary information (SI)"
    purpose: "Obtain the registered ESI (locator https://www.rsc.org/suppdata/d5/ta/d5ta00771b/d5ta00771b1.pdf, acquisition log item 2) for reading during execution; content is never mirrored into the repository."
    objective: "Make the SI accessible so that GOAL-INV-004 can inventory its figures/tables and any SI-only data (e.g. an embedded CIF)."
    unit_process_type: "source-acquisition"
    track: "STRICT_REPRODUCTION"
    requirement_ids: ["INV-0003"]
    resolves_in: ["INV-0003"]
    resolves_ambiguities: []
    dependencies:
      - goal_id: "GOAL-RES-001"
        type: "hard_gate"
        execution_gate: true
    acceptance_criteria:
      - "AC-01: The ESI locator is reachable and the document is readable by execution goals (INV-0003), or the failure is registered with a reason."
      - "AC-02: ESI figure/table inventory handoff to GOAL-INV-004 is prepared."
    inputs:
      - "source record sr_source_86450d48aa337786cad25c306944daae"
      - "inventory item INV-0003"
    outputs:
      - "SI-access evidence record (EV-INV-0003)"
    resource_ids: ["RES-002"]
    assumption_ids: []
    replication:
      independent_required: false
      planned_n_policy: "single acquisition pass (locator is a registered fact)"
    analysis_protocol_ref: "ANL-001"
    closure_contract_ref: "CC-BOOTSTRAP"
    version: "v1"
    frozen: true
    frozen_at: "2026-08-14T00:00:00Z"

  - goal_id: "GOAL-RES-003"
