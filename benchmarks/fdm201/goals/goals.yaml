    outputs:
      - "CIF-acquisition evidence (EV-INV-0004, EV-INV-0601)"
      - "CIF handoff to GOAL-EXE-30 / GOAL-EXE-80"
    resource_ids: ["RES-003", "RES-004"]
    assumption_ids: ["ASM-CVR-AMB-0001-INV-0004", "ASM-CVR-AMB-0001-INV-0601"]
    replication:
