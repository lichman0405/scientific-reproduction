    purpose: "Re-verify the CIF availability (acquisition log item 3: no CSD/CCDC deposition located at registration; the CIF may exist only embedded in the ESI) and obtain the deposited structure for structure comparison (GOAL-EXE-30) and computational model construction (GOAL-EXE-80)."
    objective: "Locate, download-free register, and verify the FDM-201 CIF (cubic Fm-3m, a = 23.76 A per the published abstract, INV-0102) and any related depositions (INV-0005), resolving AMB-0001."
