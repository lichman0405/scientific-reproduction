# FDM-201 100% mapping audit (DEV-M12-G03)
#
# The GOAL-AUD-001 anticipation at Plan v1 freeze: every one of the 82
# formally reported inventory items (../inventory/INVENTORY.yaml,
# DEV-M12-G02) is mapped to at least one goal defined in goals.yaml, and
# every one of the 14 ambiguity entries (AMB-0001..0014) is assigned to
# the goal(s) that resolve it. Mapped = 82/82, unmapped = 0,
# ambiguities resolved = 14/14, unresolved = 0. All source unavailability
# is formally handled per spec (never ignored): the 65
# DEFERRED-TO-EXECUTION items and the 3 UNAVAILABLE acquisition-log items
# each carry explicit resolution goals. The audit is deterministic: the
# per-item mapping is the inventory requirement_mapping resolved via the
# goals.yaml wp_alias table, extended with the inventory resolves_in
# goals; audit_check.py recomputes and asserts every number.

