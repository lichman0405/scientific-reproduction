audit_id: "AUD-FDM201-PLAN-V1"
goal_id: "DEV-M12-G03"
benchmark_id: "fdm201"
audited_at: "2026-08-14T00:00:00Z"
inventory_ref: "benchmarks/fdm201/inventory/INVENTORY.yaml"
goals_ref: "benchmarks/fdm201/goals/goals.yaml"
plan_ref: "benchmarks/fdm201/plans/plan_v1.yaml"

interpretation:
  mapped_item: "a formally reported inventory item is mapped iff its requirement_mapping
    (resolved via the goals.yaml wp_alias table) plus its resolves_in goals reference at
    least one goal defined in goals.yaml; mapped_to below is that resolved set"
  unresolved_ambiguity: "an ambiguity entry is unresolved at freeze iff it has no
    resolution goal defined in goals.yaml; all 14 entries have resolution goals"
  formal_unavailability: "source unavailability (acquisition-log UNAVAILABLE/PARTIAL and
    inventory DEFERRED-TO-EXECUTION items) is handled formally when the item or log entry
    carries a resolution goal in goals.yaml; nothing is silently ignored (spec AC-02)"

coverage:
  formally_reported_items: 82
  mapped_items: 82
  unmapped_items: 0
  ambiguous_items: 0
  unresolved_ambiguities: 0
  coverage: 1.0
