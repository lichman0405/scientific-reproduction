# registration items (acquisition_status not_registered) and are procured at
# execution.
#
# Determinism: fixed timestamp, no wall clock, no randomness, no network at
# runtime; no placeholder text. No cost estimates are invented
# (estimated_cost/currency null until procurement planning).

