  - ambiguity_id: "AMB-0001"
    title: "FDM-201 CIF deposition location"
    ambiguity_note: "No CSD/CCDC deposition was located at registration (CCDC public deposition search by DOI 10.1039/D5TA00771B returned nothing on 2026-08-14). The CIF may exist only embedded inside the ESI, or may be deposited without the DOI being linked to the deposition record. Location, format and availability of the CIF are unknown at registration."
    affected_item_ids: ["INV-0004", "INV-0601"]
    resolves_in: ["GOAL-RES-003", "GOAL-INV-004"]
  - ambiguity_id: "AMB-0002"
    title: "328 K diluted-mixture breakthrough conditions"
    ambiguity_note: "Spec section 2 states that additional 328 K / diluted-mixture breakthrough conditions are reported; the exact mixture composition, dilution factor, pressure, flow rate and column parameters are not in accessible material."
    affected_item_ids: ["INV-0502", "INV-0515", "INV-0517"]
    resolves_in: ["GOAL-INV-001", "WP-70"]
  - ambiguity_id: "AMB-0003"
    title: "Single-component isotherm temperatures beyond 298 K"
    ambiguity_note: "Only the 298 K uptake values are known at registration; whether isotherms at other temperatures are formally reported (and at which temperatures) is not determinable without the primary text."
    affected_item_ids: ["INV-0305"]
    resolves_in: ["GOAL-INV-001"]
  - ambiguity_id: "AMB-0004"
    title: "Exact Qst calculation procedure"
    ambiguity_note: "The zero-coverage Qst values are seed facts, but the calculation procedure (fit model, temperature set, coverage range, software) is reported only in the paper/SI."
