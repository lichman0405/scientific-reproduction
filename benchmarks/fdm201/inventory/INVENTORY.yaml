# FDM-201 reported-item inventory (DEV-M12-G02)
#
# Formal inventory of every reported experiment / control / computation of the
# FDM-201 reference benchmark that is discoverable from the accessible source
# material registered by DEV-M12-G01. Policy (mirrors benchmarks/fdm201/sources):
# the paper text, SI and CIF are NOT downloaded into the repository (copyright;
# the benchmark must not redistribute publisher content). This inventory is
# therefore built from what IS accessible at registration:
#   (a) the source records and acquisition log (identities, availability
#       statuses, ESI locator) under benchmarks/fdm201/sources/;
#   (b) the Crossref-verified publication metadata recorded there;
#   (c) the seed facts of 17-FDM201-REFERENCE-CASE.md section 2 and the
#       example work packages of section 4, which the spec itself marks as
#       "seed facts to verify, not a substitute for source acquisition".
#
# Every item is truthful about its evidence basis:
#   - INVENTORIED:             existence/identity established from accessible
#                              material (Crossref metadata, acquisition log).
#   - INVENTORIED-DEFERRED:    existence and reported value known from
#                              accessible material (section 2 seed facts or the
#                              G01 acquisition log); the primary source text is
#                              not in the repository; revalidated against the
#                              primary source during benchmark execution.
#   - DEFERRED-TO-EXECUTION:   existence implied by the reference-case spec
#                              (section 3 required items / section 4 candidate
#                              unit processes / required parameter sets), but
#                              values or existence require reading the paper/SI,
#                              which is not in the repository; explicit reason
#                              recorded in missing_reason; resolved by the
#                              execution-phase goal in resolves_in.
# Ambiguities (AC-03) are listed explicitly in the `ambiguities` section with
# the execution-phase goal that resolves them. No item is silently omitted.
#
# Determinism: fixed timestamp 2026-08-14T00:00:00Z; no wall clock, no
# randomness, no network at runtime; no unresolved marker values -- genuinely
# unknown fields carry missing_reason. Every reported number is tagged
# seed_fact_sourced: true and value_status: REPORTED-NON-FINAL (NON-FINAL until
# revalidated against the primary source during benchmark execution).

record_kind: benchmark_reported_item_inventory
goal_id: "DEV-M12-G02"
benchmark_id: "fdm201"
reference_case_spec: "17-FDM201-REFERENCE-CASE.md"
inventoried_at: "2026-08-14T00:00:00Z"

determinism:
  fixed_timestamp: "2026-08-14T00:00:00Z"
  wall_clock: "none"
  randomness: "none"
  network: "none"
  note: "Data files only. The companion self_check.py is deterministic, offline, and uses no wall clock, randomness or network."

source_set:
  records_dir: "benchmarks/fdm201/sources/records"
  acquisition_log: "benchmarks/fdm201/sources/ACQUISITION_LOG.yaml"
  acquisition_log_totals:
    total_items: 9
    REGISTERED: 2
    PARTIAL: 4
    UNAVAILABLE: 3

# ---------------------------------------------------------------------------
# Declared enums
# ---------------------------------------------------------------------------
status_enum:
  - INVENTORIED
  - INVENTORIED-DEFERRED
  - DEFERRED-TO-EXECUTION

value_status_enum:
  - ESTABLISHED
  - REPORTED-NON-FINAL
  - EXISTENCE-ONLY
  - MISSING
  - NOT-APPLICABLE

existence_basis_enum:
  - CROSSREF-METADATA
  - ACQUISITION-LOG
  - REFERENCE-CASE-SPEC-SEED
  - REFERENCE-CASE-SPEC
  - PUBLIC-SEARCH

evidence_basis_enum:
  - CROSSREF-METADATA
  - REFERENCE-CASE-SPEC
  - ACQUISITION-LOG
  - PUBLIC-SEARCH

# ---------------------------------------------------------------------------
# Policies
# ---------------------------------------------------------------------------
policies:
  seed_fact_policy: "Items whose existence and reported values are known only from 17-FDM201-REFERENCE-CASE.md section 2 seed facts (from the paper's published abstract/publisher page) are registered with status INVENTORIED-DEFERRED or DEFERRED-TO-EXECUTION, tagged seed_fact_sourced: true, value_status REPORTED-NON-FINAL, and provenance part '17-FDM201-REFERENCE-CASE.md section 2 seed fact'. They are revalidated against the primary source during benchmark execution (GOAL-INV-001/GOAL-INV-002); none is treated as final."
  no_unresolved_marker_policy: "No unresolved marker values are permitted in any field of this inventory. A genuinely unknown field carries missing_reason describing exactly what is unknown and why (primary source text not downloaded at registration under the no-download policy, bot-protected publisher page, or a search that returned nothing)."
  number_tagging_policy: "Every reported number in reported_value is tagged seed_fact_sourced: true (section 2 seed facts) or derives from the G01 acquisition log (abstract-level, seed_fact_sourced: false), and always value_status REPORTED-NON-FINAL. No reported number is marked final in this pre-execution inventory."
  ambiguity_policy: "AC-03: any item whose parameter values, conditions, or very existence require primary-source reading that is unavailable at registration is listed either as a DEFERRED-TO-EXECUTION item with explicit missing_reason or as an entry in the `ambiguities` section (or both, cross-referenced via ambiguity_ref). Nothing is silently omitted."
  wp70_parameter_policy: "Per 17-FDM201-REFERENCE-CASE.md section 4 WP-70, the mandatory pre-execution breakthrough parameter set (column geometry, adsorbent mass, packing density, flow rate, gas composition/purity, temperature/pressure, detector calibration, dead-volume correction, regeneration protocol, cycling protocol) is inventoried item by item; every parameter whose value is not in accessible material is registered with value_status MISSING, assumption_class A2 ('any missing scientifically consequential parameter is registered as A2 and prevents pure strict classification'), and a reason."
  requirement_mapping_policy: "Every item maps to its candidate work-package / goal identifiers from 17-FDM201-REFERENCE-CASE.md section 4 (GOAL-RES-001..004, GOAL-INV-001..004, GOAL-AUD-001, WP-10..WP-90) in requirement_mapping. GOAL-AUD-001 (completeness audit; 100% mapped, zero unresolved ambiguity before Plan freeze) applies to the whole inventory."
  finality_note: "NON-FINAL: this inventory records existence, identity and (where accessible) reported values only. Every quantitative claim is revalidated against the primary source and SI during benchmark execution; the G01 source-registration statuses are re-verified there as well."

# ---------------------------------------------------------------------------
# G01 acquisition log cross-reference (consistency with DEV-M12-G01)
# ---------------------------------------------------------------------------
# The acquisition log status describes SOURCE AVAILABILITY at registration;
# the inventory status describes the EVIDENCE STATE of the reported item.
# They are related but not identical: e.g. log item 3 (CIF) is UNAVAILABLE as
# a source, while the reported structure itself is inventoried via the
# abstract-level fact (INV-0102) and the deposition is deferred (INV-0004).
g01_cross_reference:
  - acquisition_item: 1
    required_item: "main paper"
    acquisition_log_status: REGISTERED
    inventory_items: ["INV-0001", "INV-0002"]
    note: "Paper identity and author list established from the Crossref record."
  - acquisition_item: 2
    required_item: "SI"
    acquisition_log_status: REGISTERED
    inventory_items: ["INV-0003"]
    note: "ESI locator registered on the publisher domain; content not downloaded; SI figure/table inventory (GOAL-INV-004) is deferred."
  - acquisition_item: 3
    required_item: "FDM-201 deposited crystal structure/CIF"
    acquisition_log_status: UNAVAILABLE
    inventory_items: ["INV-0004", "INV-0102"]
    note: "Source unavailable at registration (no CSD/CCDC deposition located); the reported structure summary from the published abstract is inventoried at INV-0102; deposition location deferred to GOAL-RES-003."
  - acquisition_item: 4
    required_item: "any related deposited structure(s) used by the paper"
    acquisition_log_status: UNAVAILABLE
    inventory_items: ["INV-0005"]
    note: "Paper's deposition list unreadable under no-download policy; none found in public search; deferred to GOAL-RES-003 / GOAL-INV-003."
  - acquisition_item: 5
    required_item: "data-availability resources"
    acquisition_log_status: UNAVAILABLE
    inventory_items: ["INV-0006"]
    note: "RSC article page bot-protected (HTTP 403); statement deferred to GOAL-RES-004 / GOAL-INV-001."
  - acquisition_item: 6
    required_item: "key references for [Zn8SiO4] SBU chemistry"
    acquisition_log_status: PARTIAL
    inventory_items: ["INV-0007"]
    note: "Candidates registered (Cavka 2008, Yaghi 2003); in-paper set deferred to GOAL-INV-003."
  - acquisition_item: 7
    required_item: "key references for adsorption/IAST/Qst methods used"
    acquisition_log_status: PARTIAL
    inventory_items: ["INV-0008"]
    note: "Canonical method references registered (Myers & Prausnitz 1965, Brunauer et al. 1938); in-paper method citations and Qst procedure deferred to GOAL-INV-002."
  - acquisition_item: 8
    required_item: "computational method/force-field references"
    acquisition_log_status: PARTIAL
    inventory_items: ["INV-0009"]
    note: "Canonical references registered (Rappe 1992 UFF, Dubbeldam 2013 GCMC); paper's actual settings deferred to GOAL-INV-002."
  - acquisition_item: 9
    required_item: "relevant same-author and analogous MOF work"
    acquisition_log_status: PARTIAL
    inventory_items: ["INV-0010"]
    note: "FDM-22 and FDM-6 registered as same-author candidates; set completion deferred to GOAL-INV-003."

