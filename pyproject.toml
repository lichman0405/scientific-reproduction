[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scientific-reproduction"
version = "0.1.0"
description = "Scientific Reproduction Skill - deterministic runtime for auditable scientific reproduction (v0.1)"
readme = "docs/README.md"
requires-python = ">=3.11"
# v0.1 runtime is intentionally stdlib-only; no runtime dependencies yet.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.6",
    "mypy>=1.10",
    # DEV-M1-G01: schema validation adapter validates against the frozen
    # product schemas (YAML) in schemas/; jsonschema is the validator and
    # PyYAML loads the schema files. scripts/validate_development_contracts.py
    # already depends on both.
    "jsonschema>=4.18",
    "PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scientific_reproduction"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/scripts",
    "/docs",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow tests (DEV-M0-G04): long-running tests that create fresh virtual
# environments and hit the network. Excluded from the default run to keep
# the deterministic gate fast; run them with `python -m pytest -m slow`.
# A CLI `-m` option overrides this addopts expression (last one wins).
markers = [
    "slow: long-running tests requiring network access (run with pytest -m slow)",
]
addopts = ["-m", "not slow"]

# Ruff linter (DEV-M0-G02): deterministic lint gate for the repository's
# owned code (scripts/, src/, tests/).
# E4/E7/E9 = unambiguous pycodestyle errors, F = pyflakes, I = import sorting.
[tool.ruff]
target-version = "py311"
# Frozen spec content lives under development/ and .development/; the frozen
# spec rules forbid reformatting it, so the lint gate excludes those trees.
extend-exclude = [
    "development",
    ".development",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# Mypy type checker (DEV-M0-G02): pip-installable and deterministic, so CI
# needs no Node toolchain. Non-strict for now; untyped defs are still checked.
[tool.mypy]
python_version = "3.11"
strict = false
check_untyped_defs = true
files = ["src"]
