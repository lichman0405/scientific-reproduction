$schema: "https://json-schema.org/draft/2020-12/schema"
title: ReproductionInventoryItem
type: object
required: [inventory_id, source_id, item_type, formal_report, description, mapping_status]
properties:
  inventory_id: {type: string}
  source_id: {type: string}
  source_location: {type: [string, "null"]}
  item_type: {enum: [experiment, control, characterization, computation, analysis, dataset, structure, figure, table, supplementary_result, other]}
  formal_report: {type: boolean}
  description: {type: string}
  conditions: {type: object}
  linked_inventory_ids: {type: array, items: {type: string}}
  requirement_ids: {type: array, items: {type: string}}
  mapping_status: {enum: [UNMAPPED, MAPPED, AMBIGUOUS, EXCLUDED_NONFORMAL]}
  ambiguity_notes: {type: [string, "null"]}
  # Value-verification fidelity (issue #139), orthogonal to mapping_status
  # (mapping coverage only). Optional so records written before the field
  # existed keep validating; absent means UNKNOWN (no fidelity claim) --
  # the model default serializes as absence, and legacy registrations
  # re-serialize unchanged.
  value_status: {enum: [VERIFIED, REPORTED_NON_FINAL, UNKNOWN]}
  # Why the reported values are missing / not yet established.
  missing_reason: {type: [string, "null"]}
  # The goal id that revalidates the item's values during execution.
  resolves_in: {type: [string, "null"]}
additionalProperties: true
