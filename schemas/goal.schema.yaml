$schema: "https://json-schema.org/draft/2020-12/schema"
title: GoalContract
type: object
required: [goal_id, title, unit_process_type, track, objective, requirement_ids, dependencies, acceptance, analysis_protocol_ref, replication, version, frozen]
properties:
  goal_id: {type: string}
  title: {type: string}
  unit_process_type: {type: string}
  track: {enum: [STRICT_REPRODUCTION, RECOVERY, METHOD_REDESIGN]}
  parent_goal_id: {type: [string, "null"]}
  objective: {type: string}
  requirement_ids:
    type: array
    minItems: 1
    items: {type: string}
  inputs: {type: array, items: {type: object}}
  outputs: {type: array, items: {type: object}}
  dependencies:
    type: array
    items:
      type: object
      required: [goal_id, type]
      properties:
        goal_id: {type: string}
        type: {enum: [hard_gate, soft_dependency, informational]}
        execution_gate: {type: boolean, default: false}
        acceptance_gate: {type: boolean, default: false}
  resource_ids: {type: array, items: {type: string}}
  assumption_ids: {type: array, items: {type: string}}
  replication:
    type: object
    required: [independent_required, planned_n_policy]
    properties:
      independent_required: {type: boolean}
      minimum_n: {type: integer, minimum: 1}
      planned_n_policy: {type: string}
      technical_repeats: {type: [integer, "null"], minimum: 0}
  acceptance:
    type: object
    required: [criteria_ref, frozen]
    properties:
      criteria_ref: {type: string}
      frozen: {type: boolean}
  analysis_protocol_ref: {type: string}
  closure_contract_ref: {type: string}
  evidence_requirements: {type: array, items: {type: object}}
  automatic_retry_policy_ref: {type: [string, "null"]}
  version: {type: string}
  frozen: {type: boolean}
  frozen_at: {type: [string, "null"]}
  frozen_commit: {type: [string, "null"]}
additionalProperties: true
