goal_id: DEV-M9-G03
milestone: M9
title: Implement confidence interval and equivalence testing primitives
objective: Implement basic quantitative validation interfaces for confidence intervals
  and equivalence logic without treating non-significance as equivalence.
depends_on:
- DEV-M9-G02
allowed_scope:
- scientific_reproduction/analysis/statistics.py
- tests/analysis/test_statistics*
deliverables:
- CI utilities
- equivalence/TOST-style decision interface
- effect/uncertainty reporting hooks
acceptance_criteria:
- id: AC-01
  criterion: p>0.05 alone can never produce REPRODUCED.
- id: AC-02
  criterion: Wide interval crossing equivalence bounds produces INCONCLUSIVE.
- id: AC-03
  criterion: Equivalence margins are inputs from frozen Acceptance Criteria, not inferred
    after results.
verification:
- python -m pytest -q tests/analysis -k statistic
forbidden_changes: []
worker_mode: agent_team_task
plan_approval_required: false
