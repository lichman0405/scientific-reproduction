goal_id: DEV-M11-G02
milestone: M11
title: Implement characterization templates
objective: Implement PXRD, SCXRD, TGA and spectroscopy characterization planning/analysis
  metadata templates.
depends_on:
- DEV-M11-G01
allowed_scope:
- scientific_reproduction/domain_packs/materials_chemistry/characterization/**
- tests/domain/materials_chemistry/test_characterization*
deliverables:
- PXRD template
- SCXRD template
- TGA template
- spectroscopy template
acceptance_criteria:
- id: AC-01
  criterion: Templates define required raw data/instrument metadata.
- id: AC-02
  criterion: Analysis protocol and acceptance can be frozen separately from execution.
- id: AC-03
  criterion: PXRD identity/quality checks can be represented without a worker self-decision.
verification:
- python -m pytest -q tests/domain/materials_chemistry -k character
forbidden_changes: []
worker_mode: agent_team_task
plan_approval_required: false
