$schema: https://json-schema.org/draft/2020-12/schema
$title: Development Goal
$type: object
additionalProperties: false
required:
- goal_id
- milestone
- title
- objective
- depends_on
- allowed_scope
- deliverables
- acceptance_criteria
- verification
- worker_mode
properties:
  goal_id:
    type: string
    pattern: ^DEV-M(0|[1-9]|1[0-3])-G[0-9]{2}$
  milestone:
    type: string
    pattern: ^M(0|[1-9]|1[0-3])$
  title:
    type: string
    minLength: 4
  objective:
    type: string
    minLength: 12
  depends_on:
    type: array
    items:
      type: string
      pattern: ^DEV-M(0|[1-9]|1[0-3])-G[0-9]{2}$
    uniqueItems: true
  allowed_scope:
    type: array
    minItems: 1
    items:
      type: string
  deliverables:
    type: array
    minItems: 1
    items:
      type: string
  acceptance_criteria:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
      - id
      - criterion
      properties:
        id:
          type: string
          pattern: ^AC-[0-9]{2}$
        criterion:
          type: string
          minLength: 8
  verification:
    type: array
    minItems: 1
    items:
      type: string
  forbidden_changes:
    type: array
    items:
      type: string
  worker_mode:
    type: string
    enum:
    - agent_team_task
    - detached_native_goal
    - either
  plan_approval_required:
    type: boolean
    default: false
  notes:
    type: array
    items:
      type: string
  change_type:
    type: string
    enum:
    - FEATURE
    - BUGFIX
    - REFACTOR
    - TEST
    - DOCUMENTATION
    - CI
    - BUILD
    - CHORE
  git_notes:
    type: array
    items:
      type: string
