$schema: https://json-schema.org/draft/2020-12/schema
$title: Development Attempt
$type: object
additionalProperties: false
required:
  - goal_id
  - attempt_id
  - change_type
  - base_branch
  - base_sha
  - branch
  - status
  - commit_shas
properties:
  goal_id:
    type: string
    pattern: '^DEV-M(0|[1-9]|1[0-3])-G[0-9]{2}$'
  attempt_id: {type: string, minLength: 4}
  change_type:
    enum: [FEATURE, BUGFIX, REFACTOR, TEST, DOCUMENTATION, CI, BUILD, CHORE]
  base_branch: {const: main}
  base_sha: {type: string, minLength: 7}
  branch: {type: string, minLength: 6}
  worktree: {type: string}
  status:
    enum: [CREATED, WORKING, PUSHED, PR_OPEN, RESULT_SUBMITTED, UNDER_REVIEW, REJECTED, PASS, MERGED, ABANDONED, BLOCKED_HUMAN]
  commit_shas:
    type: array
    items: {type: string, minLength: 7}
  pr:
    type: object
    additionalProperties: false
    required: [number, url, head_sha, state]
    properties:
      number: {type: integer, minimum: 1}
      url: {type: string, minLength: 8}
      head_sha: {type: string, minLength: 7}
      state: {enum: [draft, open, ready, closed, merged]}
      ci_status: {enum: [pending, pass, fail, unavailable]}
  supervisor_reviewed_sha: {type: string, minLength: 7}
  merge_method: {enum: [squash, merge, rebase]}
  merge_commit_sha: {type: string, minLength: 7}
  merged_at: {type: string}
