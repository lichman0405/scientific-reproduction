$schema: https://json-schema.org/draft/2020-12/schema
$title: Development Change Request
$type: object
additionalProperties: false
required:
  - request_id
  - discovered_by_goal
  - problem
  - proposed_change
  - why_required
  - scope
  - architecture_impact
  - acceptance_impact
  - dependency_impact
  - suggested_change_type
  - urgency
properties:
  request_id: {type: string, minLength: 5}
  discovered_by_goal:
    type: string
    pattern: '^DEV-M(0|[1-9]|1[0-3])-G[0-9]{2}$'
  problem: {type: string, minLength: 5}
  proposed_change: {type: string, minLength: 5}
  why_required: {type: string, minLength: 5}
  scope:
    type: array
    items: {type: string}
  architecture_impact:
    enum: [none, implementation_only, locked_semantics_possible, locked_semantics_required]
  acceptance_impact:
    enum: [none, adds_evidence, new_goal_required, frozen_criterion_conflict]
  dependency_impact:
    type: array
    items: {type: string}
  suggested_change_type:
    enum: [FEATURE, BUGFIX, REFACTOR, TEST, DOCUMENTATION, CI, BUILD, CHORE]
  urgency: {enum: [low, normal, high, blocking]}
  worker_must_not_implement_before_supervisor_decision: {const: true}
  supervisor_disposition:
    enum: [IN_CURRENT_GOAL, NEW_DEV_GOAL, ADR_OR_HUMAN_GATE, BACKLOG, REJECTED]
