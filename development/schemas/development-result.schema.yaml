$schema: https://json-schema.org/draft/2020-12/schema
$title: Development Worker Result
$type: object
additionalProperties: false
required:
- goal_id
- attempt_id
- status_claim
- files_changed
- tests_run
- acceptance_evidence
- known_limitations
- git
properties:
  goal_id:
    type: string
  attempt_id:
    type: string
  status_claim:
    type: string
    enum:
    - completed
    - blocked
    - failed
  files_changed:
    type: array
    items:
      type: string
  tests_run:
    type: array
    items:
      type: object
      required:
      - command
      - exit_code
      properties:
        command:
          type: string
        exit_code:
          type: integer
  acceptance_evidence:
    type: array
    items:
      type: object
      required:
      - criterion_id
      - evidence
      properties:
        criterion_id:
          type: string
        evidence:
          type: string
  known_limitations:
    type: array
    items:
      type: string
  unexpected_changes:
    type: array
    items:
      type: string
  git:
    type: object
    additionalProperties: false
    required:
    - branch
    - head_sha
    - commit_shas
    - pr_number
    - pr_url
    properties:
      branch:
        type: string
        minLength: 6
      head_sha:
        type: string
        minLength: 7
      commit_shas:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 7
      pr_number:
        type: integer
        minimum: 1
      pr_url:
        type: string
        minLength: 8
