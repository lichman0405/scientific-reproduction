$schema: https://json-schema.org/draft/2020-12/schema
$title: Development Milestone
$type: object
additionalProperties: false
required:
  - milestone_id
  - title
  - depends_on_milestones
  - required_goals
  - milestone_acceptance
properties:
  milestone_id:
    type: string
    pattern: '^M(0|[1-9]|1[0-3])$'
  title: {type: string, minLength: 4}
  depends_on_milestones:
    type: array
    items: {type: string, pattern: '^M(0|[1-9]|1[0-3])$'}
    uniqueItems: true
  required_goals:
    type: array
    minItems: 1
    items: {type: string, pattern: '^DEV-M(0|[1-9]|1[0-3])-G[0-9]{2}$'}
    uniqueItems: true
  milestone_acceptance:
    type: array
    minItems: 1
    items: {type: string, minLength: 8}
  regression_scope:
    type: array
    items: {type: string}
  unlocks:
    type: array
    items: {type: string, pattern: '^M(0|[1-9]|1[0-3])$'}
