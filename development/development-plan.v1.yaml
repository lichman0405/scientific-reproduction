plan_id: DEV-PLAN-V1
mode: AUTO_RUN_M0_TO_M13
target:
  product_version: scientific-reproduction v0.1
  first_milestone: M0
  last_milestone: M13
milestones:
- M0
- M1
- M2
- M3
- M4
- M5
- M6
- M7
- M8
- M9
- M10
- M11
- M12
- M13
concurrency:
  max_active_workers: 5
  max_same_milestone_workers: 3
  max_cross_cutting_workers: 1
human_gates:
- LOCKED_ARCHITECTURE_CONFLICT
- EXTERNAL_ACCESS_BLOCK
- IRREVERSIBLE_EXTERNAL_ACTION
- UNRESOLVABLE_PLATFORM_LIMITATION
- RELEASE_GATE_SPEC_CONTRADICTION
completion_condition: All M0-M13 milestones and all required atomic development goals are independently accepted; v0.1 release
  gates, FDM-201 planning benchmark, scenarios A-J, repository-wide tests/lint/static/install/audit checks all pass; and no
  blocking development gate remains.
repository:
  full_name: lichman0405/scientific-reproduction
  remote_url: https://github.com/lichman0405/scientific-reproduction.git
  default_branch: main
git_governance:
  policy: development/git-policy.v1.yaml
  branch_per_goal: true
  pr_per_goal: true
  default_merge_method: squash
