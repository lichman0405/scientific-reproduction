design_review:
  registration_only: >-
    The goal's core discipline -- registration only, no content
    downloads, no redistribution of publisher content -- is honored
    uniformly: no paper text, SI or CIF exists in the repository; the
    records carry only the authoritative identity (DOI / stable
    identifier / locator URL) and the availability status. The ESI
    locator points at the publisher's own domain (rsc.org) and is not
    mirrored. This is the correct copyright posture for a benchmark that
    must never redistribute publisher content, and it is declared in
    every layer: README policies, acquisition-log method block
    (no_download_note), record comments, and the PR body.
  identity_through_real_apis: >-
    Every identity in the source set is established through the real
    research subsystem: DOIs via normalize_doi (the paper's DOI
    normalizes to 10.1039/d5ta00771b), URLs via normalize_url, ids via
    core.ids.generate_id, canonical identities via canonical_identity,
    and records are exact serializations of the frozen
    core.models.ResearchSource. The record-scoped semantics of
    RECORD_SCOPED_TYPES (SI/dataset/structure_deposition keep
    record:<source_id>, never the parent paper's DOI) are correctly
    applied -- verified independently, not asserted. Nothing here
    reimplements or bypasses the subsystem.
  honesty_over_fabrication: >-
    The availability policy is honest by design: where a source is not
    accessible at registration (no CSD/CCDC deposition located, RSC page
    bot-protected, in-paper citation lists unreadable under the
    no-download policy), the log records UNAVAILABLE or PARTIAL with an
    explicit reason and a pointer to the execution-phase goal that
    re-verifies it -- it never invents content, never fills silent
    blanks, and a placeholder scan (TBD/TODO) is clean. The benchmark
    project record is explicitly NON-FINAL: no reported number of the
    reference case (uptake, selectivity, Qst, BET, pore sizes,
    breakthrough times) is asserted at registration; every number is
    revalidated against the primary source during benchmark execution
    (DEV-M12-G02+). This correctly keeps registration-time facts (paper
    identity, availability status) separate from execution-time
    scientific claims.
  vacuous_gate_recorded: >-
    The frozen verification command (pytest -q tests/benchmarks -k
    fdm201) cannot literally pass before DEV-M12-G07 creates
    tests/benchmarks: pytest exits 4 ("file or directory not found").
    The review records this vacuous state verbatim in the verification
    section -- it is NOT reported as a green regression gate. The
    worker's PR body does the same. This is the correct handling of a
    temporarily-empty gate: the gate becomes meaningful when G07 lands,
    and G01's regression evidence is the full suite (3016) plus CI,
    both green.
  determinism: >-
    The source set is deterministic by construction: a single fixed
    registration timestamp (2026-08-14T00:00:00Z) in every record, log
    and project file; no wall clock, no randomness, no network at
    runtime; deterministic ids (generate_id, verified by recomputation
    in the worker's battery and by format in the reviewer's); stable
    field order. The set can be re-derived byte-identically from the
    same inputs, which is what a benchmark fixture needs.
  scope_discipline: >-
    The change is exactly the frozen allowed_scope
    (benchmarks/fdm201/sources/** + benchmarks/fdm201/project/**): 16
    files, +349 lines, no product code, no test files, no schema
    changes, no docs outside the benchmark directory. The worker did
    not "fix" the vacuous frozen gate by creating tests (correctly --
    that scope belongs to G07), did not weaken any gate, did not touch
    frozen contracts, and reported the pip-install quirk (editable
    install pointing at another worktree) instead of silently working
    around it: all gates were run with PYTHONPATH=src pointing at this
    worktree.
  house_style: >-
    Files follow the repo's house conventions: explanatory comment
    headers on every file mapping the record to its required bootstrap
    item and its spec reference; consistent field order matching the
    frozen model's to_dict(); cross-references between the acquisition
    log, records and project record; every UNAVAILABLE/PARTIAL entry
    carries a reason. The README documents layout and policies. YAML
    style (quoted strings, nulls as `null`, lists as block sequences)
    matches the existing .development/ files.

