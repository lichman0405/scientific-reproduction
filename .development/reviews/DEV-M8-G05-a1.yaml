design_review:
  exactly_once_per_durable_record: >-
    The at-most-once invariant IS the durable record: scan() resolves the
    existing record from disk before anything (re-hydration on every
    operation, the M1 recovery discipline), the deterministic record id is
    a pure function of (run, kind) (generate_id("trigger", run_id,
    FOLLOWUP_TRIGGER_KIND)), the hook is invoked exactly once per
    issuance, and repeated scans / restarted registries replay the single
    original record (replayed=True, zero hook calls, byte-identical
    bytes). The hook runs BEFORE the record write by design: a hook
    failure propagates loudly with nothing recorded and the decision
    stays re-issuable -- a follow-up is never recorded as a fabricated
    success. The honest crash window (hook succeeded, crash before the
    record write -> the decision is re-issuable and the hook re-invoked)
    is the same crash-window disclosure as DEV-M8-G03's dispatcher --
    there record-before-execute, here execute-before-record because the
    record is the at-most-once marker and a failed follow-up must not be
    recorded as success; once the record exists every further
    scan/trigger is a pure replay.
  safe_by_construction_non_fabrication: >-
    Only _RESULT_RECORDED_RUN_STATES (mirroring the recovery procedure's
    durably-completed set) can be triggered; scan() of anything else
    returns ignored -- never a fabricated trigger, never a persisted byte;
    the strict entry point trigger() raises the stable
    TriggerContractError; the trigger-kind vocabulary is a frozenset
    singleton (a persisted record naming any other kind is corrupt
    state); the default configuration (no hook) records the durable
    at-most-once decision without any receipt and can never invoke an
    adapter -- the module never imports scientific_reproduction.adapters
    (proven in a fresh interpreter).
  real_machinery_verification: >-
    The tests exercise the REAL machinery end to end: persisted records
    re-hydrated through TriggerRecord.from_dict (version check, id
    validity re-check, run-id/file-name agreement), canonical sorted
    bytes through core.atomic.atomic_write (byte-identity asserted across
    independent directories and across re-scans), corrupt records failing
    loudly (CorruptTriggerStateError from get/list_triggered/scan, never
    overwritten), hook failures through real exceptions with the failure
    message walked out of every persisted byte.
  determinism_and_discipline: >-
    Injected clock (FakeClock; consultation asserted: one read on
    trigger, zero on replay), deterministic record ids, sorted
    list_triggered (sorted run-id order), canonical sorted JSON,
    byte-identity across directories, TypeError at every public type
    boundary, stable MonitoringError subclasses (TriggerError ->
    TriggerContractError / CorruptTriggerStateError), no wall clock, no
    randomness, no secrets (credential-shaped scans of every persisted
    byte), errors documented in docstrings with the record contract
    (required fields, stable errors) spelled out.
  type_ignore_audit: >-
    All 8 # type: ignore[arg-type] comments (test_triggers.py lines
    694-707) are deliberate wrong-type boundary passes under
    pytest.raises(TypeError) -- the house boundary-test pattern (same
    judgment as DEV-M7-G04, DEV-M8-G01..G04). The pyright "unreachable"
    diagnostics at triggers.py lines 306/473/478/482/529/540 are the six
    TypeError boundary raises (static narrowing), the test "import could
    not be resolved" diagnostics are the scanner's lack of an editable
    install, and the NonStringHook reportArgumentType at test lines
    559-560 is the deliberate wrong-type hook boundary test (invisible to
    mypy because mypy checks src/ only; asserted at runtime under
    pytest.raises(TypeError)). None are defects -- mypy/ruff/pytest/CI
    are the authoritative gates.

findings:
- id: FND-M8-G05-01
  severity: LOW
  title: >-
    _existing_record treats an existing non-regular file at the record
    path as "never triggered" instead of raising the documented stable
    error
  location: >-
    src/scientific_reproduction/monitoring/triggers.py lines 724-731
    (_existing_record), contrasted with get() lines 695-701 and
    _read_record lines 570-574
  description: >-
    When <state_dir>/trigger/<run_id>.json exists but is not a regular
    file (e.g. a directory), _existing_record returns None
    (path.is_file() is False), so scan()/trigger() proceed to
    _issue_trigger -> _write_record -> atomic_write -> os.replace against
    the directory, which raises a raw OSError (PermissionError on
    Windows) -- not the module's documented stable CorruptTriggerStateError.
    The same corrupt state raises CorruptTriggerStateError from get()
    ("trigger record at ... is not a regular file") and from
    list_triggered()/scan-via-_read_record, so scan()/trigger() are
    inconsistent with the module's own documented contract
    ("CorruptTriggerStateError: ... unreadable files ... corrupt state
    fails loudly, never silently") and with its own get()/list_triggered().
    The corrupt directory is still never overwritten (os.replace fails
    and the temp file is cleaned up), so AC-01/AC-02 safety properties
    hold -- this is a stable-error discipline gap, not a duplicate
    follow-up risk.
  required_fix: >-
    1) In _existing_record, mirror the non-regular-file check of
    get()/_read_record before returning None: if the path exists but is
    not a regular file, raise CorruptTriggerStateError with the same
    "is not a regular file" wording. 2) Add one test covering scan() and
    trigger() with a directory at the record path: both raise
    CorruptTriggerStateError and nothing is persisted (no file written).
    3) Re-run the full verification set on the branch (trigger gate,
    tests/monitoring, ruff, mypy, contracts, full suite) and push a NEW
    commit (no force-push, no --no-verify, no deleted tests, no scope
    expansion -- the frozen ACs and allowed_scope are unchanged). 4) Wait
    for CI PASS on PR #60 (both jobs) and report the new head SHA +
    results.

