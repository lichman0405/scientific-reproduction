design_review:
  acceptance_gate: >-
    AC-01 gate is a pure function of the registered lineage: protocol_
    registered / primary_protocol_registered / primary_protocol_frozen
    recomputed from list_protocol_versions at call time, decided by the
    ordered ACCEPTANCE_GATE_RULES table with a trailing total default;
    assessments record the exact input, every rule decision, matched_rule_
    id and ruleset_version "1.0".
  primary_authority: >-
    AC-02 authority table decided at every register_analysis_record write
    (R-AUTH-P1 exploratory-vs-primary, R-AUTH-P2 primary-vs-primary,
    R-AUTH-D1 exactly-once, R-AUTH-A1 total default) with stable
    PrimaryRecordReplaceProhibitedError naming the matched rule; the
    registry holds pre-freeze records only (frozen=True rejected with
    ProtocolAlreadyFrozenError) and freezing happens solely through
    freeze_primary_protocol.
  versioned_storage: >-
    Versioned records live at protocols/versions/<id>@<version>.json -- a
    sibling subdirectory invisible to the DEV-M4-G04 non-recursive
    "*.json" glob (proven by test_protocol_versioned_records_invisible_
    to_planning_registry). The id-keyed draft keeps its M4-G04 meaning
    and is never rewritten; revision writes one new file per version;
    metadata (metadata_version, parent_protocol_version, frozen_at,
    frozen_commit) rides on schema-permitted extra keys, validated by
    validate_and_reject and ignored by the model layer.
  supersession: >-
    PROTOCOL_STATUS_RULES R-PROT-D1/P1/F1: drafts never superseded;
    frozen + newer version registered -> SUPERSEDED; total default
    FROZEN. SUPERSEDED is a computed lineage status -- stored record
    bytes are never rewritten (AC-03).
  determinism: >-
    All decisions are pure functions of registered state; timestamps are
    injectable (naive datetimes rejected with ValueError); canonical JSON
    (sorted keys, indent 2); identical state across workspaces produces
    identical drafts, freezes and lineages.
  paradigm: >-
    TypeError at public boundaries; ValueError-subclass error hierarchy
    (all 12 protocol error types subclass AnalysisProtocolError ->
    ValueError, verified); stable messages; frozen dataclasses; rule
    tables with RULESET_VERSION constants; from __future__ import
    annotations; __all__ exports.

findings:
- id: FND-M9-G01-01
  severity: MEDIUM
  title: Glob wildcard injection / incomplete id validation in list_protocol_versions
  location: >-
    protocols.py _is_safe_registry_id / _validate_protocol_id (lines
    319-343) and list_protocol_versions (line 1325:
    versions_dir.glob(f"{analysis_id}@*.json"))
  description: >-
    The id validator rejects only "", ".", "..", "/", "\" and "@"; glob
    metacharacters (*, ?, [, ]) pass. Because the id is interpolated
    into the glob, a wildcard query returns records of OTHER analyses.
  empirical_proof: >-
    Executed on head 1712b33 in the review venv: after registering and
    freezing ANL-1, list_protocol_versions(root, "ANL*") and
    list_protocol_versions(root, "*") both returned ANL-1@v1 -- foreign
    records the caller never asked about. The acceptance gate and
    primary-authority checks evaluate over this list, so a wildcard id
    silently changes decisions (acceptance can be granted for a
    never-registered analysis id; lineage/status computed over mixed
    records).
  secondary_defect: >-
    Same root cause: registering an id containing "*" on Windows leaks a
    raw OSError (Errno 22, illegal filename char) instead of a clean
    InvalidProtocolIdError, and would succeed outright on POSIX. Ids
    with glob metacharacters must be rejected deterministically at the
    API boundary on every platform.
  scope_note: >-
    planning/plan.py (DEV-M4-G04, merged) has the same weak validator
    but only globs fixed patterns ("*.json") -- the id is never
    interpolated into a glob there, so it is not affected and must NOT
    be modified by this fix. The fix is confined to M9-G01's own new
    module.
  required_fix: >-
    1) Reject *, ?, [, ] in _validate_protocol_id with the stable
    InvalidProtocolIdError message pattern; update the docstrings that
    describe the id rule. 2) Tests (every name still containing
    "protocol"): InvalidProtocolIdError for ids containing each of * ? [
    ] at register_analysis_record, read_protocol_version,
    list_protocol_versions and freeze_primary_protocol. 3) Re-run the
    full verification set and push a new commit to
    feat/dev-m9-g01-protocols (no force-push, no --no-verify, no
    deleted tests, no scope expansion). 4) Wait for CI PASS on the PR
    and report the new head SHA + results.

