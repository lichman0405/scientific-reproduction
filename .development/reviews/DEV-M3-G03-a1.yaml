      control (git cat-file -e HEAD:path tree form, independent of
      checkout-time line-ending normalization). Tests:
      test_large_artifact_is_registered_but_not_in_git_history,
      test_large_artifact_blob_is_absent_from_git_object_store.
      Independent rerun at head b1edf74: 17 integration tests
      passed, exit 0.
  - criterion_id: AC-02
    result: PASS
    evidence: >-
      The manifest is committed and auditable at the inventory.
      audit.passed governance checkpoint (SS5 "Inventory audit
      passed"): commit_checkpoint with pinned identity "Audit Bot
      <audit@example.org>" and fixed commit time
      2026-01-01T00:00:00Z; record.kind/message/commit_sha asserted;
      count_commits == 1; read_file_at returns the EXACT committed
      manifest JSON from the object store, not the working copy —
      after tampering with the working-copy manifest the committed
      record is unchanged, count_commits stays 1, and git status
