      show_commit. Tests:
      test_manifest_is_committed_at_inventory_checkpoint,
      test_committed_manifest_reads_from_object_store_not_working_copy.
  - criterion_id: AC-03
    result: PASS
    evidence: >-
      The manifest records the artifact's SHA-256 via the artifacts
      checksum module; a deterministic post-registration modification
      (fixed TAMPERED marker appended) is detected: recomputed
      checksum differs from the registered one, verify_sha256 returns
      False, and verify_manifest reports status CHANGED — while the
      registered audit record stays intact: the recorded checksum
      still matches a pristine fixture copy of the original bytes.
      Test: test_checksum_detects_post_registration_modification.
      Independent rerun at head: full suite 702 passed / 6 skipped /
      1 deselected (baseline 696 + 6 new tests only), ruff + mypy
      clean on 37 source files, contracts validator PASS.
