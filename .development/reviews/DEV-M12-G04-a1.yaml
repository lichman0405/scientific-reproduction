design_review:
  decomposition: >-
    The ten execution goals decompose cleanly into 7 experiment packages
    (exp-pkg-01..07, WP-10..70 / GOAL-EXE-10..70, one per experiment
    branch goal) and 3 computation packages (cmp-pkg-01..03, WP-80..82 /
    GOAL-EXE-80..82), plus one worker-context package per goal. The
    experiment/computation split matches Plan v1's 6 experiment + 3
    computation phases; package procedure steps mirror the phase
    contents (synthesis -> activation QC -> isotherm -> BET -> pore
    size -> comparison; model construction -> binding energies -> GCMC).
  cross_package: >-
    Handoffs form a coherent chain consistent with the goals.yaml DAG:
    exp01 (ligand lots) -> exp02 (synthesis) -> exp03/04/05/07
    (characterization/porosity/isotherms/breakthrough) -> exp06 (derived
    thermodynamics), cmp01 -> cmp02 -> cmp03, and every package hands off
    to GOAL-EXE-90 / the closure process. The battery verified every
    ../<pkg>/handoff/ input path resolves to a real package's
    workspace_root, and every upstream_refs/handoff_refs id is a strict
    DAG ancestor/descendant of the package's goal (S9/S10).
  anti_fabrication: >-
    The packages are planning artifacts that never invent scientific or
    infrastructure facts: values only cite frozen inventory text,
    EXISTENCE-ONLY items stay procedural, unresolved choices register as
    A2 assumptions, cluster specifics defer to the adapter via the
    run-command.sh contract with A0 planning defaults, and SBATCH
    resource requests are declared as defaults adjustable from RES-011.
    This matches the registration-only policy of G01/G03 and preserves
    the benchmark's integrity for the execution milestones.
  scope: >-
    git status on the head is clean; only benchmarks/fdm201/execution_packages/**
    was added (22 files). Frozen data untouched, no AC changes, no test
    changes, no --no-verify.

