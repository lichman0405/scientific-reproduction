observations:
  - id: OBS-M12-G04-01
    detail: >-
      The compute variant (benchmark_compute_execution_package) is a
      documented extension of lab-execution-package.schema.yaml, which
      natively expresses only the lab shape (additionalProperties: true
      admits the extension; the validator enforces the compute contract:
      scheduler slurm, #SBATCH per step, run-command.sh contract, A0
      planning defaults per ANL-060). This is sound engineering -- the
      packages never fabricate cluster/software specifics -- but the
      normative schema would be stronger if the compute block and the
      sbatch_script step shape were first-class keys. Schema improvement
      candidate for a future benchmark iteration; tracked at the M13
      Release Gate, not in frozen v0.1 scope.
  - id: OBS-M12-G04-02
    detail: >-
      validate_packages.py:348 passes package.get("record_kind") (typing:
      Unknown | None) into validate_schema(kind: str). Runtime-safe: a
      missing record_kind falls into the unknown-record_kind failure
      branch and the per-directory expected-kind check fires first.
      Cosmetic only -- mypy does not cover benchmarks/, ruff (the CI lint)
      is clean, and the gate runs correctly (20/20). Could be tightened
      with a kind: str annotation or a None-guard in a future cleanup.

