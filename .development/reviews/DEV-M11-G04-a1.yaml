ac_evidence:
  AC-01: >-
    ComputationKind (STRUCTURE_PREPARATION/DFT/GCMC/MD) and ComputationStage
    (EXECUTION/ANALYSIS) are the universal vocabulary; the ordered
    COMPUTATION_PARAMETER_RULES table (R-COM-P1..P8) declares the required
    parameter set per (kind, stage) pair -- 8 pairs covered exactly, P0 the
    trailing total default (validate_computation_rulesets proves
    uniqueness, pair coverage, trailing default, value-rule-per-parameter
    and required-set totality). DftTemplate/GcmcTemplate/
    StructurePreparationTemplate/MdTemplate are frozen dataclasses with
    fixed kind + explicit stage (a missing stage is a TypeError: the
    surface must be declared, never defaulted); construction enforces the
    universal value rules over present parameters
    (COMPUTATION_VALUE_RULES R-COM-V1..V34) and safe template ids
    (FND-M9-G02-01). missing_parameters() detects every unrecorded
    required input (execution vs analysis sets are disjoint);
    assumptions_for_missing_parameters routes each missing input through
    the REAL core.rules.assumptions pathway -- real core.models.Assumption
    records decided by the real assumption_effect and read back through
    the real evaluate_strict_label (A2 default per 16-...-DOMAIN-PACK SS5:
    R-STRICT-2 NOT_STRICT with R-EFF-1 DISQUALIFIES_PURE_STRICT; explicit
    A1 -> R-STRICT-3 STRICT_WITH_ASSUMPTIONS, A0 -> R-STRICT-4 STRICT,
    complete template -> R-STRICT-1 STRICT) -- never a parallel store;
    apply_assumption_routing carries the safe refs on the template
    (assumption_refs, input never mutated, refs survive capture).
  AC-02: >-
    The computation surface is split by stage: execution and analysis
    templates are separate instances with disjoint required parameter
    sets (execution requires software/method/functional/convergence
    inputs; analysis requires property/convergence_metric/sampling
    validation inputs -- test_comput_analysis requires the validation
    parameters), the stage must be explicit at construction, and each
    surface is frozen independently by freeze_computation_template (a
    pure function gated by check_action_allowed(role, Action.PLAN_FREEZE)
    -> PermissionDeniedError with the full assessment R-PRM-D1 for
    non-Supervisor roles, R-PRM-SUP1 for the Supervisor; the frozen copy
    rejects every field mutation; the input template is never mutated;
    the freeze state is recorded in the deterministic capture).
  AC-03: >-
    The universal rule tables carry no instance data: the FDM-201
    reference chemistry (vasp/PBE/DFT-D3/PAW/(3,3,2)/520.0/1e-5;
    raspa/DREIDING/qeq/lorentz_berthelot/12.0/298.0/1.0/20000/40000/seed)
    appears ONLY as instance data in test fixtures -- proven by the AST
    segment scan of COMPUTATION_PARAMETER_RULES and
    COMPUTATION_VALUE_RULES for the fixture tokens (module-level scan
    covers 12 tokens; rule-table segment scan covers
    vasp/raspa/gromacs/pymatgen/PBE/DREIDING) and the import-root
    whitelist (deterministic modules only, no random/time/os/network/IO
    anywhere -- string scan of 19 forbidden tokens). SchedulerOptions
    (AC-03 slurm/modules surface) validates partition/account/qos/nodes/
    tasks_per_node/walltime_hours with value rules and modules as a
    non-empty tuple of strings, serializes deterministically via as_dict,
    and is a TEMPLATE option, never an Assumption Registry input (11
    parametrized rejections + TypeError + FrozenInstanceError). Value
    rules cover 34 named parameters (38 parametrized rejections + the
