design_review:
  pure_descriptor_layer: >-
    The contract layer is a deliberately pure descriptor subsystem: frozen
    dataclass records with no runtime execution, no file I/O, no wall
    clock, no randomness (no timestamp-like fields, no random/uuid/time/
    datetime imports in the module, asserted by import scanning); every
    record validates its own contract in __post_init__ (str types and
    shapes, role id pattern and vocabulary, version pattern, frozenset
    types, Action members, no allowed/forbidden overlap, practice-token
    pattern, non-empty truth_sources of CoreStateApi members,
    state_object_types subset of core.models.SCHEMA_NAMES, typed
    authorities, non-empty prompt directives); deterministic contract ids
    (generate_id("role_contract", role_id, contract_version),
    sr_role_contract_<32 hex>, computed once via object.__setattr__ and
    caller-supplied values rejected); canonical sorted serialization with
    lossless from_dict round-trip and stable ValueError-subclassed errors
    (RoleContractError / UnknownRoleContractError) with one-line messages.
  matrix_grounding_both_directions: >-
    validate_role_contracts proves AC-01 consistency against the frozen
    runtime matrix (DEV-M6-G03, core.permissions) in both directions:
    every allowed_action must be granted to at least one of the
    contract's matrix role(s) and every forbidden_action must be denied
    to all of them (least privilege) -- plus the typed-authority closure
    rules (a contract without Supervisor verdict authority must forbid
    every VERDICT_ACTIONS member; without Supervisor decision authority
    must forbid every DECISION_ACTIONS member, the full DecisionType
    mapping). The frozen table passes; a candidate table granting
    GOAL_CREATE to Research is rejected with the stable "locked
    role-action matrix denies" message. The worker contract is the union
    of the four worker roles' grants, and every union member is verified
    granted to at least one worker role.
  core_state_as_truth: >-
    AC-02 is enforced at every layer: the truth-source vocabulary is a
    two-member StrEnum (STATE_BACKEND / EVENT_LOG) whose import paths are
    resolved against the real modules via importlib in the tests;
    state_object_types are validated against the real core.models
    SCHEMA_NAMES registry in the constructor itself; the serialized
    record carries no memory reference (token scan over six memory
    phrases on both the canonical JSON and every free-text field); and
    the STATE_TRUTH_RULE names the state backend and the event log and
    negates remembered conversation in prompt-facing text, identical
    across all four contracts.
  worker_boundary_explicit: >-
    AC-03 is encoded three ways so no platform adapter can drop it: the
    matrix-action vocabulary (plan-mutation actions fully forbidden,
    disjoint from allowed), the practice-token vocabulary (plan_mutation,
    self_acceptance, self_review, self_merge) and the prompt directives
    ("never mutate the frozen Plan, acceptance criteria or protocol",
    "never declare PASS/FAIL or accept your own output"). The runtime
    cross-check pins the contract to the enforced matrix boundary for all
    four worker roles, and the boundary-hygiene test asserts no other
    contract silently holds acceptance surfaces (the Supervisor alone is
    the acceptor).
  agent_descriptors_consistent: >-
    The four .claude/agents/ markdown descriptors (supervisor, research,
    execution-monitor, worker) mirror their RoleContract records field by
    field: mission text, truth sources with the real Core API paths,
    authority may/may-not lists matching the matrix grants and
    forbidden_actions, the forbidden-practice vocabulary and the
    must/must-not prompt sections -- so a platform adapter derived from
    either artifact carries the same boundaries.
  observations: >-
    The pyright diagnostics reported alongside the worker completion are
    a pre-fix snapshot: the worker fixed 11 auto-fixable unused-import /
    import-order issues during development, and the authoritative gates
    (ruff with F401 selected, mypy, pytest, CI) are all clean on the
    final head. The remaining pyright noise is the known classes
    (test-file "import could not be resolved" from a scanner without an
    editable install; FrozenInstanceError mutation tests on frozen
    dataclass fields at test_contracts_hygiene lines 62-64; TypeError
    boundary raises narrowing as "unreachable"). One harmless note, not a
    finding: RoleContract.contract_id rejects a caller-supplied value
    only when truthy (an empty-string pass is equivalent to omitting it);
    the computed value is set at construction either way, so no behavior
    is affected.

