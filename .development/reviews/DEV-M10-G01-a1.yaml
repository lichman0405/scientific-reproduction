    notes: >-
      The authority boundaries match the locked role spec (03-ROLE-AND-
      PERMISSION-SPEC.md SS2-SS8) on both sides: every contract's
      allowed_actions equals its matrix grant (supervisor = all of
      ACTION_ORDER; research = RESEARCH_ACTIONS; monitor = MONITOR_ACTIONS;
      worker = the union of the four worker roles' grants) and the spec's
      "may not" lists appear in forbidden_actions, each denied by the
      frozen runtime matrix (R-PRM-D1 least privilege on both sides). The
      cross-boundary test proves no non-Supervisor contract holds any
      Supervisor-exclusive surface (plan freeze/revision, verdicts,
      dispatch, research requests), and the typed authority fields
      (DecisionAuthority SUPERVISOR_ONLY vs NONE; VerdictAuthority
      SUPERVISOR_ONLY vs REPORT_FACTS; RetryAuthority
      SUPERVISOR_ONLY/PREAUTHORIZED_ENGINEERING/WHITELISTED_ENGINEERING/
      NONE) mirror the spec sections role by role; non-Supervisor
      contracts must explicitly forbid the full decision and verdict
      action sets -- the boundary is encoded, not implied.
  AC-02:
    status: PASS
    evidence:
    - test_contracts_ac02_every_contract_names_core_state_api_truth_sources
    - test_contracts_ac02_state_object_types_are_normative_core_types
    - test_contracts_ac02_serialized_contracts_contain_no_memory_reference
    - test_contracts_ac02_truth_rule_names_core_state_and_negates_memory
    - test_contracts_ac02_prompt_directives_ground_decisions_in_state
    notes: >-
      Every contract references Core state as the only truth source,
      never conversation memory: truth_sources are exactly the two
      CoreStateApi members (STATE_BACKEND / EVENT_LOG), resolved via
      importlib against the real modules (StateBackend / ProjectEventLog,
      a rename breaks the test); state_object_types are normative
      core.models.SCHEMA_NAMES entries only (enforced both in the record
      constructor and per test); the canonical serialization and all
      free-text fields are token-scanned for six memory-reference phrases
      (conversation memory / chat memory / llm memory / remembered
      context / recall from conversation / from memory) and contain none;
      the prompt-facing STATE_TRUTH_RULE names the state backend and the
      event log and explicitly negates an agent's remembered conversation;
      prompt directives anchor decisions in persisted state records
      ("read project state from the Core state backend before acting").
  AC-03:
    status: PASS
    evidence:
    - test_contracts_ac03_worker_contract_forbids_plan_mutation_actions
    - test_contracts_ac03_worker_contract_forbids_plan_mutation_practice
    - test_contracts_ac03_worker_contract_forbids_self_acceptance_practices
    - test_contracts_ac03_worker_contract_has_no_acceptance_or_verdict_authority
    - test_contracts_ac03_worker_plan_mutation_is_runtime_denied_for_every_worker_role
    - test_contracts_ac03_only_worker_contract_carries_the_self_acceptance_prohibition
    notes: >-
      The Worker contract forbids plan mutation and self-acceptance
      explicitly and in its own vocabulary: the plan-mutation action set
      (PLAN_FREEZE, GOAL_REVISION, ACCEPTANCE_REVISION,
      ANALYSIS_PROTOCOL_REVISION, GOAL_CREATE/MUTATE/FROZEN_GOAL_MUTATE,
      RECOVERY_GOAL_CREATE) is fully in forbidden_actions and disjoint
      from allowed_actions; the practice token plan_mutation and the
      prompt prohibition "never mutate the frozen Plan" encode the same
      boundary in contract words; self_acceptance / self_review /
      self_merge are practice tokens with the prompt prohibition "never
      declare PASS/FAIL or accept your own output"; the contract carries
      no acceptance/verdict authority; and a runtime cross-check asserts
      every worker role of the frozen matrix denies every plan-mutation
      action, so the contract describes the enforced boundary (DEV-M6-G03/
      G05) exactly.

