      with FileExistsError on an existing target, so two concurrent
      claimers cannot both succeed; docstring explains why os.replace alone
      (overwrite-only) cannot express create-if-absent. LeaseStore.acquire
      re-decides from fresh reads (bounded 3-pass loop). Tests: interleaved
      os.replace simulation, interleaved create-step race (barrier inside
      os.link, fresh + expired-takeover variants), and real two-backend/
      two-thread claims on the same base dir (10 rounds) — every race
      yields exactly one Lease and one LeaseHeldError, on-disk record
      complete and matching the winner. Independent rerun at head 99784b8:
      45 passed, exit 0.
  - criterion_id: AC-02
    result: PASS
    evidence: >-
      Expiry decided only by the store's injectable now callable (default
      time.time): expired leases are taken over deterministically with new
      owner/expiry recorded; expiry at the exact boundary is recoverable;
      corrupt records are treated as stale and claimable; renew on an
      expired lease raises LeaseExpiredError leaving the record
      recoverable; valid lease blocks claimers up to the expiry instant.
      No sleeps, no wall-clock dependence (tests inject the clock).
  - criterion_id: AC-03
    result: PASS
    evidence: >-
      Lease record carries object_type, object_id, owner, per-grant nonce,
      acquired_at, expires_at, ttl; tests verify grant fields, get()
      round-trip, raw on-disk JSON, canonical deterministic serialization,
      and that recovery/renew write new owner/expiry into the record
      (nonce distinguishes successive grants). renew keeps grant identity;
      release refuses to delete a record held by a different grant.
