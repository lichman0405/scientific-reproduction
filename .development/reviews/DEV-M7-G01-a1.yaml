ac_evidence:
  AC-01: >-
    dispatch() performs the outgoing handoff to <base_dir>/<outgoing>/<RUN_ID>/
    (10-EXPERIMENT-SUBSYSTEM.md SS2 lab/outgoing/<RUN_ID>/): the execution
    manifest, the optional artifacts and the frozen DispatchRecord are written
    via core.atomic.atomic_write as canonical JSON (sorted keys, 2-space
    indent, trailing newline; byte-identical across independent roots --
    test_dispatch_ac01_deterministic_bytes_identical_outputs). The REAL schema
    gate runs before any write: core.schema_validation.validate_and_reject
    against the frozen lab-execution-package schema, and a malformed package
    raises SchemaValidationError loudly with nothing written -- not even the
    handoff directory (test_dispatch_ac01_malformed_package_refused_loudly_
    nothing_written; every required schema field parametrized in
    test_dispatch_ac01_schema_gate_rejects_every_required_field). Dispatches
    are exactly-once: the dispatch_id is a pure function of the package
    identity (core.ids.generate_id("dispatch", package_id, run_id)),
    re-dispatching raises DuplicateDispatchError and the original handoff
    bytes are never overwritten (test_dispatch_ac01_duplicate_dispatch_refused_
    and_original_untouched). Run ids and artifact names are rejected before
    any write when not safe path segments (is_safe_path_segment, no '/', no
    '\', not '.'/'..', no glob metacharacters -- FND-M9-G02-01;
    test_dispatch_ac01_unsafe_run_id_refused /
    test_dispatch_ac01_unsafe_artifact_name_refused). No wall clock: the
    timestamp is caller-injected (dispatched_at; test_dispatch_ac01_injected_
    timestamp_recorded). The typed frozen LabExecutionPackage model is
    accepted through the same schema-gated path (test_dispatch_ac01_accepts_
    typed_lab_execution_package). The adapter derives every path from the
    injected base_dir and directory names (test_dispatch_ac01_writes_only_
    within_injected_paths).
  AC-02: >-
    collect() associates the returned Result Package with the correct Run by
    exact identity: the pure evaluate_result_manifest decides run_matched /
    package_matched by exact key equality between the returned manifest's
    run_id/package_id and the dispatch record's (never directory-based
    guessing); a manifest with NO run reference, a DIFFERENT run, or a
    DIFFERENT package_id raises CollectionRejectedError carrying the full
    ResultManifestAssessment with both the actual and the expected ids
    (test_collect_ac02_manifest_without_run_reference_refused,
    test_collect_ac02_manifest_with_different_run_refused_never_matched,
    test_collect_ac02_manifest_with_different_package_refused). A successful
    collection returns the typed LabResultManifest whose run_id exactly
    matches the Run of the dispatch and the sorted collected files
    (test_collect_ac02_returned_package_associated_with_correct_run);
    collecting before any result is a defined ResultNotAvailableError, never
    a guessed collection.
  AC-03: >-
    Missing required result manifest/data is DETECTED as a decision record,
    never a silent default: the frozen RESULT_MANIFEST_REQUIRED_FIELDS
    vocabulary (manifest_version, package_id, project_id, goal_id, run_id,
    files) is enforced with a parametrized rejection per field
    (test_collect_ac03_missing_required_manifest_field_detected over all 6);
    declared data files absent from the incoming handoff are recorded by name
    (missing_files, test_collect_ac03_missing_declared_data_file_detected);
    the dispatched package's required_return entries not covered by the
    returned declaration are recorded (unmet_required_returns,
    test_collect_ac03_unmet_required_return_detected); every deficiency is
    recorded at once (test_collect_ac03_multiple_missing_items_all_recorded).
    The pure evaluator returns the EXACT same assessment the refused
    collection carries (== equality, test_collect_ac03_detection_is_a_decision_
    record_not_a_silent_default); corrupt operator data (unparseable result
    manifest, missing execution manifest, malformed required_return) raises
    the stable LabAdapterDataError, never a silent acceptance
    (test_collect_corrupt_result_manifest_refused).
