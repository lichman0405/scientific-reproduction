    notes: >-
      One completed expansion cycle with zero new eligible hypotheses yields
      consecutive_zero_novelty_cycles == 1 < required 2 -> NOT_SATURATED
      (R-SAT-S2). Proven independent of the recorded family-coverage state
      (True/False/None all stay NOT_SATURATED) and the run after a single
      zero-novelty cycle is exactly 1, never 2.
  AC-02:
    status: PASS
    evidence:
    - test_saturation_ac02_two_consecutive_zero_novelty_cycles_satisfy_v01
    - test_saturation_ac02_zero_then_novel_breaks_the_consecutive_run
    - test_saturation_ac02_zero_incomplete_zero_breaks_the_consecutive_run
    - test_saturation_ac02_novel_cycle_resets_the_consecutive_counter
    - test_saturation_ac02_three_consecutive_zero_novelty_cycles_still_satisfy
    - test_saturation_ac02_non_expansion_cycle_breaks_the_consecutive_run
    - test_saturation_ac02_required_cycle_count_is_the_frozen_configurable_rule
    - test_saturation_ac02_empty_history_is_unresolved
    - test_saturation_ac02_history_ending_in_an_incomplete_cycle_is_unresolved
    notes: >-
      Two consecutive completed expansion cycles with zero new eligible
      hypotheses: run 2 >= required 2 -> SATURATED (R-SAT-S1), including
      before family coverage is recorded. The consecutive run breaks on a
      novel cycle (zero+novel = NOT_SATURATED), on an incomplete cycle
      (zero, incomplete, zero -> run 1), and on a non-expansion cycle; a
      novel cycle resets the counter; three zeros still satisfy (AT LEAST
      two). The required count is the frozen configurable field of the
      record (schema minimum 1, default 2; required=3 changes the verdict,
      required=0 rejected with a stable SaturationRecordError ">= 1").
      Empty history and history ending in an incomplete cycle are
      UNRESOLVED (R-SAT-D1), the count field staying None (the frozen
      ClosureLiterature default).
  AC-03:
    status: PASS
    evidence:
    - test_saturation_ac03_default_eligibility_references_the_core_rules
    - test_saturation_ac03_eligibility_rule_built_from_core_threshold_gates
    - test_saturation_ac03_eligibility_rule_references_the_research_reliability_layer
    - test_saturation_ac03_tracker_counts_only_new_eligible_hypotheses
    - test_saturation_ac03_tracker_uses_the_threshold_rule_object
    - test_saturation_ac03_tracker_is_deterministic_and_order_preserving
    - test_saturation_ac03_tracker_feeds_the_cycle_record
    notes: >-
      V01_ELIGIBILITY_RULE (R-ELIG-V01) is composed from the core hard-gate
      rules reliability_gate_passes/directness_gate_passes at the frozen v0.1
      thresholds (Reliability >= 3, Directness >= 2, actionable = true) and
      is behaviorally identical to the canonical recovery_hypothesis_eligible
      gate over the full 5x5 Reliability x Directness grid (25 checked).
      The research-layer hook R-ELIG-C1 re-derives Reliability from the
      STORED checklist record via research/reliability.py (R-REL table): the
      stored record is authoritative over the assessment's stored axis, an
      unstored checklist reference is never eligible, and the Directness gate
      still applies. The tracker counts only NEW eligible hypotheses
      (eligible-but-known and ineligible never count), accepts a versioned
      eligibility rule object (not an evaluation-time knob), is
      deterministic and order-preserving, and feeds the stored cycle record.
      NOTE: worker claimed 6 AC-03 tests; the file contains 7 (the extra,
      test_saturation_ac03_tracker_feeds_the_cycle_record, bridges the
      tracker into the SearchCycle record). Claimed number under-counted;
      coverage is a superset of the claim.

