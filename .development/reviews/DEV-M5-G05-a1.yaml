design_review:
  rule_table: >-
    SATURATION_RULES is an ordered first-match-wins table
    [R-SAT-S1 (met), R-SAT-S2 (below), R-SAT-D1 (total default)]; the
    trailing total default closes the table so every recorded history gets
    exactly one verdict (assessments assert a matched_rule_id, decisions
    record every rule with its matched flag). Verified by
    test_saturation_rule_table_is_total_with_a_default over 6 record
    shapes.
  consecutive_run: >-
    consecutive_zero_novelty_run is a pure function of the recorded cycles:
    a completed expansion cycle with zero new eligible hypotheses extends
    the run; a novel completed expansion cycle resets it to 0; any other
    cycle (incomplete, non-expansion) breaks it to None. Only a trailing
    run of zeros counts, matching 09-RESEARCH-SUBSYSTEM.md SS7 and
    08-STRICT-RECOVERY-CLOSURE.md SS4.
  frozen_configurability: >-
    The required count is a frozen field of the record/assessment
    (required_zero_novelty_cycles, schema minimum 1, default 2) and the
    eligibility threshold is a versioned rule object (R-ELIG-V01 /
    R-ELIG-C1) with version constants SATURATION_RULESET_VERSION /
    ELIGIBILITY_RULESET_VERSION - "configurable and frozen", never
    evaluation-time knobs.
  closure_composition: >-
    to_closure_literature() fills exactly the three frozen ClosureLiterature
    fields; test_saturation_assessment_composes_with_the_frozen_closure_gate
    proves composition behaviorally through the frozen core closure gate
    (evaluate_closure): families completed AND run >= required -> SATISFIED;
    either missing -> NOT_SATISFIED/UNRESOLVED. This is the normative
    reading: research saturation is the closure layer's composition, not an
    independent verdict.
  validation: >-
    Strict __post_init__ validation: strictly increasing cycle indexes
    (out-of-order/duplicate histories rejected, never silently
    reordered), no defaults on the four essential cycle facts (index,
    family, completed, novelty count), tri-state family coverage, non-empty
    hypothesis refs, unknown from_dict keys rejected. TypeError at public
    boundaries, ValueError-subclass errors (SaturationRecordError /
    SaturationEligibilityError / SaturationError) with stable messages.
  paradigm: >-
    Frozen immutable dataclasses (FrozenInstanceError on mutation),
    pure deterministic functions (equal records -> equal assessments),
    versioned constants, rule-engine paradigm consistent with the frozen
    spec package and prior M2/M5 modules (core/rules/evidence,
    core/rules/closure, research/reliability).

