design_review:
  audit_gate: >-
    freeze_plan's AC-01 gate is audit_inventory_registry(project_root)
    recomputed at freeze time; the plan's embedded inventory_audit
    snapshot is never trusted. All failure checks (draft status, version,
    freshness, already-frozen, audit, goal-family closure) precede any
    write -- no record is written by a prohibited freeze.
  freshness_guard: >-
    PlanStateMismatchError rejects stale plan objects: the plan must equal
    the registered draft at its version or (when none is registered) the
    deterministic build_plan_v1 of the current registered state. Conflicting
    registered drafts are also rejected (verified by direct file
    tampering in the test).
  frozen_family: >-
    PlanFreezeResult is a frozen dataclass; the frozen goal-contract
    family is built in memory with per-model field handling (version /
    protocol_version / frozen / frozen_at / frozen_commit where the model
    declares them; the nested GoalAcceptance is frozen too; ClosureContract
    carries no version fields) -- the persisted artifact is only the Plan
    record, drafts stay drafts byte-identical.
  supersession: >-
    SUPERSEDED_RULES is an ordered first-match-wins table
    [R-SUP-D1 (DRAFT never superseded), R-SUP-S1 (defensive), R-SUP-P1
    (FROZEN + newer version -> SUPERSEDED), R-SUP-F1 (total default ->
    FROZEN)]; assessements record input + decision trace + matched_rule_id
    + ruleset_version ("1.0"). SUPERSEDED is a computed lineage status --
    the stored record bytes are never rewritten (AC-03).
  determinism: >-
    build_plan_v1 is a pure function of registered state (plan_id from
    core.ids.generate_id, sorted distinct goal_ids from requirement
    mappings, sorted requirement_ids, recomputed audit view, empty
    work_packages/resource_ids -- the DAG arrives with DEV-M4-G05);
    freeze uses an injectable timestamp (naive datetimes rejected);
    registries serialize canonical JSON (sorted keys, indent 2);
    frozen plans equal across workspaces.
  registry_safety: >-
    Version-keyed plans/<version>.json and goals/ acceptance/ protocols/
    closure/ registries: schema-validated before persistence
    (validate_and_reject), atomic writes, immutable-functional (no
    clobber), id path-escape validated (no '/', no '\\', not '.'/'..'),
    corrupt records rejected with stable "corrupt <kind> record" errors.
  paradigm: >-
    TypeError at public boundaries; ValueError-subclass error hierarchy
    (PlanError/GoalFamilyError/FreezeError -> PlanningError -> ValueError);
    stable messages; frozen dataclasses; rule-engine paradigm consistent
    with prior M2/M4 modules. frozen_commit = pre-freeze git HEAD, None
    (documented) outside a git repository -- the plan.freeze checkpoint
    commit stays Supervisor-owned per 14-STATE-GIT-ARTIFACTS.md SS5.

