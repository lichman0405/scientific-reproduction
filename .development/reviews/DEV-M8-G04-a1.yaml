design_review:
  reconstruction_contract: >-
    reconstruct() builds the replacement view from three durable sources
    (registry watch files, checkpoint, Run records + event log) with
    every read wrapped into the stable error taxonomy:
    CorruptRecoveryStateError for corrupt watch/checkpoint/event-log/
    missing-or-corrupt Run record/>1 completion event per run/completion
    event without a result-bearing Run record (internally contradictory
    durable state), RecoveryContractError for an external-identity
    mismatch between the Run record and the watch entry. Corrupt
    persisted state fails loudly, never silently -- nothing is skipped.
    The RecoveredCompletion record honestly distinguishes durable facts
    (run record authoritative for completed; checkpoint completion
    marker = observed RESULT_AVAILABLE AND reconciled_at set), so a
    crash-window state (run transitioned, bookkeeping cut short) is
    reported truthfully and the resumed engine converges it -- no
    fabrication, no overclaiming.
  observation_only_discipline: >-
    AC-02 is engineered, not asserted: the dispatch hook is exposed as a
    property but has no call site anywhere in recovery.py (verified in
    the code); reconstruction performs only reads; every write flows
    through the reused ReconcileEngine's registry/checkpoint/run
    store/event log. Zero-dispatch is proven with an injected counter
    across reconstruction and the resumed pass, and byte-identity is
    proven before/after.
  reuse_over_reimplementation: >-
    resume_engine() returns a fresh ReconcileEngine bound to the same
    injected dependencies (clock, monitor_id, probe, run_store,
    event_log) -- the DEV-M8-G02 exactly-once machinery (deterministic
    event ids, reconcile.completed:<run_id> idempotency key, checkpoint
    completion marker) is reused untouched, never reimplemented. The
    AC-03 outage scenario therefore inherits the exactly-once proof from
    DEV-M8-G02 and adds the reconstruction-specific guarantees (the
    single event resolved by the idempotency key, verified on disk).
  determinism_and_discipline: >-
    Injected clock (FakeClock fixed stamp; the resumed engine's clock
    consultation asserted), deterministic sorted traversal (watched set
    from the registry's sorted list; RecoveryPlan itself validates
    sorted-unique run_ids on every collection and completions reference
    only watched runs), canonical sorted JSON through the stores,
    byte-identity of the reconstructed plan across two identical
    directories. TypeError at every public boundary (state_dir/now/
    probe/dispatch/run_store/event_log), stable MonitoringError
    subclasses (RecoveryError -> CorruptRecoveryStateError /
    RecoveryContractError), no wall clock, no secrets in persisted
    bytes (credential-shaped scan over all three directories after a
    full outage-reconcile scenario), and the no-adapters boundary is
    proven in a fresh interpreter (monitoring package import leaves
    scientific_reproduction.adapters out of sys.modules).
  type_ignore_audit: >-
    All 6 # type: ignore[arg-type] comments (test_recovery_monitor.py
    lines 1024-1040) are deliberate wrong-type boundary passes under
    pytest.raises(TypeError) -- the house boundary-test pattern (same
    judgment as DEV-M7-G04, DEV-M8-G01 and DEV-M8-G02); none masks a
    real defect. The pyright "unreachable" diagnostics at recovery.py
    lines 376-398 are the six TypeError boundary raises (pyright's
    static narrowing proves the annotated types cannot hit them at
    runtime -- which is exactly what the boundary tests exercise with
    type-ignored wrong values); the missing-import diagnostics in the
    test file are stale snapshots from pyright scanning without the
    editable install. No other ignores or noqas anywhere.

