acceptance_criteria:
  AC-01:
    status: PASS
    evidence:
    - test_ac01_fresh_recovery_reconstructs_watch_set_and_progress
    - test_ac01_fresh_recovery_yields_resumable_reconcile_configuration
    - test_ac01_empty_state_directory_yields_empty_plan
    notes: >-
      A fresh MonitorRecovery object over the same state directory
      reconstructs the full watched set (from the WatchedRunRegistry
      files), the per-run checkpoint progress and the completion facts
      (from the persisted Run records' lifecycle state and the
      append-only event log's external_status_change records) from the
      durable state alone -- no original-conversation artifact is ever
      involved (asserted with a fresh instance and no reference to the
      original engine). resume_engine() returns the resumable reconcile
      configuration: a FRESH ReconcileEngine bound to the same state
      directory with the same injected clock, monitor identity, probe
      seam, run store and event log (identity of injected dependencies
      asserted), and its resumed pass over already-recorded state
      re-emits nothing (completed_count 0, event log and state bytes
      identical). An empty state directory yields a deterministic empty
      plan.
  AC-02:
    status: PASS
    evidence:
    - test_ac02_reconstruction_performs_zero_external_job_creation
    - test_ac02_reconstruction_writes_nothing_and_state_stays_byte_identical
    - test_ac02_replacement_resume_never_reemits_durably_recorded_state
    notes: >-
      Reconstruction is observation-only, proven three ways: (a) an
      injected CountingDispatch hook -- the seam through which a
      replacement session would create external jobs -- records ZERO
      calls across reconstruction AND the resumed reconciliation pass
      (the dispatch property is exposed but never invoked anywhere in
      recovery.py, verified in the code); (b) the durable state (watch
      entries, checkpoint, Run records, event log) is byte-identical
      before and after reconstruction, and the plan equals the durable
      state read back independently -- no hidden re-dispatch, no hidden
      mutation; (c) resuming reconciliation through the DEV-M8-G02
      ReconcileEngine over already-durably-recorded state re-emits
      nothing: completed_count 0, the single completion event stays
      single (sequence 1), event-log and state bytes identical, zero
      dispatch calls.
  AC-03:
    status: PASS
    evidence:
    - test_ac03_completion_during_outage_reconciled_by_replacement_first_pass
    - test_ac03_outage_completion_appends_single_event_with_idempotency_key
    - test_ac03_stale_running_observation_is_overridden_by_replacement_pass
    - test_ac03_mixed_outage_and_pre_outage_runs_reconciled_exactly_once
    notes: >-
      A completion that occurred while the original Monitor was down
      (external state became RESULT_AVAILABLE during the outage; durable
      state holds the watch entry and a RUNNING_EXTERNAL Run record with
      NO event and NO checkpoint from the original Monitor) is reconciled
      by the replacement's first reconciliation pass: reconstruct()
      honestly reports the run as not durably completed (completed
      False), and the resumed ReconcileEngine pass moves the Run to
      RESULT_AVAILABLE through the REAL transition machinery, appends
      exactly ONE external_status_change event (actor execution-monitor,
      from RUNNING_EXTERNAL, to RESULT_AVAILABLE, stable reason) under
      the deterministic idempotency key reconcile.completed:<run_id>
      (recorded on disk with the key, sequence 1), and records the
      checkpoint progress -- exactly once: repeated replacement passes
      (and a third fresh pass) resolve to the single original record,
      never a duplicate, never a sequence advance. A stale RUNNING
      observation recorded before the outage is overridden by the first
      pass; a mixed watch set (pre-outage completed + outage completed)
      completes only the outage run this pass with exactly one event per
      run.

