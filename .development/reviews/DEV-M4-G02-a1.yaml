comments:
  - >-
    Scope check: 3 files changed, all ADDED — src/scientific_reproduction/
    planning/inventory.py (+1002), tests/planning/test_inventory.py
    (+1043), tests/planning/inventory_helpers.py (+92). The helper file
    follows the established M4-G01 precedent (tests/planning/init_
    helpers.py exists in main; "helpers.py" would collide with the
    pytest module name) — within the test_inventory* scope's intent.
    planning/init.py, core/models.py and schemas untouched (frozen);
    planning/__init__.py deliberately untouched (out of scope, will be
    re-exported when the planning subsystem completes). Single
    conventional commit 2899e4f [DEV-M4-G02] above merge base 2417647,
    no amend, no force-push, no tests deleted or weakened (purely
    additive, +38). PR #27 mergeStateStatus CLEAN; CI both jobs
    SUCCESS; head equals the reviewed head.
  - >-
    Design reviewed — rule table R-MAP-X1/A1/M1/U1 is ordered,
    first-match-wins, with the trailing U1 default making it total;
    ItemMappingInput is frozen with the registered requirement set as a
    frozenset, so "same state -> same status" is directly testable and
    counting is order-independent by construction (AC-02). The
    AMBIGUOUS state is explicit rather than silently omitted
    (DEV-M12-G02), with stable ambiguity_notes naming the unresolved
    ids. AC-01 is transitive through the frozen schema edges
    (item.requirement_ids -> requirement.goal_ids, 05-GOAL-RUN-SCHEMA.md
    SS2); AC-03 provenance is carried on every edge and persisted
    losslessly in the registry records. Registration semantics are
    sensible and documented: schema validation via validate_and_reject
    before persistence, canonical JSON via core.atomic.atomic_write,
    deterministic id generation from canonical fields
    (core.ids.generate_id) so duplicate registration is detectable even
    without curated ids, registry ids validated as single path segments
    (no file escape), items-first authoring order enforced by
    UnresolvedItemReferenceError while goal references may be forward
    (schema bidirectional; Goal records arrive in DEV-M4-G04), and the
    stored mapping_status snapshot is explicitly never trusted for
    counting (summaries recompute — tested). Error discipline: TypeError
    at public boundaries (str/bytes explicitly rejected for sequences),
    ValueError-subclass error hierarchy with stable, path-free messages
    (worker documented the path-free fix: absolute paths are not stable
    across roots); corrupt-record reads raise generic ValueError with
    the path (documented, distinct from the stable-message hierarchy).
    Paradigm: frozen dataclasses, pure deterministic functions (no wall
    clock/randomness — the models carry no timestamps), __all__ exports,
    docstrings citing 05-GOAL-RUN-SCHEMA.md SS2, templates/PROJECT-TREE,
    14-STATE-GIT-ARTIFACTS.md SS2/SS3, 00-README.md,
    01-PRODUCT-REQUIREMENTS.md SS5, 23-DEVELOPMENT-GOAL-CATALOG.md
    DEV-M12-G02, core/models.py PlanInventoryAudit. The documented
    frozen-model readings (transitive mapping, explicit AMBIGUOUS,
    deterministic duplicates, items-first authoring, snapshot-vs-
    recompute) are honest, correct resolutions. No flake occurrence on
    this PR (local runs and CI green).
  - >-
    Pyright IDE diagnostics are the established noise classes: the
    "unreachable" flags point at the defensive TypeError raises on typed
    parameters and the R-MAP-U1 "unreachable default" matched_status
    initializer; the unused-lambda-parameter flags come from the uniform
    rule-table predicate signatures; remaining flags are stale snapshots
    from pyright resolving against the main repo instead of the
    worktree. mypy, the configured gate, is clean on 45 source files and
    CI both jobs PASS.
