criteria:
  - criterion_id: AC-01
    result: PASS
    evidence: >-
      Log API exposes no update/replace/delete methods (tested); re-append
      of an existing event_id raises DuplicateEventIdError even with a
      fresh idempotency key; record files stay byte-identical across
      appends, listing, replay, and rejected duplicates. The underlying
      backend retains delete for operational repair but the log does not
      expose it (documented). Independent rerun at head 9091fb8: 21
      passed, exit 0.
  - criterion_id: AC-02
    result: PASS
    evidence: >-
      Same idempotency key re-submission returns the existing record
      (replayed=True) even with a different event id — exactly one record
      on disk; different keys yield distinct events; 16 concurrent
      same-key appends produce exactly one record (1 fresh + 15 replays);
      stale claims (crash between claim and record write) reclaimed
      deterministically. Claims use O_CREAT|O_EXCL atomic create-if-absent
      (sha256-named claim files), so a key can never map to two events.
  - criterion_id: AC-03
    result: PASS
    evidence: >-
      list_events orders by (sequence, event_id); fresh ProjectEventLog
      over the same base dir returns the identical order; order
      recoverable from record files alone and the next append continues
      past the max recorded sequence even with the counter deleted;
      sequences strictly increasing 1..N, never reused (counter written
      before the record it numbers, so a crash leaves a gap, never a
      repeat); idempotent replay never advances the sequence; 8-thread
      concurrent appends give 200 unique records with sequences 1..200
      matching disk order.
