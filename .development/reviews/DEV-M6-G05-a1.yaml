  AC-01: >-
    Forbidden plan mutation is blocked by the RUNTIME, not only by prompt
    instructions: adversarial "naive worker" fixtures carry instruction
    documents whose granted_actions WOULD permit the forbidden mutation, and
    the real runtime guards (workers/permissions.py enforce_* functions,
    decided by the frozen role-action matrix in core/permissions.py) still
    raise the stable one-line PermissionDeniedError with the full assessment
    (R-PRM-D1, input role+action, == check_action_allowed result) --
    test_governance_ac01_naive_worker_cannot_mutate_the_frozen_goal (6
    non-Supervisor roles), test_governance_ac01_naive_worker_cannot_make_plan_
    decisions (6 roles x 11 DecisionTypes = 66 cases), test_governance_ac01_
    naive_monitor_cannot_classify_pass_or_fail (SCIENTIFIC_INTERPRETATION),
    test_governance_ac01_naive_worker_cannot_create_a_recovery_goal (6 roles),
    test_governance_ac01_naive_worker_cannot_close_the_registered_requirement
    (6 roles against the REAL registered REQ-1 record). The guard protects the
    REAL frozen contract artifact: the one-shot real plan-freeze flow's Goal
    (frozen v1) AND the persisted frozen Plan record, plus the registered
    draft goal (GOAL_MUTATE denied) -- test_governance_ac01_guard_protects_the_
    real_frozen_contract. Positive control: the Supervisor keeps every
    governance surface with R-PRM-SUP1 (goal mutation, all plan decisions,
    Recovery entry, closure, interpretation) -- test_governance_ac01_
    supervisor_still_holds_every_governance_surface. Two-sided boundary:
    workers keep exactly their matrix may-lists and nothing beyond
    (test_governance_ac01_workers_keep_exactly_their_may_lists). Full M6
    chain (G01 context contract + G03 matrix + G04 evaluator): the context
    package grants only retry:<failure> engineering actions (forbidden_
    actions retry:protocol_deviation), the retry evaluator routes the
    supervisor-required change away from automatic action (R-RET-S1,
    SUPERVISOR) while authorizing the whitelisted failure (R-RET-A1,
    AUTOMATIC), and the matrix denies SCIENTIFIC_PARAMETER_CHANGE (R-PRM-D1)
    -- test_governance_ac01_context_grants_only_engineering_retries_and_no_
    plan_actions, test_governance_ac01_forbidden_retry_is_contract_
    prohibition_and_runtime_denial. Denied assessments carry the frozen
    matrix ruleset version (test_governance_ac01_denied_assessment_carries_
    the_frozen_ruleset_version).
  AC-02: >-
    The worker context leak fixture fails if unrelated refs are exposed: the
    adversarial workspace seeds unrelated registered state into the REAL
    registries -- extra goal (GOAL-UNRELATED with artifact), extra protocol
    (ANP-LEAK-9), extra resource (RES-LEAK-9), unrelated evidence
