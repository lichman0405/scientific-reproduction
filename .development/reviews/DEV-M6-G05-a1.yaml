    generator with its RELEVANCE_FILTER_RULES minimization) exposes EXACTLY
    the goal's own reference set: exact-set equality against the canonical
    EXPECTED_REFERENCES (test_governance_ac02_adversarial_workspace_exposes_
    exactly_the_goal_refs) plus a leak-gate helper asserting every exposed
    reference is goal-owned (assert_only_goal_owned_refs_exposed) and a
    per-kind absence check over every seeded leak id (test_governance_ac02_
