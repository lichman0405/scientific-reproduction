ac_evidence:
  AC-01: >-
    The six-operation interface of 15-ADAPTER-SPEC.md section 3 /
    11-COMPUTATION-SUBSYSTEM.md section 2 is fully implemented with a
    strict state machine (prepared -> running -> completed|failed;
    prepared/running -> cancelled; terminal states decided once):
    prepare stages the durable record + working directory and is
    idempotent but rejects restaging different content; submit launches
    the staged command through the injected launcher (never twice);
    status probes a running process through the launcher and persists the
    observed completion/failure decision, while terminal states are
    answered from the durable record alone (the launcher is never
    contacted again -- test_status_of_terminal_record_is_durable_record_
    driven); cancel terminates and records the observed exit status or
    the stable TERMINATE_PENDING_NOTE; resume re-attaches by pid;
    collect registers outputs. All outcomes are frozen decision records
    (PreparedJob/SubmittedJob/JobStatus/CancelledJob/ResumedJob/
    CollectedJob) with stable to_dict; every operation validates the job
    id (ComputeJobIdentityError, sr_job_<32hex> via core.ids.is_valid_id)
    and every boundary rejects wrong types with TypeError; launch
    failure surfaces as the stable ComputeJobLaunchError and the durable
    record stays prepared (test_launch_failure_is_a_stable_decision_
    error). RunContext validates its identity-bearing shape at the
    boundary (malformed run ids and unsafe output names rejected,
    FND-M9-G02-01-style: no separators/'..'/glob metacharacters,
    duplicate outputs rejected).
  AC-02: >-
    Job identity persists independently of the worker session object:
    the durable record at <state_dir>/jobs/<job_id>.json -- not any
    in-memory session state -- holds the job's identity (job_id is a
    pure function of the run id, generate_id("job", run_id)), and every
    operation re-hydrates it from disk (the M1 recovery discipline,
    atomic_write, strict from_dict contract validation with stable
    ComputeJobRecordError for corrupt records). test_ac02_resume_from_
    durable_record_alone and test_ac02_fresh_session_status_and_collect_
    job_from_durable_record dispose the submitting session and recover
    status/collect/resume from the durable record alone (the brief's
    exact scenario, 11-COMPUTATION-SUBSYSTEM.md section 6: the original
    worker session is never a single point of failure);
    test_ac02_real_process_job_survives_worker_session drives a real
    child deterministically (launcher.wait(), no sleeps) and a fresh
    adapter instance with its own fresh launcher re-attaches by pid
    (liveness always; exit status where the OS recovers it -- POSIX
    waitpid / Windows GetExitCodeProcess via stdlib ctypes, with the
    defined exited-unknown probe mapped to the stable
    EXIT_CODE_UNAVAILABLE_NOTE and collect verifying outputs
    independently).
  AC-03: >-
    Result collection produces artifact registrations through the REAL
    DEV-M3-G02 ArtifactRegistry (14-STATE-GIT-ARTIFACTS.md SS6): each
    declared output is registered as an ArtifactManifest under
    <state_dir>/manifests/<artifact_id>.json with a deterministic id
    (generate_id("artifact", job_id, output_name)), the file's real
    SHA-256 and byte size (artifacts.checksum.compute_sha256), the run
    id and the adapter producer stamp (adapter:compute/local@v1.0) --
    test_ac03_collect_registers_artifact_manifests_through_real_registry
    asserts the on-disk manifests and every manifest field. Collection
    is exactly-once with verified idempotent re-collection
    (test_collect_recollect_is_idempotent; a conflicting already-
    registered artifact id raises ComputeCollectError); a completed job
    with a missing declared output raises the stable error naming the
    output (test_collect_missing_declared_output_raises_stable_error);
    collect requires a completed job (test_collect_requires_completed_
    job); the durable record is stamped collected_at and names the
    registered artifact ids.
review_notes:
- >-
    AC mapping one-to-one: AC-01 -> the six-operation interface with the
    strict state machine, frozen decision records and stable error
    hierarchy; AC-02 -> the durable job record (persisted identity,
    session-independent recovery, cross-platform re-attach); AC-03 ->
    real ArtifactRegistry registrations with deterministic ids, real
    checksums and producer stamps, idempotent re-collection.
- >-
    Full 2-file review completed line by line (src local.py 1539, tests
    test_local_adapter.py 1012). Every test injects a scripted
    FakeLauncher/FakeClock (the only real processes are the
    fixture-launched trivial children of the test_real_* tests, driven
    deterministically via launcher.wait() -- no sleeps, no polling
    loops, no randomness, no network); every assertion exercises the
    REAL modules (core.ids.generate_id/is_valid_id, core.atomic.
    atomic_write, artifacts.checksum.compute_sha256, artifacts.registry.
    ArtifactRegistry, core.models.ArtifactManifest) -- no mocks, no
    parallel stores. -k local matches the 32 tests exactly through the
    test_local_adapter.py nodeid path.
- >-
    Cross-platform re-attach is done honestly: _AttachedSubprocessHandle
    uses os.waitpid (POSIX) / OpenProcess+GetExitCodeProcess via stdlib
    ctypes (Windows) with the WinDLL loaded via getattr so the module
    stays importable and mypy-clean on every platform (the second branch
    commit b59bdd7); the exited-unknown probe maps to the stable
    EXIT_CODE_UNAVAILABLE_NOTE and collect still independently verifies
    every declared output -- a loud, recoverable design, never a silent
    success. The known Windows re-attach limitation (no blocking wait
    for re-attached handles; ProcessAttachError) is documented in the
    docstring and covered by design.
- >-
    Pattern symmetry with DEV-M7-G01 (filesystem LabAdapter) and the
    domain-template packs: frozen decision records with strict
    validation, TypeError at public boundaries vs ValueError-subclass
    stable errors, deterministic canonical records (byte-identical for
    identical injected inputs -- test_identical_inputs_produce_byte_
    identical_records), injectable clock (no wall clock), injectable
    launcher (no real process boundary in tests), safe id/output-name
    vocabulary (FND-M9-G02-01), exactly-once + idempotent recovery
    semantics. The durable record is a runtime record validated against
    the documented JobRecord contract (no schemas/job.schema.yaml
    exists) -- the core.leases precedent, correctly reasoned in the
    docstring.
