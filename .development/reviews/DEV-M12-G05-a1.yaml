design_review:
  decomposition: >-
    One scenario per file (A/B/C new), each self-contained: benchmark
    constants parsed at import time from the frozen files with assertions,
    deterministic project fixtures, scenario executors returning frozen
    result records, and AC-mapped tests (test_A_ac01_*, test_B_ac02_*,
    test_C_ac03_*). D and E verified unchanged against AC-04/AC-05.
  real_machinery: >-
    No mocks of the system under test: real adapters (FilesystemLabAdapter
    with the scripted result package only at the external handoff
    boundary), real statistics stack (decide_equivalence,
    evaluate_replicate_sufficiency, effect metrics), real outcome rules
    (R-EQ-1/2, R-REQOUT-1/2/3, R-PRJ-1/3, R-MR-3, R-CLOSE-2, R-SAT-S1,
    R>=3/D>=2 gates), real diagnosis/research machinery
    (generate_goal_context, issue_research_request,
    track_new_eligible_hypotheses), real registries and state backend,
    real audit mapper. Every rule id asserted in the tests is matched by
    the real engine, not hardcoded.
  grounding: >-
    Constants (TARGET 180.5, MARGIN 18.05, MIN_INDEPENDENT 2,
    REQUIRED_ZERO_NOVELTY_CYCLES 2) parsed from the frozen benchmark
    files at import with assertions -- independently confirmed in the
    main tree (ASM-A1-TOL-01, ASM-A1-N-01). Dependency goals
    GOAL-EXE-20/30/40 registered from the benchmark file because the real
    diagnosis context resolves every dependency's declared outputs
    through the registry (unregistered dependency raises
    GoalNotFoundError).
  determinism: >-
    FakeClock with one fixed stamp, deterministic ids, no wall clock, no
    sleeps, no network; every scenario executed twice in separate
    workspaces with byte-identical full durable state trees (tree_bytes),
    plus clock-call-count equality and outcome/rule-id equality across
    replays.
  scope: >-
    git status on the head is clean; exactly 3 files under
    tests/scenarios/test_A*|test_B*|test_C* added. test_D*/test_E*
    untouched. No src/ changes, no benchmark data changes, no
    .development changes, no AC changes, no --no-verify.

