findings: []

observations:
  - id: OBS-M12-G05-01
    detail: >-
      The requirement registry is once-only: register_requirement persists
      the record with an immutable final outcome and there is no update
      path, so the "open requirement" phase has no durable record and the
      scenario registers the requirement at closure time with the final
      outcome. This matches the immutable-registry semantics (and the
      tests assert the recomputed mapping behavior), but a durable
      open-state record or an update path is an API-design candidate for
      a future milestone. Tracked at the M13 Release Gate.
  - id: OBS-M12-G05-02
    detail: >-
      No durable HumanGate registry exists in src: HumanGate is a typed
      CoreModel without a registration API, so the Termination Gate is
      carried in the supervisor decision/event payloads (typed
      HumanGate.to_dict(), schema shape asserted). Related to
      OBS-M12-G06-02 (no register_human_gate helper). A human-gates
      registry with a registration helper is an API-completeness
      candidate; tracked at the M13 Release Gate.
  - id: OBS-M12-G05-03
    detail: >-
      The scenario files are large (1171/1606/1486 lines) because each is
      self-contained with its own fixture machinery (they cannot import
      the planning/domain test helpers, which live in other suites).
      Within-file structure is clean (constants at top, fixtures, AC
      section markers) and the shared executor pattern could be factored
      into a scenarios helper module in a future cleanup; not required
      for v0.1.

