design_review:
  exact_references: >-
    AC-01 exactness is enforced at the persistence gate in a fixed order:
    id safety -> duplicate check -> protocol ref -> artifact refs ->
    acceptance ref, every resolution through the real merged registries
    (read_protocol_version / ArtifactRegistry / read_acceptance), with
    UnresolvedResultReferenceError before anything is written. The run
    ref's shape validation (safe single path segment) plus the exact
    equality proof against the input Run record is the correct reading
    given the absence of a Run registry in v0.1 -- documented openly
    rather than silently re-interpreted.
  immutability: >-
    AC-02 holds at both layers: frozen dataclass (in-memory immutability,
    including after reload) and exactly-once registry (filesystem
    immutability, byte-proven against duplicate and tampered
    re-registration). The stable DuplicateResultError message names the
    id and the exactly-once rule.
  closure_separation: >-
    AC-03 is structural: results.py imports no requirement/outcome layer
    (asserted from source in tests) and requirement_refs is pure linkage;
    the module pins the protocol version and the G01 acceptance gate
    (assert_acceptance_eligible) remains the gate -- the result module
    never re-derives acceptance.
  registry_isolation: >-
    analysis/results/ is a sibling of analysis/protocols/: the M4-G04
    plan-level protocol listing and the M9-G01 versioned lineage glob
    only the protocols/ tree and cannot see result records; the result
    registry globs only its own *.json. Isolation proven behaviorally
    (both registries list exactly their own records after registering a
    result) and structurally (reviewed in full).
  paradigm: >-
    Frozen dataclass with strict __post_init__; TypeError vs
    ValueError-subclass split with stable one-line messages; safe-id
    validation including glob metacharacters at every public boundary;
    canonical JSON + atomic_write; deterministic sorted listing;
    ProjectNotInitializedError gate; __all__; from __future__ import
    annotations; zero type: ignore / noqa.

