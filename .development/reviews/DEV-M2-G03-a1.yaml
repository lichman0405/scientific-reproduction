criteria:
  - criterion_id: AC-01
    result: PASS
    evidence: >-
      Reliability is exclusively checklist-derived — no API accepts a
      directly assigned reliability score: reliability_score(checklist)
      and assess(...) have no reliability parameter; ReliabilityChecklist
      (frozen, 9 spec dimensions) requires a mandatory checklist_ref
      (no default; whitespace-only refs rejected via __post_init__);
      from_dict requires the reference; the versioned rule
      reliability-rule-v1 bands the 8 positive dimensions (8 -> 4, 6-7
      -> 3, 4-5 -> 2, 2-3 -> 1, 0-1 -> 0) and a defect signal forces 0;
      validate_assessment_against_checklist links any score back to its
      inputs and requires an assessment reference. Independent rerun at
      head 07e4968: 61 evidence tests passed, exit 0.
  - criterion_id: AC-02
    result: PASS
    evidence: >-
      assess(source, claim_id, checklist, directness, ...) produces the
      frozen EvidenceAssessment triple: authority rubric derived from
      source_type via AUTHORITY_BY_SOURCE_TYPE (judgment source types
      map to None — left open), directness evaluated per (source,
      claim), reliability checklist-derived with reliability_checklist_
      ref resolved from a checklist object or explicit reference; the
      output validates against the frozen evidence schema; assessment is
      Source x Claim (never a global score) and deterministic. 61
      evidence tests passed at head, exit 0.
  - criterion_id: AC-03
    result: PASS
    evidence: >-
      Hard gates are standalone predicates that never read the ranking:
      reliability_gate_passes (R >= 3), directness_gate_passes (D >= 2),
      recovery_hypothesis_eligible (v0.1: R >= 3, D >= 2, actionable),
      acceptance_support_qualifies (R >= 3 with documented exceptions),
      count_independent_qualifying_sources — gate results are invariant
      under ranking_score None/0/49/100 and the gate predicates take no
      weight parameters; ranking_score itself is versioned
      (ranking-rule-v1, SS3 weights); malformed assessment mappings are
      rejected. Independent rerun at head: full suite 531 passed /
      6 skipped / 1 deselected, ruff + mypy clean on 30 source files,
      contracts validator PASS.
