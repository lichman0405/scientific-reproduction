  AC-01:
    status: PASS
    evidence:
    - test_E_ac01_transport_failure_authorizes_identical_resubmission
    - test_E_ac01_resubmission_is_a_scheduler_receipt_not_a_new_job_record
    - test_E_ac01_engineering_recovery_only_no_supervisor_replan
    - test_E_ac01_no_supervisor_decision_surface_in_the_monitor_path
    - test_E_ac01_resubmission_decided_exactly_once_per_failure
    - test_E_ac02_scientific_failure_refused_no_resubmission
    - test_E_ac02_unclassified_failure_refused
    - test_E_ac02_whitelist_is_engineering_only
    notes: >-
      Scenario E performs identical engineering recovery only, end to end
      through the real machinery (SlurmClusterMock over the real SSHTransport
      boundary, real AdapterFailureClassifier reading the adapter's durable
      job record, real scheduler-level replay). The resubmission is byte
      identical to the failed dispatch (identical batch replayed from the
      adapter's durable job record, never re-derived), arrives as a
      scheduler receipt -- not a new job record -- and the run bytes are
      unchanged; the only emitted event is the engineering retry decision.
      The no-supervisor-surfaces property is proven by AST scan of the retry
      module: SupervisorDecision / DecisionType never appear anywhere in the
      engineering path (identical recovery only, never a scientific replan).
      The complementary refusals (scientific job failure, unclassified
      failure, anything outside the engineering whitelist) are never
      resubmitted, and the exactly-once discipline holds across a fresh
      dispatcher replaying the recorded authorized/refused history with zero
      fresh hook calls.
  AC-02:
    status: PASS
    evidence:
    - test_G_ac02_replacement_reconstructs_state_from_checkpoint_events_adapter
    - test_G_ac02_reconstruction_is_observation_only
    - test_G_ac02_no_duplicate_run_job_or_completion_event
    - test_G_ac02_completion_during_outage_not_lost
    - test_G_ac02_replacement_dispatch_never_invoked
    - test_G_crash_leaves_durable_state_for_the_replacement
    - test_G_watchdog_tries_resume_and_resume_fails
    notes: >-
      Scenario G loses no Run/job/completion event after Monitor
      replacement, end to end: the crash leaves the durable watch/run/
      checkpoint/event artifacts for the replacement; the watchdog's resume
      attempt is recorded and fails; the replacement reconstructs the full
      state from checkpoint + events + external adapter with RecoveredCompletion
      per run. Reconstruction is observation-only (dispatch.calls == [] and
      byte-identical state after reconstruct) -- no duplicate Run, no
      duplicate job, no duplicate completion event (exactly 2 run records, 2
      job records and 2 completion events across the whole scenario, id
      sequences never reused). The completion that landed during the outage
      is not lost: the resumed pass transitions it exactly once. The
      replacement's dispatch hook is never invoked. AC-03 within the file
      (resumed pass and a fresh session over the same state are idempotent,
      byte-identical) confirms the recovery stays a no-op thereafter.
  AC-03:
    status: PASS
    evidence:
    - test_H_ac03_monitor_detects_incoming_package_and_reconciles
    - test_H_ac03_fresh_adapter_collects_returned_result_without_worker
    - test_H_ac03_followup_analysis_spawned_exactly_once
    - test_H_ac03_worker_process_gone_before_result_returns
    - test_H_worker_dispatches_and_exits_leaving_durable_artifacts
    - test_H_ac02_before_result_no_detection_no_trigger
    - test_H_ac02_completion_event_recorded_exactly_once
    notes: >-
      Scenario H does not require the original experiment worker to remain
      alive, end to end through the real FilesystemLabAdapter (real
      dispatch/status/collect over the real outgoing/incoming handoff,
      schema-gated dispatch, manifest-validated collection with the real
      run-association check), the real WatchedRunRegistry, ReconcileEngine,
      TriggerRegistry and ProjectEventLog. The worker dispatches and exits;
      the result returns later; a fresh Monitor session detects the incoming
      Result Package, records the single deterministic completion event
      (generate_id("event", EXTERNAL_STATUS_CHANGE_EVENT_TYPE, run_id,
      RUNNING_EXTERNAL, RESULT_AVAILABLE), asserted verbatim) and moves the
      Run to RESULT_AVAILABLE -- the stale worker_session_ref on the run
      record is never resolved by any step (asserted stale at the end). The
      follow-up analysis is spawned exactly once: the first trigger scan
      invokes the hook once and persists the deterministic trigger record
      with the receipt (durable analysis request written through
      core.atomic.atomic_write); the repeated scan replays that single
      original record -- no second hook call, no second record, byte-identical
      files, and a fresh registry reconstructs the same single trigger.
      Before the result returns nothing is fabricated (probe reports
      running, run stays RUNNING_EXTERNAL, scan ignores, zero files), and a
      fresh reconcile pass never re-emits or re-transitions.

