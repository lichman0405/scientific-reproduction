design_review:
  real_machinery_verification: >-
    All three scenarios execute through the REAL machinery end to end -- no
    mocks of the production units under test: the real FilesystemLabAdapter
    (schema-gated dispatch, manifest-validated collection with the real
    run-association check), the real WatchedRunRegistry, ReconcileEngine,
    TriggerRegistry, FilesystemStateBackend and append-only ProjectEventLog,
    the real core.atomic.atomic_write for every durable byte, the real
    adapter durable job record feeding the AdapterFailureClassifier. The
    SlurmClusterMock is the SSH transport boundary only -- the scheduler
    interface the production adapter would talk to -- and it records
    receipts (identical batch replayed, byte for byte) rather than
    fabricating outcomes. Executors are pure functions of their workspace
    directory: determinism tests execute each scenario twice in separate
    workspaces and assert byte-identical durable trees (with only the
    workspace's own absolute path normalized out).
  exactly_once_and_no_duplication: >-
    Scenario G: reconstruction is observation-only (dispatch.calls == [],
    byte-identical state), exactly 2 run records / 2 job records / 2
    completion events across the whole scenario with id sequences never
    reused, the outage completion transitions exactly once via the resumed
    pass, and the replacement's dispatch is never invoked. Scenario H: the
    deterministic trigger record (generate_id("trigger", run_id, kind)) is
    the at-most-once marker -- first scan triggers once, repeated scan and
    fresh registries replay the single original record with zero fresh hook
    calls and byte-identical bytes; the completion event id is a pure
    function of the transition and asserted verbatim. Scenario E: the
    dispatcher's durable job record replays the identical batch exactly
    once per failure, including across a fresh dispatcher replaying the
    recorded authorized/refused history.
  identical_recovery_only_no_supervisor_surface: >-
    Scenario E is the only file touching the resubmission path, and it
    proves by AST scan that the engineering retry module never contains
    SupervisorDecision or DecisionType -- identical engineering recovery
    only, never a scientific replan; the resubmitted run is byte identical
    (identical batch replayed from the durable record, never re-derived)
    and the only event emitted is the engineering retry decision. The
    complementary refusals (scientific job, unclassified) are asserted
    refused with zero resubmission.
  determinism_and_discipline: >-
    Single-stamp injected FakeClock throughout (every read recorded; no
    wall clock, no sleeps, no network), deterministic ids at every layer
    (run/job/completion event/trigger/analysis request all generate_id
    with asserted exact values), canonical sorted JSON through the house
    atomic writer, safe-identifier hygiene asserted on every id touched by
    the scenarios, frozen dataclass records validated at their contract
    boundaries (FrozenInstanceError, malformed records rejected), and the
    house byte-identity determinism pattern across independent executions.
  observations: >-
    One harmless redundancy noted, not a finding: test_G line 743 asserts
    run_file_bytes(...) == run_file_bytes(...) on the same value (x == x,
    trivially true); the full-tree byte identity it appears to echo is
    already asserted by the preceding tree_bytes(root) comparison, so the
    line weakens nothing and no fix is required. The pyright diagnostics
    are the known noise classes (test-only dict[str, object] subscripts at
    test_E line 648, unresolved-import noise from a scanner without an
    editable install, deliberate wrong-type boundary passes under
    pytest.raises(TypeError)) -- none are defects; mypy/ruff/pytest/CI are
    the authoritative gates and all pass.

