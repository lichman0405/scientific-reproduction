acceptance_criteria:
  AC-01:
    status: PASS
    evidence:
    - test_codex_ac01_capability_declares_the_native_operations
    - test_codex_ac01_adapter_implements_the_locked_interface_surface
    - test_codex_ac01_spawn_persistent_role_is_a_native_codex_session
    - test_codex_ac01_spawn_worker_is_a_native_codex_session
    - test_codex_ac01_session_id_is_a_pure_function_of_session_ref
    - test_codex_ac01_fallback_subagent_is_the_explicit_fallback_path
    - test_codex_ac01_refused_subagent_spawn_keeps_the_durable_identity
    - test_codex_ac01_unavailable_client_answers_explicit_unsupported
    - test_codex_ac01_default_adapter_without_live_runtime_answers_explicitly
    - test_codex_run_bundle_is_canonical_and_carries_the_contract
    - test_codex_unknown_session_is_session_not_found
    - test_codex_invalid_inputs_raise_type_and_data_errors
    notes: >-
      The adapter demonstrates the full PlatformAdapter contract both
      natively and through the hermetic mock: spawn_persistent_role /
      spawn_worker are NATIVE Codex session spawns (session id derived
      deterministically from the canonical session_ref via
      generate_id("codex_session", session_ref); the run bundle carries
      the durable identity plus the frozen role contract directives --
      contract_id, contract_version, state_truth_rule, prompt_obligations/
      prohibitions -- the run-mapping deliverable); the capability record
      declares the six orchestration operations native and deliberately
      excludes fallback_subagent (the explicit fallback channel itself,
      always answered FALLBACK); fallback_subagent always answers the
      typed FALLBACK naming the one-shot codex exec channel and carries
      the same canonical session_ref as a native spawn of the same
      logical context; a refused subagent spawn, an unavailable session
      client and a refusing client all answer the explicit typed
      UNSUPPORTED with a reason -- never a fabricated session (AC-03);
      the default adapter (real thin wrapper clients, no live Codex
      runtime in the test runtime) honors the contract explicitly; the
      CLI guard test pins CodexSessionClientStore's typed
      CodexSessionUnavailableError when the Codex CLI is absent (skipped
      on this machine, where a codex CLI is installed -- the guard
      behavior remains pinned indirectly through the default-adapter
      tests). The concrete adapter implements the full locked
      PlatformAdapter abstract surface plus the explicit replacement
      path, and capability answers stay distinct from data errors
      (SessionNotFoundError / PlatformAdapterDataError / TypeError at
      the public boundaries).
  AC-02:
    status: PASS
    evidence:
    - test_codex_ac02_adapter_imports_no_scientific_core_domain_module
    - test_codex_ac02_adapter_imports_no_foreign_platform_api
    - test_codex_ac02_replaced_session_carries_the_same_session_ref
    - test_codex_ac02_missing_session_record_does_not_rewrite_identity
    - test_codex_ac02_session_record_alone_never_creates_identity
    - test_codex_ac02_adapter_never_queries_the_client_by_identity_fields
    - test_codex_ac02_replacement_reconstructs_from_workspace_snapshot
    - test_codex_ac02_fallback_replacement_keeps_identity_and_outbox
    - test_codex_ac02_snapshot_round_trips_and_corrupt_state_is_a_data_error
    - test_codex_ac02_replace_unknown_or_unavailable
    notes: >-
      AC-02 is enforced structurally and behaviorally. The structural
      pin is an AST scan over every codex package module: no
      third-party imports at all, no scientific-core domain package
      (the frozen goal vocabulary -- research/rules/state/analysis/
      monitor/domain/execution -- plus every domain package present in
      the repository), and adapters.* imports restricted to the neutral
      seams (platform base, shared role contracts, the codex package
      itself); the adapter imports only core.ids, core.models and the
      platform base/contracts -- orchestration transport only, zero
      scientific logic. The behavior is pinned in the same directions as
      DEV-M10-G03: the transport session id derives from the session_ref
      (never the reverse), every session-client interaction is keyed by
      the derived session id only (recorded by the fake), a replaced
      session carries the byte-identical same session_ref, a missing
      session-store record never nullifies or rewrites the identity
      (resume still answers the typed FALLBACK with the same durable
      handle), and a stray session record alone never creates an
      identity (SessionNotFoundError). The scenario-G reconstruction
      flow is pinned end to end: a crash-time durable snapshot
      (to_records) replayed into a fresh registry (from_records) with a
      fresh session client whose live sessions are gone answers the same
      identity, the durable outbox survives the replacement, and the
      replacement session takes over without chat-memory access.
      Snapshots round-trip losslessly; corrupt workspace state is the
      stable PlatformAdapterDataError.
  AC-03:
    status: PASS
    evidence:
    - test_codex_ac03_resume_returns_fallback_naming_the_limitation
    - test_codex_ac03_resume_is_native_when_a_live_session_is_attached
    - test_codex_ac03_resume_with_unavailable_client_preserves_identity
    - test_codex_ac03_is_session_alive_never_fabricates_liveness
    - test_codex_ac03_terminated_session_is_never_resumed_or_replaced
    - test_codex_ac03_terminate_is_native_when_a_live_session_is_stopped
    - test_codex_expose_command_native_when_live_and_outboxed_when_not
    - test_codex_deterministic_flow_repeatable
    notes: >-
      The known Codex resume limitation (documented in the module
      docstring with CLI research grounding: sessions persist only as
      local JSONL transcripts and headless resumption -- codex resume /
      codex exec resume -- is version-dependent, "only latest source
      builds include codex exec resume; the currently released CLI may
      not") is reconciled explicitly and pinned by tests: resume_session
      answers the typed FALLBACK with a fallback_reason naming the
      limitation in three distinct states (record present but no live
      session; record missing; session client unavailable -- each with
      its own stable reason constant) and always returns the durable
      identity -- never nullified; is_session_alive never fabricates
      liveness -- NATIVE only with an observed boolean (True when a live
      session process is attached, False exactly for a durably
      terminated session) and UNSUPPORTED with alive=None whenever the
      liveness is unobservable; a terminated session is a durable fact
      (resume/replace/command refused with typed reasons, second
      terminate idempotent FALLBACK); the explicit replacement path
      (replace_session) and fallback_subagent create replacements
      carrying the same canonical session_ref reconstructing from the
      shared workspace with the durable outbox preserved;
      expose_command delivers NATIVE into a live session or preserves
      the directive in the durable outbox (FALLBACK, the adapter-defined
      fallback channel); the whole flow is a pure function of the inputs
      (byte-identical repeatability test). The unavailable-live-capability
      reporting is honest throughout: the real wrappers answer typed
      refusals (CodexSessionUnavailableError / accepted=False) and never
      a fabricated success.

