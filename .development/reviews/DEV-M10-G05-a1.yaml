design_review:
  mechanism_mapping_honest: >-
    The operation-to-mechanism mapping (the goal deliverable) is explicit
    and honest about the v0.1 product surface: persistent roles and
    goal-scoped workers map to Codex sessions through the injectable
    session client (sessions persist as local JSONL transcripts under
    ~/.codex/sessions/), the explicit fallback channel maps to the
    short-lived headless one-shot run (codex exec with the
    machine-readable --json output; --full-auto deliberately not assumed
    -- approval policy is configuration, 15-ADAPTER-SPEC.md SS6),
    terminate maps to an assumed stop operation (the released CLI has no
    documented stop subcommand -- documented as assumed at the
    boundary). All real Codex interaction sits behind two hermetically
    mockable boundaries (CodexSessionClient, CodexProcessRunner) the
    tests fake deterministically -- the M8-G06 SlurmClusterMock and
    DEV-M10-G03 TeamStoreClient precedents -- and the real wrappers
    answer typed refusals in the deterministic runtime (the client
    raises the typed CodexSessionUnavailableError when the CLI is
    absent; the exec runner answers accepted=False without running a
    live process). The NATIVE spawn path is demonstrated through the
    scripted fake exactly as AC-01 permits, and the default adapter
    without a live runtime still honors the full contract explicitly.
  no_scientific_logic_forced: >-
    AC-02 is enforced harder than in the sibling adapter: the codex
    package has no dynamic imports at all, and the structural scan
    forbids third-party imports entirely (the claude adapter allowed
    guarded third-party SDK imports inside function bodies; the codex
    adapter needs none). The scan iterates every module of the package
    and rejects any import whose root is neither stdlib nor
    scientific_reproduction, any scientific-core domain package (the
    frozen goal vocabulary plus every domain package present in the
    repository), and any non-neutral adapter module. The adapter
    imports exactly core.ids, core.models and the platform base/shared
    role contracts -- orchestration transport only. The codex package
    is also pinned claude/OpenAI-independent (no anthropic/claude/
    openai roots anywhere), including a deliberate decision to mirror
    the session registry rather than import the claude one.
  store_never_authoritative: >-
    The same direction-of-dependency discipline as DEV-M10-G03:
    derive_session_id(session_ref) is a pure function of the durable
    identity (the transport id can never influence the session_ref),
    the SessionRegistry is the workspace-side reflection of the Core's
    identity rehydratable from a durable snapshot via from_records
    (13-EXECUTION-MONITOR.md SS3-SS4), every session-client interaction
    is keyed only by the derived session id, and the tests pin the
    three dangerous directions: replacement preserves the same
    byte-identical identity, a missing record does not rewrite it, and
    a stray record does not create one. The registry's put() preserves
    the durable outbox on re-registration so a replacement never loses
    the pending commands preserved for it.
  resume_limitation_reconciled: >-
    AC-03 is reconciled explicitly and mechanically, mirroring the
    sibling: the module docstring documents the Codex resume limitation
    with research grounding (JSONL transcript persistence; version-
    dependent headless resumption); resume_session answers the typed
    FALLBACK with a fallback_reason naming the limitation in three
    distinct states (record present / record missing / client
    unavailable -- each with its own stable reason constant); liveness
    is never fabricated (NATIVE only with an observed boolean,
    UNSUPPORTED alive=None otherwise); a terminated session is a
    durable fact in the registry (never resumed, never replaced, never
    commanded, idempotent terminate); replace_session and
    fallback_subagent create replacements with the same canonical
    session_ref reconstructing from the shared workspace including the
    durable outbox; and the whole flow is pinned by a byte-identical
    repeatability test. The nineteen stable reason constants are
    exported for callers and asserted verbatim by tests.
  house_style: >-
    The package follows the house style exactly: frozen dataclass
    records (SessionProbe, CodexRunResult, SessionRecord), StrEnum
    vocabulary (SessionState ACTIVE/TERMINATED), TypeError at the
    public boundaries, stable ValueError-subclassed errors
    (CodexSessionUnavailableError extends PlatformAdapterError;
    PlatformAdapterDataError for corrupt data), deterministic ids via
    core.ids.generate_id (codex_session / codex_run kinds), canonical
    serialization with lossless round-trip and corrupt-state wrapping
    into the stable error, module-level imports stdlib +
    scientific_reproduction only, and no wall clock, no randomness, no
    I/O anywhere in the package -- the determinism hygiene is asserted
    by import scans over every module of the package.
  observations: >-
    Four notes, none of them findings: (1) derive_run_id and
    CodexRunResult validate invalid refs with the documented ValueError
    rather than PlatformAdapterDataError -- consistent within the
    module and unreachable from the adapter's validated paths (the same
    pattern already accepted in the sibling claude_code process_runner).
    (2) The real CodexSessionClientStore.start_session returns False
    even when a Codex CLI is located: the live invocation surface is
    documented as assumed and not exercised, and the adapter answers
    the explicit UNSUPPORTED -- the honest refusal discipline, never a
    silent fake. (3) test_codex_cli_guard_raises_typed_refusal_when_cli_absent
    skips on this machine (a real codex CLI is on the PATH); the guard
    behavior remains pinned through the default-adapter tests, so the
    skip does not reduce coverage of the adapter contract. (4) The two
    test files duplicate the scripted fakes rather than sharing a
    conftest -- the same isolation choice as the sibling claude test
    files; acceptable house pattern. The pyright marks seen during
    development are all known noise classes (TypeError-boundary
    unreachable narrowing; "import could not be resolved" scanner
    artifact without an editable install), and the worker-reported
    pyright findings on the test files are the same tuple[object, ...]
    attribute-access noise as the sibling test_claude_resume.py --
    ruff and mypy (the authoritative gates) are clean.

