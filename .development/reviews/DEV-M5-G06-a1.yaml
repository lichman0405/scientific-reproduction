comments:
  - >-
    Scope check: 10 files — src/scientific_reproduction/adapters/research/
    base.py (+450), fixtures.py (+122), public.py (+236), registry.py
    (+212) new; adapters/research/__init__.py (+68/-4) and
    adapters/__init__.py (+8/-3) are the explicitly allowed package
    scaffolds (pure re-exports, complete __all__); tests/adapters/
    research/test_adapter_{contract,fixtures,normalization,registry}.py
    new (+48 tests). No other subsystem touched (core/, research/,
    planning/, audit/, artifacts/, workers/ untouched). Single
    conventional commit 241b8138 [DEV-M5-G06] above merge base 2417647,
    no amend, no force-push, no tests deleted or weakened (purely
    additive). PR #28 mergeStateStatus UNKNOWN at review time — expected
    (main advanced 2417647 → f4607c1 via the batch's own M5-G02 merge);
    scopes disjoint, will re-verify CLEAN before merge. CI both jobs
    SUCCESS; head equals the reviewed head.
  - >-
    Design reviewed — AC-01 by construction: registry.capability() is
    total (unregistered id → defined ABSENT AdapterCapability with
    commercial flag per the vocabulary, never raises), and
    acquire_available_sources iterates only available adapters, so the
    core research workflow is complete with only public adapters; the
    commercial vocabulary is exactly the frozen 09 §4 list. AC-02:
    normalize() routes doi/stable_identifier/url through the frozen
    research/sources.py path — the adapter is the IO boundary that
    canonicalizes external recording noise (doi: prefixes, wrapper
    URLs, www./default-port/trailing-slash, SI URL fragments) once at
    ingestion, so canonical_identity re-derives the same dedupe keys the
    research layer relies on (both functions idempotent — the documented
    interface reading is consistent with M5-G01's "registered casing
    preserved on the record" note, applied to the research layer only);
    RECORD_SCOPED_TYPES keep their own locator as identity material
    (never the parent DOI); source_id is a pure function of
    adapter + identity (generate_id); provenance is the deterministic
    stamp adapter:<id>@v<version>; acquired_at deliberately unset.
    AC-03: fixtures are module-level frozen data (mock disclaimer
    explicit; FDM-201 primary DOI 10.1039/D5TA00771B used as the
    canonical example per 17-FDM201-REFERENCE-CASE.md), and _matches_ref
    compares both sides through the normalization path so recording-form
    differences never defeat an identity lookup while malformed refs
    raise loudly. Paradigm: TypeError at public boundaries,
    ValueError-subclass AdapterError hierarchy with stable messages
    (AdapterDataError / AdapterRecordNotFoundError /
    AdapterRegistrationError), frozen dataclasses, ClassVar-declared
    adapter identity and capabilities, deterministic ordering (sorted
    operations, sorted adapter enumeration), AdapterSourceRef
    exactly-one-dimension enforced in __post_init__, __all__ exports,
    docstrings citing 09-RESEARCH-SUBSYSTEM.md §4, 15-ADAPTER-SPEC.md
    §4, 06-EVIDENCE-SYSTEM.md §7, agent-contracts/RESEARCH.md,
    17-FDM201-REFERENCE-CASE.md. The documented interface-shape
    resolution (canonical identity fields stored on adapter-normalized
    records) is an honest, correct reading of the frozen contract.
    Worker's run-1 full-suite failure was the DEV-DEFECT-002 lease-flake
    family (test_concurrent_takeover_of_expired_lease_single_winner_
    single_object, tests/integration/ — not in PR scope); supervisor
    rerun passed 1079/1079 on the first attempt.
  - >-
    Pyright IDE diagnostics on the new files are the established noise
    classes: "unreachable" flags point at the defensive TypeError raises
    on typed parameters (normalize/acquire/search/fetch_metadata
    boundaries, registry TypeError checks), the AdapterSourceRef.describe
    "<empty>" fallback and the `assert url is not None` guard after
    __post_init__; the "unused lambda parameter" flags come from the
    deterministic-sort key lambdas (uniform signature); remaining flags
