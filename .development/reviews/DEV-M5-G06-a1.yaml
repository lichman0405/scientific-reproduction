criteria:
  - criterion_id: AC-01
    result: PASS
    evidence: >-
      Missing commercial adapter never blocks the workflow: registry
      capability queries are total — test_absent_commercial_adapter_
      capability_is_defined_not_raising, test_unknown_adapter_capability_
      is_defined_absent (unregistered ids return the defined ABSENT
      shape: state ABSENT, operations (), version "0.0.0-absent",
      commercial flag per OPTIONAL_COMMERCIAL_ADAPTERS),
      test_capability_never_raises_for_absent_adapters,
      test_available_adapters_enumerate_public_ones_regardless_of_
      commercial_presence, test_workflow_with_only_public_adapters_is_
      complete (acquire_available_sources acquires all 7 fixture sources
      with only public adapters; every commercial id reports ABSENT),
      test_workflow_result_is_ordered_and_deterministic,
      test_workflow_with_partial_registry_completes. The commercial
      vocabulary is exactly 09-RESEARCH-SUBSYSTEM.md section 4's:
      csd_ccdc / scifinder / web_of_science / scopus.
  - criterion_id: AC-02
    result: PASS
    evidence: >-
      Adapter outputs normalize into frozen Source records: normalize()
      flows every identity-bearing field through the frozen
      research/sources.py path — test_primary_paper_fixture_normalizes_
      to_expected_identity (canonical_identity == doi:10.1039/d5ta00771b),
      test_prefixed_doi_fixture_normalizes_to_canonical_record ("doi:"
      prefix stripped), test_url_only_record_normalizes_to_url_identity,
      test_stable_identifier_record_derives_identifier_identity,
      test_record_scoped_fixtures_keep_own_addresses and
      test_record_scoped_source_id_ignores_parent_doi (RECORD_SCOPED_
      TYPES never inherit the parent DOI — M5-G01 AC-02 carried through),
      test_si_fixture_drops_fragment_from_url,
      test_malformed_doi_surfaces_source_normalization_error (loud
      failure, never silently bent), test_source_id_is_pure_function_of_
      adapter_and_identity (core.ids.generate_id),
      test_access_class_is_stamped_from_adapter,
      test_acquire_normalizes_every_search_hit,
      test_mirrors_across_adapters_collapse_via_dedupe (cross-adapter
      mirrors collapse with both provenances retained) and
      test_distinct_dois_stay_distinct_through_dedupe (M5-G01 dedupe
      consumed end-to-end), test_every_fixture_normalizes_to_a_canonical_
      identity.
  - criterion_id: AC-03
    result: PASS
    evidence: >-
      Contract testable without a live network: fixtures are pure
      deterministic data — test_fixture_resolution_never_touches_the_
      network (every socket entry point patched to raise; search/fetch/
      acquire all succeed), test_fixture_resolution_is_deterministic_
      across_runs, test_fixtures_are_pure_frozen_data,
      test_fixture_data_is_identical_every_import (no wall-clock, no
      randomness, no module-level mutable state),
      test_search_empty_query_returns_entire_fixture_set,
      test_search_filters_by_case_insensitive_substring,
      test_search_max_results_truncates_deterministically,
      test_fetch_metadata_by_doi_recording_form_variants (lookup
      compares through normalization, so recording-form noise never
      defeats identity), test_fetch_metadata_by_stable_identifier_and_
      url, test_fetch_metadata_unknown_identity_raises_stable_error
      (AdapterRecordNotFoundError), test_research_adapter_is_abstract_
      contract.
