acceptance_criteria:
  AC-01:
    status: PASS
    evidence:
    - test_statistic_ac01_verdict_vocabulary_has_no_reproduced_value
    - test_statistic_ac01_decision_api_has_no_p_value_path
    - test_statistic_ac01_non_significant_without_equivalence_never_equivalent
      (parametrized x6: every non-significant shape without equivalence
      evidence -> INCONCLUSIVE, R-EQ-3)
    - test_statistic_ac01_non_significant_inside_region_is_equivalence_evidence
      (TOST distinction: p > 0.05 WITH the interval fully inside the frozen
      region IS equivalence evidence -- the region, not the p-value, decides)
    - test_statistic_ac01_all_non_significant_shapes_never_equivalent_grid
      (3x3x3 shape grid: every crossing-zero interval not fully inside ->
      INCONCLUSIVE, never EQUIVALENT)
    notes: >-
      AC-01 holds BY CONSTRUCTION, verified in source and by tests: (1) the
      EquivalenceVerdict vocabulary has exactly 3 members (EQUIVALENT /
      NOT_EQUIVALENT / INCONCLUSIVE) -- no REPRODUCED, no NOT_REPRODUCED
      (asserted by set-membership test); (2) no public decision API accepts
      a p-value: decide_equivalence signature is exactly {effect, ci,
      bounds} (proven by inspect.signature), and EquivalenceDecisionInput /
      EquivalenceAssessment carry no p_value field (proven by dataclass
      fields inspection); (3) the only non-significance shape is a CI
      crossing zero (ConfidenceInterval.crosses_zero, documented as the
      p > alpha reading); such an interval is EQUIVALENT only when it lies
      entirely inside the frozen bounds (R-EQ-1, TOST) and INCONCLUSIVE
      otherwise (R-EQ-3) -- verified across the parametrized shapes and the
      grid. The module docstring explicitly documents that statistics
      decides but never closes outcomes (RequirementOutcome mapping lives
      at the outcome layer).
  AC-02:
    status: PASS
    evidence:
    - test_statistic_ac02_interval_crossing_bounds_inconclusive
      (parametrized x7: straddling/larger-than-region shapes -> INCONCLUSIVE)
    - test_statistic_ac02_wide_interval_crossing_both_bounds_inconclusive
      (interval wider than the whole region -> INCONCLUSIVE, explicitly
      not EQUIVALENT and not NOT_EQUIVALENT; "REPRODUCED" not in the verdict)
    - test_statistic_ac02_never_equivalent_for_any_straddling_shape
      (all 7 straddling shapes: never EQUIVALENT)
    notes: >-
      The rule predicates enforce AC-02 exactly: R-EQ-1 (EQUIVALENT)
      requires BOTH endpoints strictly inside the region (i.ci.lower >
      i.bounds.lower AND i.ci.upper < i.bounds.upper); R-EQ-2
      (NOT_EQUIVALENT) requires the whole interval on one side; any
      interval that straddles at least one bound -- including intervals
      wider than the region -- falls through to R-EQ-3 (INCONCLUSIVE).
      Boundary-touching intervals (e.g. exactly equal to the region) are
      also INCONCLUSIVE (test_statistic_equivalence_interval_exactly_region_is_inconclusive)
      -- "sufficiently inside" is strict. The full 7x7 lower/upper grid
      (test_statistic_equivalence_decision_rule_default_is_total) proves
      the mapping is total and reaches all three verdicts.
  AC-03:
    status: PASS
    evidence:
    - test_statistic_ac03_margins_read_from_registered_acceptance_verbatim
    - test_statistic_ac03_margin_honored_when_differing_from_result_derived
    - test_statistic_ac03_margin_honored_when_wider_than_result_spread
    - test_statistic_ac03_bounds_never_derived_from_result
    - test_statistic_ac03_different_margins_yield_different_bounds
    - test_statistic_ac03_no_margin_entry_rejected
    - test_statistic_ac03_non_numeric_margin_rejected
    - test_statistic_ac03_non_positive_margin_rejected
    - test_statistic_ac03_ambiguous_margins_rejected
    - test_statistic_ac03_acceptance_type_boundary
    - test_statistic_ac03_decision_uses_given_bounds_only
    notes: >-
      equivalence_bounds_from_acceptance is a PURE FUNCTION of the frozen
      AcceptanceCriteria record (signature == {acceptance}, proven by
      inspect.signature -- the extractor cannot see the result). It reads
      numeric positive 'margin' entries verbatim (bounds == [-margin,
      +margin], byte-for-byte the stored value), ignores margin-less
      criteria entries, and rejects: no margin ("no equivalence margin in
      the frozen acceptance criteria ... margins are never inferred from
      the result"), non-numeric ("10%"), non-positive/non-finite, and
      several DIFFERING margins (ambiguous). The margin-honoring tests
      construct the result-derived counterfactual (a tight or wide CI)
      and prove the frozen margin wins in both directions: a result-
      inferred margin (~2*SE) would flip each verdict, but the frozen
      0.05 is honored as given. test_statistic_ac03_decision_uses_given_bounds_only
      additionally proves the decision takes bounds as given: flipping the
      frozen margin flips the verdict, and the effect/CI never feed the
      bounds back (assessment records the exact input bounds).
  paradigm:
    status: PASS
    evidence:
