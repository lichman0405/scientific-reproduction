    - test_statistic_report_uncertainty_omits_unknown_standard_error
    - test_statistic_report_metric_name_validation
    notes: >-
      Every established paradigm rule is followed: frozen dataclasses with
      __post_init__ boundary validation; TypeError at the type boundaries
