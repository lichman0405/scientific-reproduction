design_review:
  ac01_by_construction: >-
    The forbidden shortcut (p > 0.05 alone -> REPRODUCED) is impossible by
    construction, not just untested: the verdict enum cannot hold
    REPRODUCED, no decision function accepts a p-value, and the only
    non-significance shape (CI crossing zero) yields EQUIVALENT solely via
    R-EQ-1's strict-inside predicate. The point estimate never decides
    alone -- the interval carries the evidence. The module docstring ties
    every rule to the frozen spec sections (07-STATISTICS-AND-ACCEPTANCE.md
    SS3/SS4/SS5/SS8/SS9 and 20-ARCHITECTURE-DECISIONS.md items 13-14).
  ac02_boundary_semantics: >-
    The R-EQ boundary conventions are precise and consistent: strictly
    inside -> EQUIVALENT; wholly on one side (touching a bound from
    outside counts as outside) -> NOT_EQUIVALENT; anything overlapping a
    bound (including exactly-equal-to-region and wider-than-region) ->
    INCONCLUSIVE. The 7x7 grid test proves totality.
  ac03_inputs_not_inferred: >-
    The extractor is a pure function of the acceptance record with no
    result-shaped input; ambiguous or missing margins are hard errors
    (EquivalenceMarginError with stable messages) instead of silent
    fallbacks -- exactly the "no global +/-10% rule" and "freeze the
    margin before data are observed" sections (SS8/SS9). No path exists
    to derive bounds from the effect estimate or its CI.
  rule_table_paradigm: >-
    EQUIVALENCE_DECISION_RULES follows the established first-match-wins
    rule table: ordered entries with descriptive strings, trailing total
    default (R-EQ-3 predicate True), matched_rule_id post-assert, and the
    full per-rule trace recorded in the assessment with the ruleset
    version. Same paradigm as M4-G05/M6-G01 rule engines.
  reporting_hooks: >-
    effect_metrics / uncertainty_report emit exactly the DEV-M9-G02
    result-record shapes, verified by constructing a real ResultRecord in
    the test -- the M9 series' result/statistics integration point is
    proven, not assumed.
  midflight_flags_resolved: >-
    The pyright flags observed while the worker was mid-flight
    ("Argument missing for parameter confidence_level" at statistics.py
    lines 365/388 and "UNCERTAINTY_METHOD is not defined" at line 748)
    are resolved on the final head: _symmetric_interval receives
    confidence_level positionally in both callers, and _UNCERTAINTY_METHOD
    is defined at line 729 (used at 748). mypy is clean on the exact
    reviewed head 4f43176.

