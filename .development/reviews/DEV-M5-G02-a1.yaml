  - >-
    Design reviewed — issuance: _ISSUANCE_TOKEN (module-private object())
    gates the frozen IssuedResearchRequest constructor via __post_init__,
    making Supervisor-only issuance an invariant of the type rather than a
    policy; issue_research_request hard-codes requested_by "supervisor"
    and exposes no issuer parameter, and _from_issuance re-checks the
    schema invariants so a forged record raises. The frozen model carries
    no timestamp field, so issued_at/linked_at are injected parameters
    (determinism, no clock). Lifecycle: the ordered table R-REQ-S0/C1/E1/D1
    (first match wins, trailing default R-REQ-D1 makes the table total)
    records every rule evaluation in RequestTransitionAssessment, the
    rule-paradigm style of core/rules/ and research/dedupe.py;
    apply_request_transition explicitly rejects no-op transitions
    (a transition records a change) and terminal states have no outgoing
    edges. Linkage: all-preconditions-must-pass semantics, first failing
    rule named in the stable error; ResultLinkageRecord is the full audit
    record. Normative reading: the frozen status vocabulary
    OPEN/SEARCHING/COMPLETE/EXHAUSTED (research-request.schema.yaml) wins
    over the task brief's ISSUED/IN_PROGRESS/RESOLVED labels — mapping
    documented in the module docstring, EXHAUSTED (terminal, no generic
    counterpart) preserved; minimum_reliability/minimum_directness are
    the schema's 0-4 ints with bool exclusion. Paradigm: TypeError at
    public boundaries, ValueError-subclass errors with stable messages
    (IllegalRequestTransitionError carries from/to), frozen dataclasses,
    pure deterministic functions, __all__ exports, docstrings citing
    09-RESEARCH-SUBSYSTEM.md §3, research-request.schema.yaml,
    agent-contracts/RESEARCH.md, CLAUDE-CODE-HANDOFF.md. workflows.py:
    W-BOOT-1..6 ordered steps with a total/disjoint category mapping over
    the frozen SourceType vocabulary and all 12 §2 acquisition bullets
    enumerated. No premise deviations this PR; no flake occurrence.
  - >-
    Pyright IDE diagnostics are the established noise classes: the
