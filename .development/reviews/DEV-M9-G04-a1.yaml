design_review:
  ac01_grouping_is_input: >-
    The distinction is structural, not heuristic: the grouping arrives in
    two separate typed fields and only the independent field is ever read
    by the statistics (_measures iterates input_.independent exclusively).
    No API shape exists that could auto-classify a value, and the
    signature test + the same-values-different-grouping test make the
    absence of guessing observable.
  ac02_floor_is_a_gate: >-
    The floor is enforced at THREE points: the default constant, the
    frozen-criterion reader (verbatim read; override >= 1 only; ambiguous
    rejected), and the evaluator boundary. The max(floor, 2) gate closes
    the edge where a floor-1 override would otherwise make a single
    replicate "determinable" -- a sample standard deviation is
    uncomputable at n=1, so the assessment honestly reports INDETERMINATE
    with a request of one more run instead of a forced verdict.
  ac03_feeds_acceptance_never_decides: >-
    The vocabulary discipline is enforced at four levels (enum values,
    __all__, module attributes, finding text) plus the collision test
    against the frozen RequirementOutcome strings; the module's import
    surface (core.models only) makes outcome closure impossible here, not
    merely unpracticed. The additional-run request is a first-class frozen
    field with a construction-level consistency invariant, and its
    scaling formula is pinned numerically. The precision threshold
    follows the G03 margin pattern exactly: a frozen input read verbatim,
    never inferred, missing/ambiguous/non-numeric rejected.
  rule_table_paradigm: >-
    REPLICATION_DECISION_RULES follows the established first-match-wins
    table with a total default; the assessment enforces two
    construction-level invariants (matched identity + request/status
    consistency) -- strictly stronger than the G03 assessment and equal
    to the G05 rigor. The INSUFFICIENT/INDETERMINATE partition is
    scientifically meaningful: count met but precision short ->
    INSUFFICIENT with a scaled request; count below the determination
    point -> INDETERMINATE with a floor-reaching request.
  stale_base_resolution: >-
    The branch parent 73690579 is an ancestor of origin/main; the four
    intervening commits (G05, G02, two state commits) touch disjoint
    files (three-dot diff = exactly the 2 G04 files). GitHub's merge-ref
    CI passes on the combined state, and the worker's scratch verification
    at 177c4ac + cherry-pick reproduced the merged-state numbers (1702).
    No stale-base deviation; the worker correctly did not rebase/force-
    push (forbidden), and squash merging will produce the same combined
    tree the merge-ref CI already validated.
  midflight_flags_resolved: >-
    The pyright diagnostics observed while the worker was mid-flight are
    all resolved or explained on the final head 1122b03: the
    "independent_n unknown" flags (observed at replication.py 641/646/647/
