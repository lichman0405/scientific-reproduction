acceptance_criteria:
  AC-01:
    status: PASS
    evidence:
    - test_replic_ac01_technical_repeats_never_satisfy_independent_floor
    - test_replic_ac01_technical_only_evidence_rejected
    - test_replic_ac01_technical_values_never_enter_statistics
    - test_replic_ac01_grouping_is_input_not_guessed_from_values
    - test_replic_ac01_independent_values_carry_the_statistical_weight
    - test_replic_ac01_input_series_never_mutated
    notes: >-
      The replicate grouping is INPUT, never guessed: ReplicateDecisionInput
      carries separate 'independent' and 'technical' sequence fields (the
      signature test proves both parameters exist on the evaluator), and
      only the independent values enter the statistics: _measures computes
      mean / sample stdev / standard error / z-based half-width from
      input_.independent alone, so wildly spread technical repeats
      (1000.0, -1000.0, 1e6) change NO state measure and no verdict. A
      technical-only count never satisfies the independent-n floor
      (2 independent + 6 technical stays below the floor: INDETERMINATE
      with a request, and the assessment is identical with the technical
      values dropped); an EMPTY independent group is rejected up front
      with the stable message naming "technical/instrument repeats alone
      never satisfy the independent-n floor". Input series are copied to
      tuples in __post_init__ (later caller mutation cannot change the
      assessment; proven by the mutation test). independent_n / technical_n
      are exposed on both the state and the assessment (the technical n is
      recorded and reported, never weighted).
  AC-02:
    status: PASS
    evidence:
    - test_replic_ac02_default_floor_is_three
    - test_replic_ac02_default_floor_enforced_without_override
    - test_replic_ac02_floor_read_from_frozen_acceptance_verbatim
    - test_replic_ac02_floor_override_honored_by_evaluator
    - test_replic_ac02_floor_never_weakened_below_one
    - test_replic_ac02_non_numeric_floor_override_rejected
    - test_replic_ac02_ambiguous_floor_overrides_rejected
    - test_replic_ac02_below_floor_indeterminate_with_floor_request
    - test_replic_ac02_single_replicate_indeterminate_even_with_floor_one
    notes: >-
      DEFAULT_MIN_INDEPENDENT = 3 (the documented "Default floor: n >= 3",
      07-... SS2 / ADR 9) and the floor is a GATE: two tight independent
      replicates are INDETERMINATE under the default floor regardless of
      how precise they look (R-REP-U1, request 1). The floor override is
      an INPUT from the frozen acceptance criteria: replicate_criterion_from_acceptance
      reads a numeric 'min_independent' entry verbatim (absent -> default
      3; the read-back test proves criterion.min_independent == the stored
      entry), and the override is honored by the evaluator (floor 2 ->
      two replicates are SUFFICIENT). The floor can never be weakened
      below 1: 0/-1/-5 are rejected in BOTH the acceptance reader
      ("must not be weakened below 1") and the evaluator boundary;
      non-numeric, non-integer, boolean, NaN and None overrides are
      rejected ("positive integer"); several DIFFERING overrides are
      ambiguous and rejected ("ambiguous min_independent ... exactly one
      floor"). Below the floor the request is the exact number of
      independent runs needed to reach it (n=1 -> 2, n=2 -> 1). The
      max(floor, 2) determination gate means a single replicate is
      INDETERMINATE even under a floor-1 override (a sample standard
      deviation requires n >= 2) -- the floor is never silently weakened
      into meaninglessness.
  AC-03:
    status: PASS
    evidence:
    - test_replic_ac03_precision_shortfall_requests_additional_runs
    - test_replic_ac03_precision_shortfall_never_pass_fail
    - test_replic_ac03_request_scales_with_precision_shortfall
    - test_replic_ac03_precision_met_yields_sufficient_without_request
    - test_replic_ac03_vocabulary_has_no_pass_fail_or_reproduced_member
    - test_replic_ac03_vocabulary_does_not_collide_with_outcome_strings
    - test_replic_ac03_no_requirement_state_read_or_written
    - test_replic_ac03_precision_read_from_acceptance_verbatim
    - test_replic_ac03_missing_precision_criterion_rejected
    - test_replic_ac03_non_positive_or_non_numeric_precision_rejected
    - test_replic_ac03_ambiguous_precision_rejected
    - test_replic_ac03_metrics_shape_fits_result_record
    - test_replic_ac03_uncertainty_shape_fits_result_record
    - test_replic_ac03_qc_findings_shape_fits_result_record
    - test_replic_ac03_register_result_accepts_sufficiency_output
    - test_replic_ac03_validate_mode_accepts_experimental_modes
    - test_replic_ac03_validate_mode_rejects_other_modes
    notes: >-
      Insufficient precision yields INSUFFICIENT with an explicit
      additional-run request, never a forced PASS/FAIL: the status
      vocabulary ReplicateStatus = SUFFICIENT/INSUFFICIENT/INDETERMINATE
      has no PASS/FAIL/REPRODUCED member (enum values, __all__, and
      module attributes all scanned) and deliberately avoids colliding
      with the frozen RequirementOutcome strings REPRODUCED/NOT_REPRODUCED/
      INCONCLUSIVE (INDETERMINATE chosen as the non-colliding
      inconclusive-analog, documented in the enum docstring and proven by
      the collision test). requested_additional_runs: 0 iff SUFFICIENT,
      >= 1 otherwise; INSUFFICIENT scales deterministically with the
      shortfall (formula pinned in a test: ceil(n * (h / threshold)**2) - n,
      min 1) and the request grows with the observed spread at fixed n.
      The precision threshold is an INPUT from the frozen acceptance
      criteria, read verbatim (the 0.6 frozen threshold is honored over
      the observed spread -- the same wide group is SUFFICIENT under 0.6
      and INSUFFICIENT under 0.1); missing ("no precision criterion ...
      never inferred from the result"), non-numeric/non-positive/NaN/Inf/
      bool/None ("finite positive number") and ambiguous ("ambiguous
      precision ... exactly one precision threshold") entries are rejected
      with stable ReplicateCriterionError. The module never reads or
      writes Requirement state: its imports are only core.models
      (AcceptanceCriteria, DecisionMode); a source scan bans core.rules,
      planning, 'import outcome'/'from outcome'; RequirementOutcome is not
      even a module attribute. The reporting hooks emit the exact
      DEV-M9-G02 ResultRecord shapes (metrics = list of {metric, value}
      dicts; uncertainty = dict with method/n/mean/confidence_level plus
      lower/upper and standard_error when computable; qc_findings = a
      single stable one-line string naming the evidence state and the
      request, never PASS/FAIL words), PROVEN END-TO-END by
      test_replic_ac03_register_result_accepts_sufficiency_output: a
      ResultRecord built from the hooks registers through the real
      register_result (frozen PRIMARY protocol ANL-1 v1 + ART-001 manifest
      + EQUIVALENCE acceptance ACC-1 with the replication criterion, safe
      ids) and reads back byte-identical. validate_replication_mode
      consumes the frozen DecisionMode vocabulary as-is: the frozen model
      has NO REPLICATION member, so the hook serves the quantitative
      experimental modes (SUPPORTED_REPLICATION_DECISION_MODES =
      EQUIVALENCE, BOUNDED_INTERVAL) and rejects every other frozen mode
      (CATEGORICAL, TREND, STRUCTURAL_MATCH, CONVERGENCE, CUSTOM --
      each named in the stable UnsupportedDecisionModeError "the frozen
      vocabulary has no REPLICATION mode") plus TypeError for a
      non-record -- the hook never invents a mode.
  paradigm:
    status: PASS
    evidence:
    - test_replic_paradigm_rule_table_first_match_wins_total_default
    - test_replic_paradigm_ruleset_version_recorded
    - test_replic_paradigm_determinism_across_repeated_calls
    - test_replic_paradigm_module_all_exports_resolve
    - test_replic_paradigm_errors_are_valueerror_subclasses_with_stable_messages
    - test_replic_paradigm_module_is_pure_no_io_no_randomness
    - test_replic_paradigm_frozen_records_reject_mutation
    - test_replic_paradigm_typeerror_at_boundaries
    - test_replic_paradigm_degenerate_inputs_rejected
    - test_replic_paradigm_zero_mean_rejected
    - test_replic_paradigm_assessment_integrity_checks
    - test_replic_paradigm_findings_stable_one_line_strings
    - test_replic_paradigm_metric_name_validation
    - test_replic_paradigm_int_inputs_normalized_to_floats
    - test_replic_paradigm_mean_interval_matches_z_math
    notes: >-
      Every established paradigm rule is followed, matching the merged
      M9-G03/G05 style: ordered rule table REPLICATION_DECISION_RULES
      (R-REP-S1 -> R-REP-I1 -> R-REP-U1 trailing total default; first
      match wins; matched_rule_id never None with a post-assert; every
      rule's outcome recorded in evaluation order); REPLICATION_RULESET_VERSION
      = "1.0" recorded in every assessment; error hierarchy
      (ReplicateAnalysisError -> InvalidReplicateInputError /
      ReplicateCriterionError / UnsupportedDecisionModeError, all
      ValueError subclasses, stable one-line messages -- the same
      degenerate input raises byte-identical text); TypeError at type
      boundaries (str/bool series entries, str/True threshold, str/True
      floor, str confidence); frozen dataclasses with __post_init__
      validation (FrozenInstanceError on mutation); pure deterministic
      functions (source scan: no random/time/urllib/requests/socket/
      open()/os./sys./pathlib/atomic_write/json; identical inputs ->
      identical assessments across calls); __all__ resolves with no
      duplicates; from __future__ import annotations; no type: ignore /
      noqa. NEW rigor beyond G03: the assessment carries TWO
      construction-level invariants in __post_init__ (matched_rule_id
      must name a recorded decision that matched AND whose status equals
      the assessment status; requested_additional_runs must agree with
      the status: 0 iff SUFFICIENT, >= 1 otherwise), the state measures
      are consistency-checked against n (non-None measures with n < 2
      rejected; required measures with n >= 2), the zero independent mean
      is rejected up front (the relative-half-width criterion is
      undefined for it -- a stable error, never an infinite request),
      int inputs normalize to floats, and the mean interval is asserted
      against the pinned Z_095 z-critical value (interval = mean +/-
      z*se; None for a single replicate; technical repeats never move
      it). The z-math and the INSUFFICIENT request formula are both
      pinned numerically in tests -- no floating-point drift is possible
      between the implementation and the claimed semantics.

