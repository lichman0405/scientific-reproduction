design_review:
  blocker_table: >-
    BLOCKER_RULES is an ordered first-match-wins table with a trailing
    total default (R-BLK-4): missing-reference first, then the
    resource-declaration edge before the goal-requirement edge (the
    declaration is the more specific edge). Verdicts are a pure function
    of the frozen BlockerInput (goal_id, resource_id, registered,
    availability_state, explicitly_blocks, required_by_goal) with strict
    __post_init__ validation (registered must agree with
    availability_state); assessments record the exact input, every rule
    decision and matched_rule_id (post-assert non-None), BLOCKER_RULESET_
    VERSION "1.0".
  acceptance_separation: >-
    AC-02 separation is structural: no blocker predicate reads the goal's
    acceptance sub-object; DAGNode carries the GoalContract verbatim
    (acceptance rides along unchanged) while blocked /
    blocking_resource_ids / missing_resource_ids are computed from
    availability state and the frozen edges only. Proven behaviorally
    (byte-identical acceptance and plan records across blocked/unblocked
    exports) and structurally (accepted design reviewed in full).
  gate_classification: >-
    GATE_AXIS_RULES R-AX-E1/A1/B1/N1 with the normative readings locked
    in the module docstring: both flags -> EXECUTION axis (scheduling
    view) with the raw acceptance_gate preserved verbatim so the
    acceptance governance is never lost; neither flag -> EXECUTION (the
    conservative baseline; core/rules/dependencies.py R-DEP-6 keeps an
    un-flagged hard edge non-gating). The classification is a view
    concern; blocking semantics stay with the frozen core rules -- the
    module never re-derives blocking.
  dag_build: >-
    Node set = plan goals + transitive closure over registered dependency
    targets (edges must render; in_plan marks coverage); missing goal
    contracts and unresolved dependency refs are reported explicitly,
    never silently dropped. Deterministic Kahn's algorithm (sorted ready
    set, duplicate declared edges counted once for ordering) produces the
    dependency-first topological order; cycles reported (cyclic_goal_ids,
    acyclic False, empty order), never raised. Nothing is persisted: the
    DAG is a pure function of registered state with a versioned
    (DAG_EXPORT_VERSION "1.0") canonical-JSON export for /goals views.
  determinism: >-
    Every output is sorted (nodes by goal id, edges by
    (dependency, dependent), pairs, blockers, missing sets, ready set);
    identical state -> identical export (verified byte-for-byte); the
    builder writes nothing (resource registry byte-identical before/after
    build).
  paradigm: >-
    TypeError at public boundaries (including explicit str/bytes rejection
    of the goals sequence); ValueError hierarchy (ResourceError ->
    PlanningError; the dag module propagates registry errors with stable
    messages); frozen dataclasses with strict __post_init__; rule tables
    versioned and total with post-evaluation asserts; StrEnum values
    matching the frozen vocabulary; __all__ exports; from __future__ import
    annotations.

