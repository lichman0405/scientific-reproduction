acceptance_criteria:
  AC-01:
    status: PASS
    evidence:
    - test_computational_ac01_not_converged_failure_representable
    - test_computational_ac01_diverging_drift_failure_representable
    - test_computational_ac01_converged_within_tolerance
    - test_computational_ac01_window_changes_verdict
    - test_computational_ac01_late_settling_is_not_diverging
    - test_computational_ac01_observation_inputs_only_no_parameter_surface
    - test_computational_ac01_no_auto_tuning_restart_api
    - test_computational_ac01_assessment_is_frozen
    - test_computational_ac01_input_series_never_mutated
    - test_computational_ac01_no_io_no_persistence_in_source
    - test_computational_ac01_typeerror_at_boundaries
    - test_computational_ac01_contradictory_inputs_rejected
    - test_computational_ac01_stable_error_messages
    - test_computational_ac01_budget_exhausted_reported
    notes: >-
      Convergence failure is representable as a first-class typed result:
      evaluate_convergence classifies the observed iteration series via the
      ordered CONVERGENCE_RULES table into ConvergenceStatus
      (CONVERGED / NOT_CONVERGED / DIVERGING), and ConvergenceAssessment
      exposes a `failure` property (True for NOT_CONVERGED and DIVERGING).
      Purity by construction: the public signature is exactly
      {iterations, tolerance, window, max_iterations} (proven by
      inspect.signature -- no parameter object exists to change); a
      public-name source scan proves no tune/adjust/restart/rerun/
      resubmit/set_/alter callable exists; the input series is COPIED to a
      tuple in __post_init__ (object.__setattr__) so later caller mutation
      cannot change the assessment (proven by test); every record is a
      frozen dataclass (FrozenInstanceError on mutation, including nested
      state.input.tolerance); a source scan proves no I/O/persistence
      (no open(), pathlib, atomic_write, write_text, os., sys., socket,
      urllib, json). Degenerate inputs (single iteration, zero/negative/
      non-finite tolerance, window<1, budget<1, series longer than the
      declared budget) are rejected with stable one-line
      InvalidConvergenceInputError messages; TypeError at type boundaries
      (strings, bools, floats for window). DIVERGING requires the final
      drift to exceed BOTH the frozen tolerance AND every earlier drift
      ("drift not settling") -- an early large drift with late settling is
      NOT_CONVERGED, never DIVERGING (test proves the distinction).
  AC-02:
    status: PASS
    evidence:
    - test_computational_ac02_sampling_mean_se_spread_values
    - test_computational_ac02_confidence_interval_math
    - test_computational_ac02_higher_confidence_wider_interval
    - test_computational_ac02_determinism_repeated_calls
    - test_computational_ac02_empty_samples_stable_error
    - test_computational_ac02_single_sample_stable_error
    - test_computational_ac02_nan_sample_stable_error
    - test_computational_ac02_inf_sample_stable_error
    - test_computational_ac02_non_numeric_samples_typeerror
    - test_computational_ac02_confidence_level_boundary_rejected
    - test_computational_ac02_zero_spread_point_interval
    - test_computational_ac02_samples_never_mutated
    - test_computational_ac02_stdlib_only_no_numpy_scipy
    notes: >-
      sampling_uncertainty reports n, mean, sample stdev, standard error
      (stdev/sqrt(n)), spread, extrema and a normal-approximation CI
      (mean +/- z*se with z from statistics.NormalDist) -- stdlib only
      (fmean/stdev/NormalDist; source-scanned: no numpy/scipy/pandas).
      Deterministic and frozen (repeated calls equal, records frozen).
      Degenerate inputs rejected with stable one-line
      InvalidSamplingInputError messages: empty series ("at least two
      samples ... got 0"), single sample, nan/inf samples (naming the
      sample index), confidence levels outside (0,1); TypeError for
      non-numeric samples (including bools) and non-number levels. A
      constant series yields a zero-spread point interval (se = 0) --
      explicitly allowed, not silently degraded. Input samples never
      mutated (test mutates the caller's list after the call). The
      classic 8-sample series asserts exact stdlib agreement (mean 5.0,
      spread 7.0).
  AC-03:
    status: PASS
    evidence:
    - test_computational_ac03_metrics_shape_fits_result_record
    - test_computational_ac03_uncertainty_shape_fits_result_record
    - test_computational_ac03_qc_findings_shape_fits_result_record
    - test_computational_ac03_register_result_accepts_validation_output
    - test_computational_ac03_validation_decision_mode_is_convergence
    - test_computational_ac03_validate_acceptance_mode_accepts_convergence
    - test_computational_ac03_validate_acceptance_mode_rejects_other_modes
    - test_computational_ac03_validate_acceptance_mode_typeerror
    - test_computational_ac03_tolerance_read_from_acceptance_verbatim
    - test_computational_ac03_criterion_tolerance_reproduces_verdict
    - test_computational_ac03_no_tolerance_entry_rejected
    - test_computational_ac03_ambiguous_tolerances_rejected
    - test_computational_ac03_non_numeric_or_non_positive_tolerance_rejected
    - test_computational_ac03_never_decides_acceptance
    notes: >-
      The validation output feeds the DEV-M9-G02 acceptance path in the
      exact shapes: convergence_metrics/sampling_metrics emit
      ResultRecord.metrics (list of {"metric","value"} dicts),
      sampling_uncertainty_payload emits ResultRecord.uncertainty (dict),
      convergence_findings/sampling_findings emit qc_findings (list of
      one-line strings) -- each proven by a shape test AND the end-to-end
      test_computational_ac03_register_result_accepts_validation_output
      which registers a real ResultRecord (frozen PRIMARY protocol ANL-1
      v1 + ART-001 manifest + CONVERGENCE acceptance ACC-1 workspace,
      safe ids) through the real register_result and reads it back
      byte-equal. The hook references the frozen DecisionMode.CONVERGENCE
      (VALIDATION_DECISION_MODE); validate_acceptance_mode accepts a
      CONVERGENCE record and rejects every other mode (all 6 other
      DecisionMode members enumerated) with a stable
      UnsupportedDecisionModeError naming the declared mode.
      convergence_criterion_from_acceptance reads the frozen tolerance
      verbatim (byte-for-byte, like the M9-G03 margin pattern; the
      extracted criterion reproduces the series verdict), and rejects
      missing ("no convergence tolerance ... never inferred from the
      run"), ambiguous (differing) and non-numeric/non-positive
      tolerances. The module never decides acceptance: ConvergenceStatus
      has no PASS/FAIL/REPRODUCED member, __all__/module has no such
      token, a source scan proves no RequirementOutcome reference, and
      the finding text stays scientific (asserted).
  paradigm:
    status: PASS
    evidence:
    - test_computational_boundary_errors_are_valueerror_subclasses
    - test_computational_boundary_degenerate_input_grid
