design_review:
  ac01_pure_by_construction: >-
    No auto-changing-parameters surface is even expressible: the
    evaluation signature takes observations + frozen protocol values only,
    and the public-name scan + signature test make the absence
    structural, not incidental. The input copy-to-tuple and nested
    frozen-records mutation tests close the two remaining mutation
    vectors (caller's list, nested state).
  ac02_stdlib_only: >-
    The normal-approximation interval is computed with statistics.fmean /
    statistics.stdev / statistics.NormalDist -- the same z-based shape as
    the merged M9-G03 CI utilities, keeping the M9 series statistically
    consistent (the module deliberately does not import statistics.py:
    G03 is not in its base). No scipy/numpy/pandas -- source-scanned.
  ac03_feeds_acceptance_never_decides: >-
    The vocabulary discipline is enforced at four levels: the status enum
    values, __all__, a source scan for RequirementOutcome, and the
    emitted finding text. validate_acceptance_mode + the verbatim
    tolerance extraction mirror the M9-G03 margin pattern exactly (pure
    function of the AcceptanceCriteria record; missing/ambiguous/
    non-numeric rejected). The end-to-end register_result roundtrip
    proves the result package is consumable by the acceptance path.
  rule_table_paradigm: >-
    CONVERGENCE_RULES follows the established first-match-wins table with
    a total default, and ConvergenceAssessment adds a construction-level
    consistency invariant (matched id must exist, must match, must agree
    with status) -- strictly stronger than the G03 assessment. The
    DIVERGING predicate encodes the scientific meaning ("drift not
    settling": final drift > tolerance AND > every earlier drift) rather
    than a generic threshold, and the window test proves window>1 is
    normative (a settled last step alone is not convergence).
  midflight_flags_resolved: >-
    The pyright flags observed while the worker was mid-flight are
    resolved or advisory on the final head 5891f0e: the seven
    "unreachable" diagnostics (computational.py 879/903/947/970/1004/
    1030/1092) are the intentional defensive TypeError raises at the
