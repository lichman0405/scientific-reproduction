design_review:
  launch_wrapper: >-
    The launch command is the remote path/command abstraction in action:
    mkdir -p -- <wd> && cd -- <wd> && (nohup sh -c '<shlex.join(cmd)>;
    echo $? > <quoted statusfile>' > <quoted log> 2>&1 & echo $!) -- the
    exit-status capture (worker self-caught the missing capture during
    development and fixed it before reporting; verified present on the
    final head) is what makes the status probe deterministic without
    waitpid. Every interpolated value is shlex.quote'd; space-bearing
    working directories are accepted as configuration and quoted (never
    breaking the shell line); RemoteCommand round-trips through
    shlex.split.
  safe_vocabulary: >-
    RemotePath enforces absolute POSIX paths with safe-segment join
    (FND-M9-G02-01 discipline: no separators/'..'/'.'/''/whitespace/glob
    metacharacters); unsafe output names rejected with the stable
    SSHJobIdentityError (or the RunContext boundary's stable error where
    applicable); the persisted record contract re-validates output names
    on from_dict (corrupt records rejected with ComputeJobRecordError).
  six_operation_surface: >-
    The full ComputeAdapter interface over SSH mirrors the DEV-M7-G02
    local adapter: prepare stages the durable record + working directory
    (idempotent, rejects restaging, never touches the remote); submit
    launches remotely (never twice) and returns the remote pid; status
    probes a running process and persists the terminal decision, while
    terminal states are answered from the durable record alone (transport
    never contacted again); collect pulls declared outputs to
    <state_dir>/staging/<job_id>/ under retry and registers artifacts
    through the REAL DEV-M3-G02 ArtifactRegistry (deterministic
    generate_id("artifact", job_id, output_name), real SHA-256/size,
    producer stamp adapter:compute/ssh@v1.0, idempotent re-collection
    with no remote contact, conflicting registration -> ComputeCollectError);
    cancel is a local decision for prepared jobs (never contacts the
    remote) and a remote kill + exit-status observation for running jobs
    (SIGTERM 143 recorded); resume re-attaches from the durable record
    alone. Frozen decision records (SSHPreparedJob/SSHSubmittedJob/
    SSHJobStatus/SSHCancelledJob/SSHResumedJob/SSHCollectedJob) with
    strict to_dict; byte-identical records for identical injected inputs;
    injectable clock (6 identical fixed reads in the full cycle);
    TypeError at type boundaries, ValueError-subclass stable errors.
  remote_file_discipline: >-
    A definitively absent remote output is a clean remote answer
    (SSHRemoteFileNotFoundError -> ComputeCollectError naming the output),
    structurally distinct from transport failures and never retried --
    exactly one pull attempt, one session (asserted via the transport
    call log).

