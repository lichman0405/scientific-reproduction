    status: PASS
    evidence:
    - test_result_unsafe_input_artifact_id_rejected_at_record_boundary
    - test_result_unsafe_output_artifact_id_rejected_at_record_boundary
    - test_result_register_result_rejects_unsafe_input_artifact_ids
    - test_result_register_result_rejects_unsafe_output_artifact_ids
    - test_result_regression_traversal_artifact_id_cannot_escape_manifests
    - test_result_defense_in_depth_unsafe_artifact_id_rejected_at_resolution_gate
    notes: >-
      The fix restores AC-01 exactness at both layers. Record boundary:
      __post_init__ calls _require_safe_registry_id_entries on
      input_artifact_ids and output_artifact_ids (after _require_ref_list),
      raising ResultRecordError with the stable message naming the field
      and the offending value (verified verbatim in the proof output). The
      9-entry unsafe-id matrix ('../x', 'a/b', 'a\b', '.', '..', 'ANL*',
      'ANL?', 'ANL[1', 'ANL]1') is rejected at construction, via mapping
      input through register_result (nothing written, result registry
      empty), and via dataclasses.replace / ResultRecord.from_dict (no
      public bypass: both re-run the frozen constructor). Resolution gate:
      _resolve_artifact_refs re-checks _is_safe_registry_id before
      ArtifactRegistry.get and raises UnresolvedResultReferenceError
      naming the result id and the artifact id -- proven directly by
      invoking the gate with a bypassed id. The crafted-file regression
      test reproduces the original exploit and asserts the crafted file's
      bytes are never read (byte-identical after the attempt) and both
      registries are unchanged.
