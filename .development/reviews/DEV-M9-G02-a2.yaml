finding:
  id: FND-M9-G02-01
  severity: MEDIUM
  source: PostToolUse security review hook (flagged after the a1 merge)
  summary: >-
    Unvalidated artifact ids in ResultRecord were passed to the pre-existing
    ArtifactRegistry.get(), which builds base_dir / f"{artifact_id}.json"
    with no id validation -- an input_artifact_ids entry like "../EVIL"
    resolved manifests/../EVIL.json, a crafted manifest-shaped JSON at the
    workspace root, OUTSIDE the manifests/ registry. Registration succeeded
    and the result package referenced an entity that was never registered:
    AC-01 exactness violated, registry boundary bypassed.
  exploit_path: >-
    (1) register a legitimate artifact ART-001; (2) craft a valid
    manifest-shaped JSON at the workspace root as EVIL.json (reachable as
    manifests/../EVIL.json); (3) register_result with
    input_artifact_ids=["../EVIL"]. Vulnerable behavior: accepted; stored
    ref resolves to the crafted file; registry.list() never contains
    ART-X. Root cause confirmed in source: results.py __post_init__
    validated run_ref/analysis_id/acceptance_ref with _is_safe_registry_id
    but artifact ids only with _require_ref_list (str/non-empty/unique);
    artifacts/registry.py get() has no id validation (validates only at
    register()); ArtifactRegistry( is constructed only in results.py
    (grep-verified), so the results.py boundary fully contains the fix.
  proof_before_fix: >-
    Supervisor's independent venv script (fnd_m9g02_proof.py, run against
    merged main 1beec5a): "register_result SUCCEEDED with id '../EVIL'
    (traversal accepted) / stored input_artifact_ids: ['../EVIL'] /
    registry.list() after: ['ART-001'] / 'ART-X' in registry.list():
    False / ==> EXPLOIT CONFIRMED: ref resolved to a manifest-shaped file
    outside the artifact registry (AC-01 exactness violated, boundary
    bypassed)".
  fix_requirements: >-
    (1) ResultRecord.__post_init__ validates every input_artifact_ids /
    output_artifact_ids entry with _is_safe_registry_id (reject '', '.',
    '..', '/', '\', glob metacharacters '*', '?', '[', ']') raising
    ResultRecordError with a stable message; requirement_refs stays pure
    linkage (AC-03, no safe-id check). (2) Defense-in-depth:
    _resolve_artifact_refs re-checks each id before ArtifactRegistry.get,
    raising UnresolvedResultReferenceError naming the result id and the
    artifact id, so the loop never constructs a registry path from an
    unsafe id. (3) Docstrings updated (module AC-01 section, ResultRecord
    field docs, register_result Raises, ResultRecordError class doc).
    (4) Parametrized boundary tests + a crafted-file regression test
    reproducing the proof. (5) All test names contain "result"; scope
    strictly results.py + test_results.py.
  proof_after_fix: >-
    Same script re-run by the supervisor against the fix head 31d94a04:
    "registry.list() before: ['ART-001'] / crafted file at:
    ...\EVIL.json (outside manifests/) / register_result RAISED:
    ResultRecordError ResultRecord.input_artifact_ids entry '../EVIL' is
    not a safe registry id (no '/', no '\', not '.' or '..', no glob
    metacharacters '*', '?', '[' or ']') / ==> NO EXPLOIT (boundary
    rejected the id)". The rejection fires at record construction
    (__post_init__), i.e. the earliest possible entry point.

