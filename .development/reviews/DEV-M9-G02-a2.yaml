design_review:
  two_layer_defense: >-
    The fix follows the DEV-M9-G01 glob-injection precedent exactly:
    validation at the record boundary (every artifact id is a safe single
    path segment or the record cannot be constructed) AND re-validation at
    the resolution gate (the loop never builds a registry path from an
    unsafe id even if the boundary were somehow bypassed). Both layers use
    the shared _is_safe_registry_id rule, so the vocabulary is
    consistent: '', '.', '..', '/', '\', and glob metacharacters are all
    rejected. The rejection point (construction) is earlier than the
    original fix requirement (registration) -- strictly stronger.
  ac03_preserved: >-
    requirement_refs is deliberately exempt from the safe-id check:
    requirement refs are pure linkage (AC-03), not registry paths, so the
    check would reject nothing meaningful and could only break the linkage
    semantics. The exemption is documented in code.
  scope_discipline: >-
    ArtifactRegistry itself is pre-existing merged code (DEV-M3-G02) and
    is NOT modified; its get() semantics are unchanged. The fix is
    contained entirely at the results.py boundary, which grep-verified is
    the only construction site of ArtifactRegistry -- the boundary fully
    contains the vulnerability. Only results.py + test_results.py changed
    (+226/-12; the -1 in tests is a docstring line, no test removed).
  audit_trail: >-
    The a1 review (DEV-M9-G02-a1) documented the design and the merge;
    this a2 review documents the post-merge security finding, the
    empirical proof before/after, the fix, and the re-verification --
    superseding the a1 PASS's follow-up status. The proof script and both
    outputs are quoted verbatim for the audit trail.

