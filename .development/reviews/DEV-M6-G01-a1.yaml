design_review:
  frozen_contract_grounding: >-
    The context is generated from the frozen Goal Contract only: the
    generator rejects drafts (GoalNotFrozenError) and non-formal versions
    (ContextBuildError), the package references the frozen record exactly
    by goal_id/goal_version, and the package identity (context_id) is a
    deterministic fingerprint of goal+version+role. The required policy
    resolution (ref required, id matched, unreferenced policy rejected) is
    total and loud -- no silent policy substitution.
  relevance_filter: >-
    The ordered rule table (versioned, first-match-wins) with the trailing
    total default is the canonical house pattern: every candidate is
    classified, matched_rule_id is never None (post-assert), and every
    decision is recorded in the frozen RelevanceAssessment (input + all
    rule decisions + deciding rule + ruleset version). The rule set
    mirrors the frozen linkage exactly: protocol/resource/policy from the
    Goal Contract, evidence via used_by (06-EVIDENCE-SYSTEM.md SS6),
    sources of that evidence, upstream outputs of dependency goals.
  manifest_authority: >-
    The manifest is authoritative: package reference lists are derived
    from it, and the context hash fingerprints the manifest's canonical
    JSON. Mutating a package list in place cannot change the hash or the
    manifest -- the fingerprint is anchored at the manifest, not the
    package. Version fields are recorded where the frozen model declares
    them (goal version, protocol_version) and None otherwise -- documented.
  boundary_discipline: >-
    TypeError/ValueError-subclass split with stable one-line messages;
    real registry reads (read_goal / list_goals / read_analysis_protocol
    / read_acceptance-free) with loud GoalNotFoundError for a vanished
    dependency; in-memory registries (evidence/source/policy) injectable
    and documented; ProjectNotInitializedError gate; canonical JSON;
    __all__; from __future__ import annotations; pure functions (no
    randomness/wall-clock; deterministic fixtures pin every input).
  deviations: >-
    One process deviation documented: the branch was created from the
    correct dispatch-time base (cd75eab, matching the attempt record), but
    was not rebased onto the advanced main before verification, so the
    worker's head verification numbers reflect the pre-M9-G02 tree. The
    supervisor closed the gap by verifying the exact simulated merged
    tree; the merge is authorized on that evidence. The worker's
    verification claims are all reproduced exactly (31/1440-6-1 / ruff /
    mypy 61 / contracts / CI).

