design_review:
  decomposition: >-
    Three acceptance suites, one per AC: planning-benchmark (16 tests,
    live frozen-register reads + real gates as subprocesses + real-machinery
    re-derivation on a representative subset), scenarios-all (24 tests,
    the pinned scenario-suite fixture: file existence, offline collected
    counts, AC mapping grounded in the frozen review records), reload-audit
    (10 tests, full register reload through real APIs + audit re-derivation
    + freeze round-trip + byte-identical determinism). Three acceptance
    review records under benchmarks/fdm201/reviews/ (REVIEW-FDM201-PLANNING-001,
    REVIEW-FDM201-SCENARIOS-001, REVIEW-FDM201-RELOAD-001) document PASS
    with evidence lists; supervisor_review_id left null for the Supervisor.
  real_machinery: >-
    No mocks of the system under test anywhere: real planning machinery
    (initialize_project, register_inventory_item, register_requirement,
    audit_inventory_registry, register_goal, register_acceptance,
    register_analysis_protocol, register_closure_contract, build_plan_v1,
    freeze_plan, read_plan, plan_inventory_audit view), real core schema
    validation, and the real frozen gates executed as subprocesses with
    sys.executable at the repo root exactly as shipped. Every asserted
    rule id (R-AUD-P1) and every asserted frozen value is matched by the
    real engine/register, not hardcoded.
  grounding: >-
    All numbers read live from the frozen register files (nothing copied
    into the tests): 82/82, coverage 1.0, category/status totals, 20 goal
    ids, 46 assumptions, 10 protocols, 4 closure contracts, 17 resources,
    82 evidence records, 20 package files. Supervisor independently
    confirmed verbatim: mapping_audit, plan_v1, GOAL-EXE-50, INVENTORY
    requirement_mapping_policy. The only defined table is the
    category->item_type mapping, documented as such.
  determinism: >-
    Fixed identities and fixed timestamps (project init 2026-01-01, freeze
    2026-08-14T00:00:00Z), no wall clock, no randomness, no network;
    every reload/audit replay across two fresh workspaces is byte-identical
    (tree_bytes with workspace-path normalization, PlanInventoryAudit
    equality, frozen-plan byte equality). The scenario fixture uses
    offline importlib enumeration (no collection side effects).
  scope: >-
    git status on the head is clean; exactly 6 files under
    tests/benchmarks/ and benchmarks/fdm201/reviews/ added. No src/
    changes, no benchmark data changes, no .development changes, no AC
    changes, no --no-verify. The worker fast-forwarded its branch onto
    origin/main d1f9497 before committing (single commit 60472fd).

