observations:
  - id: OBS-M12-G07-01
    detail: >-
      The DEV-M12-G07 task brief quoted "92 tests" for scenarios A-J and
      suggested test_D_ac04_*/test_E_ac05_* prefixes; the actual frozen
      suite collects 115 tests (pinned per-file) with different name
      conventions (D plain test_D_*, E ac01/ac02/ac03 families). The
      worker documented the deviation and pinned the actual suite as the
      acceptance fixture (REVIEW-FDM201-SCENARIOS-001.yaml, PR body). This
      is a brief-vs-reality mismatch, not an AC change; the lesson for
      future briefs is to read the actual suite before quoting counts.
      Tracked at the M13 Release Gate.
  - id: OBS-M12-G07-02
    detail: >-
      The registry GoalContract model cannot express the frozen goals.yaml
      inline acceptance-criteria text (acceptance is a criteria_ref id) --
      the G05 finding from PR #75, now confirmed again by the reload
      suite: the reload derives criteria_ref ACC-<goal_id> and preserves
      the frozen text in the acceptance record, asserting the frozen
      inline text directly. API-design candidate for a future milestone;
      tracked at the M13 Release Gate. Related: OBS-M12-G05-01/02,
      OBS-M12-G06-02.
  - id: OBS-M12-G07-03
    detail: >-
      No register_assumption API exists in the registry (the assumptions
      register is a benchmark planning artifact), so the 46-entry
      assumptions register is asserted via the frozen file and the core
      assumption schema rather than through the registry. API-completeness
      candidate, consistent with OBS-M12-G06-02 (no register_assumption /
      register_human_gate helpers); tracked at the M13 Release Gate.

