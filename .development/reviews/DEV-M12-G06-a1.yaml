findings: []

observations:
  - id: OBS-M12-G06-01
    detail: >-
      The inventory registry is immutable-functional: an item registered
      with no requirement_ids is UNMAPPED and cannot be repaired by any
      registry API (registering a requirement that references the item
      does not change its mapping status). The repairable missing-mapping
      shape is the AMBIGUOUS one -- the item records its mapping intent
      while the requirement registration is omitted; registering the
      requirement repairs the audit. This is a documented design property,
      exercised by test_J_ac05_fully_unmapped_item_blocks_freeze_without_registry_repair,
      and worth surfacing in the API docs (register_inventory_item:
      requirement_ids must be recorded at registration). Tracked at the
      M13 Release Gate, not in frozen v0.1 scope.
  - id: OBS-M12-G06-02
    detail: >-
      There is no register_assumption / register_human_gate helper in src;
      the scenario tests use the house registry pattern (validate_and_reject
      + canonical atomic_write, as planning/inventory.py does) for the
      workspace assumptions/ and human-gates/ registries. Dedicated
      registration helpers are an API-completeness candidate for a future
      milestone; tracked at the M13 Release Gate.

