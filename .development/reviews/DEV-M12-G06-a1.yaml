design_review:
  decomposition: >-
    One scenario per file, each self-contained with deterministic project
    fixtures (initialize_project with fixed identity/timestamp), scenario
    execution helpers returning frozen result records, and AC-mapped test
    functions (test_I_ac04_*, test_J_ac05_*, test_F_ac01_*). F was
    extended in place with one new test; G/H verified as already
    satisfying their ACs; I and J are new suites.
  real_machinery: >-
    No mocks of the system under test anywhere: real registries
    (inventory/requirements/assumptions/human-gates/decisions), real rule
    engines (assumption_effect/evaluate_strict_label R-EFF-1/R-STRICT-2,
    mapping rules R-MAP-*, audit rules R-AUD-*), real permission matrix
    and role contracts, real schema gates (validate_and_reject) and real
    atomic canonical persistence. In-memory scripted doubles appear only
    at adapter external boundaries in the pre-existing F/G/H suites.
  grounding: >-
    All scenario values are read live from the frozen benchmarks/fdm201/
    register files (plans/assumptions.yaml, inventory/INVENTORY.yaml,
    goals/goals.yaml, goals/mapping_audit.yaml, resources/resources.yaml,
    execution_packages/computation/cmp-pkg-03-gcmc.yaml) -- nothing is
    invented. Grounding tests assert the frozen facts verbatim so the
    scenarios cannot silently diverge from the benchmark.
  determinism: >-
    Fixed identities/timestamps, pinned safe ids, deterministic
    generate_id assumption ids, no randomness, no wall clock, no network;
    cross-workspace byte-identical checks for the assumption registry and
    the frozen plan; FrozenInstanceError mutation-rejection checks across
    all scenario records; safe-id scans on every id on the scenario paths.
  scope: >-
    git status on the head is clean; exactly 3 files under
    tests/scenarios/test_F*|test_I*|test_J* (1 modified, 2 added). No
    src/ changes, no benchmark data changes, no .development changes, no
    AC changes, no --no-verify.

