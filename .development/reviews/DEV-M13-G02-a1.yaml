design_review:
  decomposition: >-
    One deliverable (the report generator) decomposed into: the 9 fixed-
    order markdown sections (scope/methods/statistics/recovery-history/
    failures/outcomes/method-reproducibility/key-claims/limitations), the
    structured ClaimReport / ReportSection / Report surfaces with canonical
    JSON serialization, and an error hierarchy mirroring audit.py
    (ReportError -> ReportNotInitializedError / ReportCorruptError with
    stable messages). 18 tests map 1:1 to the three AC surfaces plus
    boundaries.
  real_machinery: >-
    Everything is read through the real registration APIs: the audit
    package (build_audit_package) is consumed as a read surface (run
    statuses, claim traces, requirement/acceptance/analysis/artifact
    records), project/goals/inventory/closure records through the real
    planning read APIs, protocol lineages through
    list_protocol_versions. The in-memory EvidenceRegistry is the explicit
    input (v0.1 has no evidence store -- consistent with the G01 design,
    OBS-M13-G01-03). Nothing mocked, no validation re-implemented.
  grounding: >-
    Every section cites its frozen spec section: 05-GOAL-RUN-SCHEMA.md SS2
    (RequirementOutcome/MethodReproducibility) and SS7 (scientific review
    stored separately from lifecycle; terminal states),
    08-STRICT-RECOVERY-CLOSURE.md (v0.1 recovery representation),
    14-STATE-GIT-ARTIFACTS.md SS7 (claim trace chain). No invented
    vocabulary; the report is documented as the human-readable projection
    of the machine-auditable package (the source of truth).
  determinism: >-
    Pure function of the registered state: every collection sorted by
    stable keys (goals/inventory/closure/protocol ids, runs by run_id,
    claim traces, gap ref ids), no wall clock, no randomness, no network.
    Byte-identical markdown and canonical JSON across repeated builds are
    asserted in the ac03 family.
  scope: >-
    git status on the head is clean; exactly 2 files added (1 src module,
    1 test module), all under the allowed scope. No .development changes,
    no AC changes, no --no-verify. Single commit ae63f51 on base 8c7c171
    (PR base = dispatch-time origin/main); PR mergeable.

