  - id: OBS-M13-G02-02
    detail: >-
      pytest -k matches the nodeid path: `-k report` on tests/reporting
      selects all 51 tests (33 audit/trace + 18 report) because the
      directory name "tests/reporting" contains "report". The goal's
      verification command is satisfied either way and the selection is
      stable across runs; noted so the Release Gate's goal-command
      verification is interpreted with this matching rule.
  - id: OBS-M13-G02-03
    detail: >-
      The double-pytest-process phenomenon recurred for the supervisor full
      suite (two identical `python -m pytest -q tests` processes, same
      review venv). Both runs produce identical results -- harmless but
      wasteful; same harness-level class as OBS-M13-G01-01, tracked for the
      M13 Release Gate.

