acceptance_criteria:
  AC-01:
    status: PASS
    evidence:
    - >-
      supervisor read of the full implementation (report.py, 941 lines):
      build_report renders the scientific outcome and the method
      reproducibility outcome in two separate fixed sections with their own
      frozen vocabularies -- the "Outcomes" section renders
      ReproductionRequirement.outcome (RequirementOutcome,
      05-GOAL-RUN-SCHEMA.md SS2) and the run scientific reviews
      (ScientificReview, stored separately from the run lifecycle, SS7);
      the "Method reproducibility" section renders
      Requirement.method_reproducibility (MethodReproducibility, SS2),
      protocol adherence of each analysis result (execution against a
      frozen protocol version of the registered lineage) and run lifecycle
      coverage. Nine sections in fixed order (Scope, Methods, Statistics,
      Strict/recovery history, Failures and deviations, Outcomes, Method
      reproducibility, Key claims and traceability, Limitations) covering
      the objective.
    - >-
      tests: test_report_sections_cover_objective_in_fixed_order_ac01,
      test_report_distinguishes_outcome_from_method_reproducibility_ac01
      (asserts "DIRECTLY_REPRODUCIBLE" absent from the Outcomes section and
      "REPRODUCED" absent from the Method reproducibility section -- the
      vocabularies never bleed into each other),
      test_report_outcomes_render_real_requirement_records_ac01,
      test_report_method_reproducibility_protocol_adherence_ac01; goal
      command 51 passed in the supervisor independent run (22.37s, exit 0)
    notes: >-
      AC-01 "distinguish scientific outcome vs method reproducibility" is
      evidenced by the two-section separation with vocabulary isolation
      asserted in both directions plus the fixed 9-section order covering
      the objective. Every value is read through the real records (audit
      package run entries, requirement records, result records, protocol
      lineages); nothing derived.
  AC-02:
    status: PASS
    evidence:
    - >-
      supervisor read of the full implementation: the failures section
      renders EVERY run of the run store with its derived RunStatus
      (reporting.audit, consumed as a read API -- AC-02 in G01's surface)
      in a run table with status counts, then summarizes the failed runs
      (CANCELLED / INVALIDATED lifecycle or FAIL scientific review)
      explicitly with the exact reason, deviations and engineering retries
      -- never hidden; totals for deviations and retries are rendered.
      Strict/recovery history additionally renders goal tracks, recovery-
      outcome requirements, closure-contract recovery progress and per-run
      retries/deviations (08-STRICT-RECOVERY-CLOSURE.md v0.1 representation).
    - >-
      tests: test_report_failed_runs_summarized_ac02 (failed run visible in
      the table AND summarized explicitly; "Runs (2 total): failed 1,
      succeeded 1"), test_report_failed_review_run_summarized_ac02 (CLOSED
      run with FAIL scientific review -> "[FAIL scientific review]"),
      test_report_deviations_summarized_ac02
    notes: >-
      AC-02 "material failed Runs are summarized, never hidden" is
      evidenced by the total run-table rendering plus the explicit failed-
      run summary block with per-run reason. The frozen Run vocabulary has
      no failed state (FAILED is a derived RunStatus classification,
      consistent with G01's documented decision).
  AC-03:
    status: PASS
    evidence:
    - >-
      supervisor read of the full implementation: the structured ClaimReport
      surface cites the real auditable object ids of each key claim's trace
      (reporting.traceability, consumed as a read API): evidence_ids,
      requirement_ids, acceptance_ids, result_ids, run_ids, artifact_ids
      (sorted, deduplicated via nodes_for per TraceKind), plus gap_count and
      gap_ref_ids from the trace gaps; the "Key claims and traceability"
      section renders every id and the gap count (14-STATE-GIT-ARTIFACTS.md
      SS7). The limitations section surfaces trace gaps with their dangling
      ref ids, unresolved run artifact refs and result warnings.
    - >-
      tests: test_report_key_claims_cite_auditable_object_ids_ac03 (all six
      id sets asserted against the installed chain), test_report_key_claims_
      section_renders_ids_ac03, test_report_empty_key_claims_ac03,
      test_report_multiple_claims_sorted_deterministic_ac03,
      test_report_render_is_deterministic_ac03 (byte-identical markdown +
      canonical JSON), test_report_limitations_surface_registered_state_ac03
    notes: >-
      AC-03 "report references auditable object ids for its key claims" is
      evidenced by the ClaimReport surface (ids resolved from the real claim
      traces) and the rendered key-claims section. The worker's pyright
      concern about ClaimReport.gap_ref_ids (L752/L902) is verified NOT a
      defect: gap_ref_ids is a declared dataclass field (L202) populated
      from the trace gaps (L905) and rendered in the limitations section.

