acceptance_criteria:
  AC-01:
    status: PASS
    evidence:
    - test_claude_ac01_capability_declares_the_native_operations
    - test_claude_ac01_adapter_implements_the_locked_interface_surface
    - test_claude_ac01_spawn_persistent_role_is_a_native_team_task
    - test_claude_ac01_spawn_worker_is_a_native_team_task
    - test_claude_ac01_spawn_task_id_is_a_pure_function_of_session_ref
    - test_claude_ac01_fallback_subagent_is_the_explicit_fallback_path
    - test_claude_ac01_refused_subagent_spawn_keeps_the_durable_identity
    - test_claude_ac01_unavailable_store_answers_explicit_unsupported
    - test_claude_ac01_default_adapter_without_sdk_answers_explicitly
    - test_claude_sdk_guard_raises_typed_refusal_when_sdk_absent
    - test_claude_task_bundle_is_canonical_and_carries_the_contract
    - test_claude_unknown_session_is_session_not_found
    - test_claude_invalid_inputs_raise_type_and_data_errors
    notes: >-
      The adapter demonstrates the spawn path both natively and through
      the hermetic mock: spawn_persistent_role / spawn_worker are NATIVE
      Agent Teams task spawns (task id derived deterministically from the
      canonical session_ref via generate_id("team_task", session_ref); the
      task bundle carries the durable identity plus the frozen role
      contract directives -- contract_id, contract_version, state_truth_rule,
      prompt_obligations/prohibitions -- the agent-team task mapping
      deliverable); the capability record declares the six orchestration
      operations native and deliberately excludes fallback_subagent (the
      explicit fallback channel itself, always answered FALLBACK);
      fallback_subagent always answers FALLBACK with a reason naming the
      channel and carries the same canonical session_ref as a native spawn
      of the same logical context; a refused subagent spawn, an
      unavailable store (SDK absent) and a refusing store all answer the
      explicit typed UNSUPPORTED/FALLBACK with a reason -- never a
      fabricated session (AC-03); the default adapter (real thin wrapper
      clients, no live SDK in the test runtime) honors the contract; the
      SDK guard test pins AgentTeamTaskStore's typed TeamStoreUnavailableError
      when the Agent SDK is absent. The concrete adapter implements the
      full locked PlatformAdapter abstract surface plus the explicit
      replacement path, and capability answers stay distinct from data
      errors (SessionNotFoundError / PlatformAdapterDataError / TypeError
      at the public boundaries).
  AC-02:
    status: PASS
    evidence:
    - test_claude_ac02_replaced_session_carries_the_same_session_ref
    - test_claude_ac02_missing_task_record_does_not_rewrite_identity
    - test_claude_ac02_task_record_alone_never_creates_identity
    - test_claude_ac02_adapter_never_queries_the_store_by_identity_fields
    - test_claude_ac02_replacement_reconstructs_from_workspace_snapshot
    - test_claude_ac02_fallback_replacement_keeps_identity_and_outbox
    - test_claude_ac02_snapshot_round_trips_and_corrupt_state_is_a_data_error
    - test_claude_ac02_replace_unknown_or_unavailable
    notes: >-
      The Agent Teams task store is never authoritative for identity: the
      durable identity is the Core's WorkerSessionHandle.session_ref,
      reflected workspace-side in the SessionRegistry (the adapter's
      shared-workspace slice, 13-EXECUTION-MONITOR.md SS3-SS4). The
      direction of the dependency is pinned: the transport task id derives
      from the session_ref (never the reverse), every store interaction is
      keyed by the derived task id only (recorded by the fake), a replaced
      session carries the byte-identical same session_ref (Run.
      worker_session_ref never changes), a missing task-store record never
      nullifies or rewrites the identity (resume still answers the typed
      FALLBACK with the same durable handle), and a stray task record
      alone never creates an identity (SessionNotFoundError). The
      scenario-G reconstruction flow is pinned end to end: a crash-time
      durable snapshot (to_records) replayed into a fresh registry
      (from_records) with a fresh task store whose live sessions are gone
      answers the same identity, the durable outbox survives the
      replacement, and the replacement session takes over without
      chat-memory access. Snapshot round-trips losslessly; corrupt
      workspace state is the stable PlatformAdapterDataError.
  AC-03:
    status: PASS
    evidence:
    - test_claude_ac03_resume_returns_fallback_naming_the_limitation
    - test_claude_ac03_resume_is_native_when_a_live_session_is_attached
    - test_claude_ac03_resume_with_unavailable_store_preserves_identity
    - test_claude_ac03_is_session_alive_never_fabricates_liveness
    - test_claude_ac03_terminated_session_is_never_resumed_or_replaced
    - test_claude_ac03_terminate_is_native_when_a_live_session_is_stopped
    - test_claude_expose_command_native_when_live_and_outboxed_when_not
    - test_claude_deterministic_flow_repeatable
    notes: >-
      The known Agent Teams resume limitation (documented by Claude Code:
      "/resume and /rewind do not restore in-process teammates" -- the
      task record survives but the live in-process session object is gone
      after a lead-process restart) is reconciled explicitly and pinned by
      tests: resume_session answers FALLBACK with a fallback_reason naming
      the limitation in three distinct states (task record present but no
      live session; task record missing; store unavailable) and always
      returns the durable identity -- never nullified; is_session_alive
      never fabricates liveness -- NATIVE only with an observed boolean
      (True when a live session is attached, False exactly for a durably
      terminated session) and UNSUPPORTED with alive=None whenever the
      liveness is unobservable; a terminated session is a durable fact
      (resume/replace/command refused with typed reasons, second terminate
      idempotent FALLBACK); the explicit replacement path (replace_session)
      and fallback_subagent create replacements carrying the same canonical
      session_ref reconstructing from the shared workspace with the durable
      outbox preserved; expose_command delivers NATIVE into a live session
      or preserves the directive in the durable outbox (FALLBACK, the
      adapter-defined fallback channel); the whole flow is a pure function
      of the inputs (byte-identical repeatability test).

