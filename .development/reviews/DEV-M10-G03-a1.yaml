design_review:
  mechanism_mapping_honest: >-
    The operation-to-mechanism mapping (the goal deliverable) is explicit
    and honest about the v0.1 product surface: persistent roles and
    goal-scoped workers map to Agent Teams task-store sessions
    (worker_mode: agent_team_task; file-based task list surviving
    restarts, in-process teammate session objects not surviving), the
    explicit fallback channel maps to a short-lived headless single-shot
    subagent run (claude -p style), terminate maps to the SDK stop_task
    surface. All real Claude-specific interaction sits behind two
    hermetically mockable boundaries (TeamStoreClient, ProcessRunner) the
    tests fake deterministically -- the M8-G06 SlurmClusterMock precedent
    -- and the real wrappers answer typed refusals in the deterministic
    runtime (AgentTeamTaskStore raises the typed TeamStoreUnavailableError
    when the SDK is absent; ClaudeSubprocessRunner answers accepted=False
    without running a live process). The NATIVE spawn path is demonstrated
    through the scripted fake exactly as AC-01 permits ("real or
    hermetically mocked spawn path"), and the default adapter without a
    live SDK still honors the full contract explicitly.
  task_store_never_authoritative: >-
    AC-02 is enforced structurally: derive_task_id(session_ref) is a pure
    function of the durable identity (the direction of the dependency can
    never invert -- the task id cannot influence the session_ref), the
    SessionRegistry is the workspace-side reflection of the Core's
    identity, rehydratable from a durable snapshot via from_records
    (13-EXECUTION-MONITOR.md SS3-SS4 reconstruction), every store
    interaction is keyed only by the derived task id, and the tests pin
    the three dangerous directions: replacement preserves the same
    byte-identical identity, a missing record does not rewrite it, and a
    stray record does not create one. The registry's put() preserves the
    durable outbox on re-registration so a replacement never loses the
    pending commands preserved for it.
  resume_limitation_reconciled: >-
    AC-03 is reconciled explicitly and mechanically: the module docstring
    documents the Claude Code limitation verbatim; resume_session answers
    the typed FALLBACK with a fallback_reason naming the limitation in
    three distinct states (record present / record missing / store
    unavailable -- each with its own stable reason constant); liveness is
    never fabricated (NATIVE only with an observed boolean, UNSUPPORTED
    alive=None otherwise); a terminated session is a durable fact in the
    registry (never resumed, never replaced, never commanded, idempotent
    terminate); replace_session and fallback_subagent create replacements
    with the same canonical session_ref reconstructing from the shared
    workspace including the durable outbox; and the whole flow is pinned
    by a byte-identical repeatability test. The sixteen stable reason
    constants are exported for callers and asserted verbatim by tests.
  house_style: >-
    The package follows the house style exactly: frozen dataclass records
    (TaskStoreProbe, SubprocessSpawn, SessionRecord), StrEnum vocabulary
    (SessionState ACTIVE/TERMINATED), TypeError at the public boundaries,
    stable ValueError-subclassed errors (TeamStoreUnavailableError extends
    PlatformAdapterError; PlatformAdapterDataError for corrupt data),
    deterministic ids via core.ids.generate_id (team_task / subagent_spawn
    kinds), canonical serialization with lossless round-trip and
    corrupt-state wrapping into the stable error, and no wall clock, no
    randomness, no I/O anywhere in the package -- the determinism hygiene
    is asserted by import scans over every module of the package.
  neutrality_containment: >-
    The Claude-specific containment is enforced by a custom AST scan
    (test_claude_hygiene_no_claude_specific_imports_at_module_level): in
    every claude_code module, module-level imports are stdlib or
    scientific_reproduction only, and Claude-specific roots (anthropic /
    claude_code / claude / us.anthropic / claude_agent_sdk) may appear
    only inside function bodies -- the real SDK import is a guarded
    importlib.import_module inside AgentTeamTaskStore._load_sdk, so the
    package imports and the adapter functions without the Agent SDK. The
    neutrality test vocabulary extends test_base_neutrality with the SDK
    package name, and test_claude_hygiene_no_wall_clock_and_no_randomness
    scans every module for random/uuid/time/datetime.
  observations: >-
    The pyright diagnostics seen during development are all known noise
    classes, not defects: the unreachable marks in the claude_code modules
    are the standard TypeError-boundary static narrowing (raise
    TypeError(...) followed by code pyright cannot see past), the
    "task_id is not accessed" marks were mid-development interface-stub
    snapshots (the final head is clean under the authoritative gates:
    ruff with F401 selected, mypy, pytest, CI), and the "import ... could
    not be resolved" for task_bundle in adapter.py is the known scanner
    artifact of running pyright without an editable install. Two harmless
    notes, not findings: (1) a fresh spawn_worker / spawn_persistent_role
    of the exact same logical context after a termination re-registers the
    deterministic identity as ACTIVE (the durable outbox is preserved);
    this is defensible -- identity is a deterministic function of the
    logical context and the Core controls contexts -- but no test pins it
    either way; the M12 monitor work should be aware of it. (2)
    ClaudeSubprocessRunner.spawn_subagent and derive_spawn_id raise the
    documented ValueError for malformed input rather than
    PlatformAdapterDataError -- consistent within the module and
    unreachable from the adapter's validated paths. The worker also
    correctly reported that origin/main advanced by the .development/-only
    state commit eadbce46 and did not rebase; the merge guard
    (--match-head-commit) keeps the chain exact.

