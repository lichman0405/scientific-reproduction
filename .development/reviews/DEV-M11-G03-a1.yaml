design_review:
  rule_tables: >-
    ADSORPTION_PARAMETER_RULES R-ADS-P0..P10 is an ordered first-match-wins
    table with a trailing total default, proven total by
    validate_adsorption_rulesets; ADSORPTION_VALUE_RULES R-ADS-V1..V29 has
    exactly one rule per parameter (uniqueness asserted). Frozen rule
    dataclasses with RULESET_VERSION constants; every assessment records
    matched_rule_id and the full decision trace.
  template_surface: >-
    AdsorptionTemplateBase with a strict __post_init__ (TypeError at the
    boundary for wrong kinds/stages, value rules executed at construction,
    results table restricted to breakthrough kind); the six kind-fixed
    subclasses (BetTemplate, LangmuirTemplate, etc.) freeze the kind
    vocabulary; safe ids (FND-M9-G02-01-style) and deterministic
    capture_protocol with the sorted CAPTURE_KEYS.
  paradigm: >-
    Frozen dataclasses throughout, TypeError at public boundaries vs
    ValueError-subclass stable errors, injectable clock (no wall clock),
    no mocks / no parallel stores (all assertions exercise the REAL
    core/artifacts modules), byte-identical determinism for identical
    inputs, from __future__ import annotations, __all__ exports, purity
    proven by AST-scanned import roots and forbidden tokens.

