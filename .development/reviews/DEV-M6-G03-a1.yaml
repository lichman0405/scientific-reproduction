review_notes:
- >-
  Matrix grounding: Role worker members 1:1 verbatim from core.models.WorkerRole
  (role_from_worker_role); 11 decision actions 1:1 verbatim from
  core.models.DecisionType (action_for_decision_type); both mappings
  injectivity-tested. No invented vocabulary.
- >-
  Rule-table paradigm matches the established rule-engine style: frozen
  PermissionRule dataclasses, ordered table (R-PRM-SUP1 heads; per-role
  may-lists; trailing total default R-PRM-D1 denies everything ungranted --
  least privilege, SS3-SS8 'may not' lists are denials by default),
  first-match-wins, matched_rule_id post-asserted (never None) on the full
  7x46 product, ROLE_ACTION_RULESET_VERSION='1.0' stamped in every assessment,
  validate_permission_ruleset (unique ids / non-empty / total-default-last)
  with stable PermissionRulesetError messages.
- >-
  Guard purity proven by module-dict inspection test: core/permissions.py and
  workers/permissions.py import no os/sys/time/datetime/random/socket/pathlib/
  json/hashlib -- state enters only through injected arguments; guards are pure
  functions of (role, target). PermissionDeniedError (ValueError subclass)
  carries the full PermissionAssessment (exc.assessment); stable one-line
  messages pinned verbatim in tests; TypeError at every public boundary.
- >-
  Branch history: head e599a69 is a merge of the worker commit (52ab408) with
  origin/main (dfbfe63) -- origin/main advanced mid-work (DEV-M9-G04 landed);
  the worker fetched and merged instead of rebasing (rebase forbidden by
  policy). PR diff origin/main...HEAD = exactly the 4 new files (2028 insertions,
  0 deletions) -- no conflict residue; merge-base = dfbfe63 (clean ancestry);
  squash merge of PR #43 reproduces the identical merged tree that was fully
  gate-verified. Acceptable deviation, documented.
- >-
  Worker self-caught and fixed two test defects pre-commit: (a) frozen-table
  mutation test used object.__setattr__ which bypasses frozen dataclass
  __setattr__ and could corrupt the shared module table -- replaced with plain
  rule.rule_id assignment raising FrozenInstanceError without mutation; (b)
  AC-04 stable-message assertion aligned with the implemented label-verbatim
  message. Both fixes verified in final head.
