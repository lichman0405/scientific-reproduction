    notes: >-
      The Core never imports Claude-specific task APIs directly, enforced
      mechanically by AST import scans: adapters/platform/base.py imports
      only stdlib and scientific_reproduction packages (no third-party
      module at all, so no anthropic/claude-code SDK can reach the
      interface through an indirect dependency), and every module under
      core/ is scanned for the four Claude-specific import roots
      (anthropic / claude_code / claude / us.anthropic) and for any import
      of the adapters subsystem -- the platform surface is the
      PlatformAdapter interface and nothing else. The interface itself is
      abstract (instantiation raises TypeError; __abstractmethods__ is
      exactly {capabilities, spawn_persistent_role, spawn_worker,
      resume_session, terminate_session, is_session_alive,
      expose_command, fallback_subagent}) and the PlatformOperation
      StrEnum vocabulary of 15-ADAPTER-SPEC.md SS5 is mutually pinned to
      the abstract surface (every member is one capability and every
      method has a vocabulary member), so no capability exists without an
      interface answer.
  AC-02:
    status: PASS
    evidence:
    - test_ac02_handle_carries_exactly_the_identity_fields_project_state_needs
    - test_ac02_handle_round_trips_losslessly_through_state_serialization
    - test_ac02_handle_rehydrates_corrupt_stored_ref_self_correcting
    - test_ac02_session_ref_is_deterministic_and_fits_run_project_state
    - test_ac02_session_ref_distinguishes_distinct_worker_contexts
    - test_ac02_handle_is_a_frozen_validating_record
    - test_ac02_handle_from_dict_rejects_corrupt_state
    - test_ac02_handle_has_no_wall_clock_and_no_randomness_fields
    notes: >-
      WorkerSessionHandle is a frozen record carrying exactly the identity
      project state needs: session_ref (first in canonical dict order),
      platform_id, worker_id, role_id (validated against the frozen
      CONTRACT_ROLE_IDS vocabulary of DEV-M10-G01), project_id / goal_id /
      context_id (each validated as the correct sr_<kind>_<32 hex>
      shape, unset optionals omitted from the dict exactly as the state
      backend expects). session_ref is computed, never caller-supplied:
      a truthy caller-supplied value is rejected and the canonical
      reference is derived deterministically via generate_id("session",
      platform_id, worker_id, role_id, project_id, goal_id, context_id) --
      a pure function of the logical worker/role context, so the value a
      Run record stores in worker_session_ref is stable across restarts
      and Monitor replacement sessions (13-EXECUTION-MONITOR.md SS3-SS4).
      from_dict ignores any carried session_ref and recomputes it, so
      stale or corrupt persisted references self-correct on rehydration.
      Distinct logical contexts (different goals, different runs of one
      goal via context_id, persistent roles) derive distinct refs; the
      ref fits Run.worker_session_ref (verified against the real Run
      record); serialization round-trips losslessly (dict equality, JSON
      byte-identical, parses back to the same plain dict).
  AC-03:
    status: PASS
    evidence:
    - test_ac03_fallback_mode_is_a_typed_explicit_vocabulary
    - test_ac03_result_validation_enforces_the_explicit_answer_shapes
    - test_ac03_every_capability_has_a_defined_explicit_fallback_answer
    - test_ac03_callers_can_distinguish_real_results_from_fallback
    - test_ac03_fallback_subagent_is_the_explicit_documented_fallback_path
    - test_ac03_capability_answers_are_distinct_from_data_errors
    - test_ac03_results_are_frozen_and_round_trip_typed
    - test_ac03_results_carry_no_wall_clock_fields
    notes: >-
      Every platform operation returns a frozen result record carrying a
      typed FallbackMode member (NATIVE / FALLBACK / UNSUPPORTED), so a
      caller can always distinguish a real platform result from a
      fallback. The shared _check_fallback rule is enforced by every
      record's __post_init__: a NATIVE result never carries a
      fallback_reason, a FALLBACK/UNSUPPORTED answer always carries a
      non-empty reason, and an UNSUPPORTED answer never carries a
      fabricated handle (SpawnResult/ResumeResult) or a guessed alive
      value (AliveResult.alive must be None). The contract rule is pinned
      by test: an adapter declaring zero native capabilities must answer
      every interface capability with an explicit FALLBACK or UNSUPPORTED
      result -- never NATIVE, never a fake session (M10-G05 AC-03:
      "Unavailable live capability is reported as capability/fallback,
      not silently faked"). fallback_subagent (15-ADAPTER-SPEC.md SS5) is
      the explicit fallback path and always reports FALLBACK with a
      reason naming the channel. Capability answers are typed results and
      distinct from data/state errors: a session the adapter never
      created raises SessionNotFoundError (a ValueError subclass, stable
      message), while an unsupported capability returns the typed
      UNSUPPORTED answer; wrong input types raise TypeError at the public
      boundary. All five result records round-trip with their typed mode
      and carry no timestamp-like fields.

