design_review:
  interface_exactly_locked_surface: >-
    PlatformAdapter is a pure abstract contract (no concrete platform
    behavior may live here): its abstract methods are exactly the seven
    operations of 15-ADAPTER-SPEC.md SS5 (spawn_persistent_role,
    spawn_worker, resume_session, terminate_session, is_session_alive,
    expose_command, fallback_subagent) plus the capability query, the
    PlatformOperation StrEnum vocabulary is exactly the same seven
    members, and the test suite pins both the vocabulary -> surface and
    surface -> vocabulary directions, so no capability can exist without
    an interface answer. Each abstract method carries full Args/Returns/
    Raises documentation grounded in the frozen specs (Monitor resume /
    replacement semantics of 13-EXECUTION-MONITOR.md SS3-SS4, the role
    vocabulary of 03-ROLE-AND-PERMISSION-SPEC.md via DEV-M10-G01
    CONTRACT_ROLE_IDS, the platform-neutral command rule of SS5). Class
    identity is stable, versioned class constants (platform_id / version /
    description) that concrete adapters declare.
  neutrality_import_level: >-
    AC-01 is enforced at the import level with deterministic AST scans
    (no I/O beyond reading module sources): the interface module imports
    no Claude-specific root and no third-party module at all -- only
    stdlib and scientific_reproduction (verified against
    sys.stdlib_module_names), so no anthropic/claude-code SDK can reach
    the interface through an indirect first-party dependency; every
    module under core/ is scanned for the four Claude-specific import
    roots and for any import of the adapters subsystem -- the Core's only
    platform contact point is the interface itself. The module also
    imports no random/uuid/time/datetime, keeping the surface
    deterministic.
  durable_identity: >-
    WorkerSessionHandle is the AC-02 deliverable: a frozen record whose
    canonical session_ref is a pure deterministic function of the logical
    worker/role context (generate_id("session", platform_id, worker_id,
    role_id, project_id, goal_id, context_id)), computed once via
    object.__setattr__ with caller-supplied values rejected. The
    identity fields are validated in __post_init__ (platform_id
    ^[a-z][a-z0-9_]*$, worker_id ^[a-z][a-z0-9_-]*$ allowing
    platform-generated names like teammate-3, role_id in the frozen
    contract vocabulary, project/goal/context ids in the correct
    sr_<kind>_<32 hex> shapes) so corrupt rehydrated state fails as a
    stable PlatformAdapterDataError, never a silent guess -- while a
    stale carried session_ref is ignored and recomputed, making
    rehydration self-correcting. The ref is verified to fit the real Run
    record's worker_session_ref field and the serialization round-trips
    losslessly through the state backend / event log (dict equality, JSON
    byte-identical, parses back to the same plain dict).
  explicit_fallback: >-
    AC-03 is a typed, record-level contract: every operation result
    carries exactly one FallbackMode member, and the shared _check_fallback
    rule is enforced in each record's __post_init__ (NATIVE without a
    reason; FALLBACK/UNSUPPORTED always with a non-empty reason; UNSUPPORTED
    never with a handle or a guessed alive value). PlatformCapability
    declares which operations an adapter supports natively, and the test
    suite pins the rule mechanically: an adapter with zero native
    capabilities must answer each of the six operations with an explicit
    FALLBACK/UNSUPPORTED result carrying a reason (enumerated per
    operation, including result-payload assertions for the UNSUPPORTED
    shape), never NATIVE, never a fabricated session -- matching the
    M10-G05 AC-03 rule referenced in the module docstring.
    fallback_subagent is the documented explicit fallback path and always
    reports FALLBACK with a reason naming the channel. Capability answers
    are distinct from data errors: SessionNotFoundError (a
    ValueError-subclassed stable error) is raised for sessions the
    platform never created, while an unsupported capability returns the
    typed UNSUPPORTED answer; wrong input types raise TypeError at the
    public boundary.
  house_style: >-
    The module follows the house style exactly: frozen dataclass records
    (WorkerSessionHandle, CommandSpec, PlatformCapability, and the five
    operation result records), StrEnum vocabularies (FallbackMode,
    PlatformOperation), TypeError at the public boundaries, stable
    ValueError-subclassed errors (PlatformAdapterError ->
    PlatformAdapterDataError / SessionNotFoundError) with one-line
    messages, deterministic ids via core.ids.generate_id, canonical
    sorted JSON serialization (json.dumps sort_keys=True, ensure_ascii=
    False, indent=2) with lossless from_dict round-trip and corrupt-state
    wrapping into the stable error, and no wall clock, no randomness, no
    I/O anywhere in the module (asserted by tests).
  observations: >-
    The pyright diagnostics reported alongside the worker completion are
    all known noise classes, not defects: "type[str] is not iterable" at
    test_base_fallback.py line 233 is StrEnum class iteration (the
    runtime behavior is correct and pinned by the passing tests); the
    NATIVE attribute resolution complaint at line 238 is the same
    StrEnum-member class; the DataclassInstance to_dict/to_json
    complaints at lines 394-401 come from pyright narrowing the record to
    DataclassInstance after the dataclasses.is_dataclass assertion (the
    same pattern as the FrozenInstanceError noise in the DEV-M10-G01
    hygiene tests). The authoritative gates are all clean on the final
    head: ruff (F401 selected), mypy, pytest, CI. One harmless note, not
    a finding: test_base_session_handle.py line 129 asserts
    handle.to_dict() == handle.to_dict() (a tautology); the meaningful
    assertion is the next line (restored == handle after rehydration) --
    same class of redundancy noted in the DEV-M8-G06 scenario tests,
    which the tree_bytes coverage there made harmless as well.

