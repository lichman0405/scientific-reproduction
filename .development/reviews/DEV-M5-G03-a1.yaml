    against current main; PR head equals the reviewed head. origin/main
    moved during work only by the batch's own dispatch commit (2417647,
    .development-only) — no in-scope path touched.
  - >-
    Design reviewed: EvidenceRegistry is an immutable frozen dataclass
    over an ordered tuple — register returns a new registry, making
    non-clobbering an invariant of the type rather than a policy (AC-02
    by construction). Unassessed state is absence (None), not an invented
    UNDETERMINED — the frozen vocabulary has no such evidence state, so
    none was invented (consistent with the M2 rule modules' stance);
    referential integrity against claim/goal registries intentionally
    deferred at this milestone with the rationale documented in the
    module docstring (no such registries exist in scope yet; M4-G02/M5-G02
    build them). Checklist-reference requirement (reliability_checklist_ref
    non-empty) pre-validates the M5 handoff rule "Reliability cannot be
    written without checklist result reference" at the data layer.
    Paradigm: TypeError at public boundaries, ValueError-subclass errors
    with stable messages, frozen dataclasses, pure deterministic lookups
    (first-seen order), __all__ exports, docstrings citing 06-EVIDENCE-
    SYSTEM.md SS1/SS2/SS6 and 09-RESEARCH-SUBSYSTEM.md SS5. The
    documented premise deviation (0-4 int axes vs assumed StrEnums) is an
    honest, correct resolution — the frozen schema is authoritative.
