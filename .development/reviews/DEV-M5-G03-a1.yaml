criteria:
  - criterion_id: AC-01
    result: PASS
    evidence: >-
      A source cannot have a single global reliability field standing in
      for all claims — claim-scoped by construction, proven at three
      levels: (1) structural — the frozen ResearchSource model carries no
      reliability/directness field and the registry adds none
      (test_ac01_frozen_source_model_has_no_global_reliability_field);
      (2) API — every assessment-returning method requires a (source,
      claim) pair with claim_id having no default, so a single-argument
      call raises TypeError (test_ac01_every_assessment_lookup_requires_a_
      claim_argument, test_ac01_registry_offers_no_source_alone_
      assessment_api); (3) behavioral — reliability is answered only for
      a claim (test_ac01_reliability_is_answered_only_for_a_claim).
      Independent rerun at head c17f0d64: tests/research -k evidence 29
      passed, exit 0.
  - criterion_id: AC-02
    result: PASS
    evidence: >-
      Same source carries different Directness/Reliability assessments
      for different claims: test_ac02_same_source_different_claims_carry_
      independent_assessments (different Reliability AND Directness, both
      retrievable), test_ac02_registering_never_clobbers_an_earlier_
      assessment (register is functional — returns a new immutable
      registry, clobbering impossible by construction),
      test_ac02_same_claim_different_sources_carry_independent_
      assessments, test_ac02_multiple_records_for_one_pair_are_additive
      (first-registered wins the deterministic lookup; get_all returns
      all), test_ac02_assessments_are_typed_against_the_frozen_vocabulary.
      The A/R/D axes are the frozen 0-4 integers of EvidenceAssessment
      (schemas/evidence.schema.yaml integer [0,4] bounds; the task brief's
      StrEnum assumption had no frozen basis — the worker documented this
      premise deviation and typed the axes against the frozen integers
      with out-of-range rejection at registration: test_registry_rejects_
      out_of_range_axes / test_registry_accepts_rubric_boundary_axes).
  - criterion_id: AC-03
    result: PASS
    evidence: >-
      Used-by links stored: test_ac03_used_by_links_are_stored_and_
      retrievable, test_ac03_used_by_links_survive_serialization_round_
      trip (to_dict/from_dict never drop refs), test_ac03_used_by_links_
      are_per_claim_and_independent, test_ac03_all_used_by_aggregates_
      every_link_in_first_seen_order, test_ac03_empty_used_by_defaults_
      to_empty_tuple. The frozen model has one generic used_by ref list
      (06-EVIDENCE-SYSTEM.md SS6 "Goals/decisions using the evidence");
      refs are opaque strings stored/returned verbatim. Registry is the
      data layer for the DEV-M2-G03 evidence rules: iterable, so
      count_independent_qualifying_sources(registry) works unchanged
      (test_registry_is_the_data_layer_for_the_evidence_rules).
      Verification rerun at head: full suite 1060 passed / 6 skipped / 1
      deselected (base 1031 + 29 new), ruff + mypy clean on 45 source
      files, contracts validator PASS.
