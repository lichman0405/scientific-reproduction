    status: PASS
    evidence:
    - test_ac01_trigger_repeated_scan_spawns_single_followup
    - test_ac01_trigger_later_result_states_also_trigger_exactly_once
    - test_ac01_trigger_scan_ignores_every_non_result_run
    notes: >-
      Unchanged from the a1 review: exactly-once is the durable record --
      scan() resolves the existing record from disk before anything, the
      first scan of a result-bearing Run invokes the injected hook exactly
      once (counting proof) and persists the deterministic record, repeated
      scans replay the single original record with byte-identical state;
      every result-bearing state triggers exactly once; every non-result
      Run is observed and ignored (zero hook calls, zero files). All
      AC-01 tests still pass on the fix head (24 in the -k trigger gate
      including the new corrupt-path test).
  AC-02:
    status: PASS
    evidence:
    - test_ac02_trigger_fresh_registry_reconstructs_trigger_set_after_restart
    - test_ac02_trigger_restart_rescan_never_duplicates_existing_followup
    - test_ac02_trigger_record_is_auditable_from_durable_state_alone
    notes: >-
      Unchanged from the a1 review: a fresh registry reconstructs the
      trigger set from the persisted records alone; restart re-scans
      replay with zero fresh-hook calls and byte-identical state; the
      record is auditable from raw JSON (deterministic id, run id, kind
      vocabulary, injected-clock stamp, receipt). All AC-02 tests still
      pass on the fix head.
  FND-M8-G05-01:
    status: PASS
    evidence:
    - >-
      _existing_record (triggers.py, now lines 731-742) raises
      CorruptTriggerStateError("trigger record at <path> is not a regular
      file") when the record path exists but is not a regular file,
      mirroring get()/_read_record exactly (same stable wording), with the
      new Raises clause in the docstring.
    - >-
      test_triggers_non_regular_record_path_fails_loudly: a directory at
      <state_dir>/trigger/<run_id>.json makes scan() AND trigger() raise
      CorruptTriggerStateError (message matched against "not a regular
      file"); the follow-up hook is never invoked (hook.calls == []) and
      nothing is persisted (tree_bytes(state) == []).
    notes: >-
      Fix verified in full: the fix commit ed2dc18 touches exactly the two
      in-scope files (+34/-1): the 11-line _existing_record guard +
      docstring and the 23-line new test. The module-wide contract
      ("corrupt state fails loudly, never silently -- it is never
      overwritten") now holds across all four entry points
      (scan/trigger/get/list_triggered), and the corrupt path is proven
      never overwritten and never followed up. No other behavior changed.

