design_review:
  ac01_sections_typed_and_decision_free: >-
    The three sections are their own frozen classes (not free-form dicts)
    with per-class __post_init__ validation; section entries must be
    instances of the section class on direct construction (TypeError
    otherwise -- even a schema-shaped dict is rejected on direct
    construction), while the from_dict mapping path coerces dicts through
    the typed from_dict constructors. The decision-avoidance is enforced
    structurally: field-set disjointness, type rejection of SupervisorDecision
    in every section/ref list, and the schema-level impossibility test
    (the package can never validate as a decision document).
  ac02_never_declares_outcome: >-
    Four enforcement layers: field-name scan (no outcome/verdict), no
    verdict enum (plain-string refs only), import discipline (no
    requirement outcome/closure layers), and the byte-level closure test
    (a real registered OPEN requirement stays byte-untouched after a
    referencing result registers -- the module reads no requirement state
    at all, so closure is impossible here, not merely unpracticed).
  ac03_exact_reference_resolution: >-
    Resolution is exact at registration time against the real manifests
    registry; the manifest is the auditable record of exactly which
    references were linked, deterministic (sorted, canonical JSON, real
    SHA-256 hash). The FND-M9-G02-01 lesson is applied at both levels:
    safe-id validation at the record boundary (all paths through the
    frozen constructor: direct, replace, from_dict) AND re-checked at the
    resolution gate before any registry path is constructed (proven via
    an object.__new__ bypass that the constructor cannot be trusted as
    the only defense).
  design_observation_input_artifacts_required: >-
    input_artifact_ids is required non-empty (a result package must name
    at least one input artifact; output_artifact_ids may be empty). The
    frozen contract does not mandate either shape; this is a deliberate
    strictness consistent with the doc-grounded model (a result answers a
    context that consumed registered artifacts; 10-EXPERIMENT-SUBSYSTEM.md
    SS4 requires operators to report actual quantities and artifacts).
    Not a contract violation; AC-03 is satisfied. Recorded for downstream
    goals (M6-G03/G04/G05) that consume this module.
  rule_table_and_determinism: >-
    Exactly-once registration with immutable records mirrors the M9
    registries; no randomness/wall-clock/network anywhere (source-scanned
    in the purity test); completed_at is caller-injected. The registry
    isolation test proves the worker results registry and the M9-G02
    analysis results registry are distinct, deterministic namespaces.
  scope_discipline: >-
    Exactly the two allowed files (+2506/-0: results.py 1295 lines,
    test_results_worker.py 1213 lines). The test file is named
    test_results_worker.py rather than test_results.py -- inside the
    frozen glob tests/workers/test_results*; the rename is justified and
    documented in the file docstring: pytest's default import mode would
    collide test_results.py with tests/analysis/test_results.py
    (duplicate basename -> import-file-mismatch). No existing test
    touched, no forbidden change, branch parent = 2178705d (verified via
    git log: 441278d -> 2178705d -> 8a4f794; the worker rebased onto
    post-G03 main and the claimed base is the true branch parent -- no
    stale-base deviation).

