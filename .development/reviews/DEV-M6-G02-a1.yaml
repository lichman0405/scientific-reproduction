acceptance_criteria:
  AC-01:
    status: PASS
    evidence:
    - test_result_ac01_package_has_distinct_typed_sections
    - test_result_ac01_facts_carry_measurements_and_values
    - test_result_ac01_data_carry_structured_outputs
    - test_result_ac01_deviations_state_what_was_done_differently_or_not
    - test_result_ac01_package_carries_no_supervisor_decision_semantics
    - test_result_ac01_package_cannot_validate_as_a_decision
    - test_result_ac01_registration_is_pure_with_injectable_timestamp
    notes: >-
      The package has distinct, typed, frozen sections: WorkerFact
      (fact_id/name/scalar value/unit/requirement_refs), WorkerData
      (data_id/name/format/summary) and WorkerDeviation (deviation_id/kind
      in the DeviationType factual vocabulary protocol_deviation/failure/
      interruption/description/requirement_refs). No confusion with
      Supervisor decisions is structurally possible: the field-set
      disjointness test enumerates all ten SupervisorDecision fields
      (decision_id/decision_type/actor/timestamp/affected_refs/rationale/
      evidence_refs/analysis_refs/previous_version_refs/resulting_version_refs)
      and proves none exists on any package record; a SupervisorDecision
      instance is rejected as any section entry or ref-list entry
      (TypeError); the package JSON fails the frozen decision schema
      (validate_and_reject("decision", ...) raises SchemaValidationError);
      decision_refs is the package's only contact with decisions -- opaque
      string linkage, never decision semantics (raw JSON contains "DEC-1"
      but never "decision_type"/"rationale"). Purity: completed_at is an
      injectable string (two identical registrations on different roots
      produce byte-identical files); a source scan proves no random/time/
      datetime/socket/urllib anywhere in the module.
  AC-02:
    status: PASS
    evidence:
    - test_result_ac02_no_outcome_field_anywhere
    - test_result_ac02_fact_may_reference_requirement_but_never_declare_outcome
    - test_result_ac02_deviation_may_reference_requirement_but_never_declare_outcome
    - test_result_ac02_package_cannot_validate_as_a_requirement
    - test_result_ac02_module_never_imports_requirement_layers
    - test_result_ac02_requirement_linkage_is_never_resolved_or_closed
    notes: >-
      No record carries an outcome/verdict field (field-name scan over all
      four record types); the module defines no verdict enum for
      requirement refs (non-string ref entries are TypeError). Facts and
      deviations may reference Requirements by id (requirement_refs, pure
      linkage surfaced in the manifest as REQUIREMENT references) but
      never declare their outcome; the package JSON fails the frozen
      requirement schema (requires outcome + inventory/goal edges --
      SchemaValidationError). Module imports verified: only
      artifacts.exceptions, artifacts.registry, core.atomic, core.ids,
      core.models (WorkerRole), planning.init -- no core.rules, no
      planning.inventory, no RequirementOutcome token, no
      register_requirement. End-to-end closure absence: registering a
      result whose fact references a REAL registered requirement
      (REQ-1, OPEN) leaves the requirement file byte-untouched and OPEN;
      an unregistered requirement id is never resolved (registers
      normally) -- the module reads no requirement state at all.
  AC-03:
    status: PASS
    evidence:
    - test_result_ac03_input_artifact_refs_resolve_against_real_registry
    - test_result_ac03_output_artifact_refs_resolve_against_real_registry
    - test_result_ac03_unregistered_input_artifact_ref_rejected
    - test_result_ac03_unregistered_output_artifact_ref_rejected
    - test_result_ac03_manifest_records_exactly_the_linked_references
    - test_result_ac03_unsafe_artifact_ids_rejected_at_record_boundary
    - test_result_ac03_traversal_artifact_id_cannot_escape_manifests
    - test_result_ac03_defense_in_depth_unsafe_id_rejected_at_resolution_gate
    notes: >-
      Every input/output artifact reference resolves against the REAL
      DEV-M3-G02 ArtifactRegistry (manifests/): register_worker_result
      calls registry.get() for each id; an unregistered ref raises
      UnresolvedWorkerResultReferenceError with a stable message naming
      result id and artifact id, and nothing is written (no file, empty
      listing). The ResultManifest records exactly the linked references
      sorted by (kind, ref_id): context + run + artifact_input +
      artifact_output + requirement (sorted union across facts and
      deviations) + decision -- proven by the exact-tuple test; manifest
      is deterministic and hashable (result_hash is a real SHA-256 of the
      canonical JSON). FND-M9-G02-01 regression present and proven at two
      levels: (1) record boundary -- every artifact id must be a safe
      registry id (no /, no \, not . or .., no glob metacharacters), and
      the traversal test proves ../EVIL is rejected with the stable
      WorkerResultRecordError while the crafted EVIL.json at the
      workspace root is never read and the registry listing is unchanged;
      (2) resolution gate defense-in-depth -- a package constructed via
      object.__new__ bypassing __post_init__ still has every id
      re-checked in _resolve_artifact_refs before any ArtifactRegistry.get
      (UnresolvedWorkerResultReferenceError, nothing written).
  paradigm:
    status: PASS
    evidence:
    - test_result_registry_canonical_json_and_roundtrip
    - test_result_mapping_input_coerced_with_defaults
    - test_result_mapping_invalid_enum_value_rejected
    - test_result_deterministic_listing_sorted_by_id
    - test_result_deterministic_same_state_same_bytes
    - test_result_read_roundtrip_and_not_found
    - test_result_duplicate_registration_rejected_bytes_untouched
    - test_result_type_error_boundaries
    - test_result_record_shape_validation_rejects_bad_values
    - test_result_error_hierarchy_and_stable_messages
    - test_result_requires_initialized_project
    - test_result_rejects_unsafe_ids_at_every_boundary
    - test_result_corrupt_registry_records_rejected
    - test_result_frozen_records_reject_mutation
    - test_result_manifest_is_deterministic_sorted_and_hashable
    - test_result_worker_results_registry_is_isolated
    - test_result_registration_answers_a_real_generated_context
    notes: >-
      Every established paradigm rule is followed: canonical JSON
      (sorted keys, 2-space indent, trailing newline) with byte-equal
      roundtrip; exactly-once registration (DuplicateWorkerResultError
      with stable message, original bytes untouched, stable across
      different content); deterministic listing sorted by result_id and
      same-state-same-bytes across independent roots; frozen records
      reject mutation including nested sections; corrupt records (bad
      JSON, non-object, missing field, result_id/file-name mismatch) all
      raise the stable "corrupt worker result record" ValueError; the
      error hierarchy is WorkerResultError(ValueError) -> RecordError /
      Duplicate / InvalidId / NotFound / UnresolvedReference, all
      ValueError subclasses with stable one-line messages; TypeError at
      every public boundary (root type, result type, record field types,
      from_dict non-mapping); safe-id validation at every boundary
      (register/read/list; InvalidWorkerResultIdError); context_id must
      be a well-formed generated context id (sr_context_<32hex>; a goal
      kind id is rejected) and goal_version must be formal v<N>; the
      worker results registry is isolated from the M9-G02 analysis
      results registry. End-to-end: test_result_registration_answers_a_
      real_generated_context registers a package whose context_id comes
      from the REAL M6-G01 generate_goal_context and proves the package
      names the exact context (goal_id/goal_version echo the frozen
      goal; the manifest CONTEXT reference is the generated id).

