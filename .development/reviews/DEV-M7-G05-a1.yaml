design_review:
  integration_fixtures: >-
    The file is a true end-to-end fixture suite across the real state
    machinery: every artifact/ids/checksum/schema assertion exercises the
    REAL ArtifactRegistry, compute_sha256, generate_id/is_valid_id, Run
    model and validate_object -- no mocks at the core layer. The
    "outlives the worker" semantics are exactly the AC wording: the
    first adapter instance writes the durable state, a fresh instance
    over the same state directory finishes the flow, and the fresh
    instance's transport log proves it derived everything (external id,
    terminal decisions) from the record alone.
  determinism: >-
    FakeClock (fixed FIXED_STAMP), RecordingBackoff (zero delay),
    FakeSlurmTransport (scripted, strict: exhausted script and
    disconnected-operation raise) mirror the DEV-M7-G04 unit suite; the
    lab handoff uses the real filesystem under tmp_path. No network, no
    sleeps, no wall clock, no randomness, no polling.
  api_integrity: >-
    The lab surface exercised (FilesystemLabAdapter.dispatch/status/
    collect, DispatchState.RUNNING_EXTERNAL/RESULT_AVAILABLE,
    DispatchStatus, DuplicateDispatchError, DISPATCH_RECORD_FILENAME,
    RESULT_MANIFEST_VERSION) is verified against adapters/lab/base.py +
    filesystem.py; RunExternal carries backend/job_id/dispatch_id/
    working_directory in core/models.py -- every integration point is
    real and exists on main.

