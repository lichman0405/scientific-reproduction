acceptance_criteria:
  AC-01:
    status: PASS
    evidence:
    - test_m7g05_ac01_lab_fresh_instance_detects_and_collects_returned_package
    - test_m7g05_ac01_lab_fresh_instance_collects_only_its_own_run
    - test_m7g05_ac01_lab_dispatch_is_exactly_once_across_instances
    notes: >-
      Lab dispatch outlives the original worker: worker instance 1
      dispatches the experiment package (real filesystem handoff under
      tmp_path: outgoing/<run_id>/ dispatch record + package files), then
      a FRESH FilesystemLabAdapter instance over the same handoff root
      answers status from the persisted dispatch record alone
      (RUNNING_EXTERNAL), detects the returned Result Package
      (RESULT_AVAILABLE) and collects it, associating it with the
      correct Run via the dispatch id / run_id / manifest package_id --
      never guessed, never cross-matched (two-run test). Dispatches are
      exactly-once even across instances: re-dispatching the same package
      raises DuplicateDispatchError loudly and the original handoff file
      is byte-unchanged.
  AC-02:
    status: PASS
    evidence:
    - test_m7g05_ac02_slurm_fresh_instance_reconciles_status_resume_collect
    - test_m7g05_ac02_slurm_terminal_record_answered_without_remote_contact
    notes: >-
      Slurm-style job outlives the original worker: worker instance 1
      submits through its own scripted transport/session, then a fresh
      SlurmComputeAdapter instance (its own transport, its own session)
      over the same state directory reconciles the job from the durable
      record alone -- the fresh probe derives squeue --jobs from the
      record's external id (asserted via the transport call log), resume
      re-attaches, the terminal decision is persisted once and later
      answered from the record alone with zero remote contact
      (transport.log == [] for both status and resume on a terminal
      record). Collect registers outputs through the real ArtifactRegistry
      with deterministic artifact ids and real SHA-256.
  AC-03:
    status: PASS
    evidence:
    - test_m7g05_ac03_same_run_references_both_external_ids_deterministically
    - test_m7g05_ac03_collected_artifact_ids_deterministic_and_persisted
    - test_m7g05_ac03_full_cycle_state_carries_ids_and_never_credentials
    notes: >-
      Run state references external ids deterministically: the lab
      dispatch id (generate_id("dispatch", package_id, run_id)) and the
      Slurm job id (generate_id("job", run_id)) are pure functions of the
      run identity -- recomputed from the same inputs they are identical,
      is_valid_id passes, they appear in the persisted dispatch/job
      records, and a schema-valid Run (RunExternal backend/dispatch_id/
      job_id) round-trips through the real model machinery with
      validate_object("run", data) == []. Collected artifact ids are
      deterministic (generate_id("artifact", job_id, output_name)),
      persisted in the job record and manifest, with the real checksum.
      Credential discipline: distinctive injected secret values are
      scanned out of every state file, both transports' call logs and the
      pushed batch script -- the ids live in the state, credentials
      nowhere.

