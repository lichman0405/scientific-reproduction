acceptance_criteria:
  AC-01:
    status: PASS
    evidence:
    - test_hook_ac01_passing_verification_allows_task_completion
    - test_hook_ac01_failing_verification_blocks_task_completion
    - test_hook_ac01_first_failing_verification_names_the_feedback
    - test_hook_ac01_gate_is_a_pure_function_of_durable_context
    - test_hook_ac01_teammate_idle_event_is_gated_the_same
    - test_hook_ac01_empty_verification_list_passes_vacuously
    - test_hook_ac01_unavailable_verifier_blocks_never_passes
    - test_hook_ac01_mismatched_event_identity_is_corrupt_payload
    - test_hook_ac01_unknown_session_is_a_data_error
    - test_hook_gate_records_are_frozen_typed_and_validated
    - test_hook_gate_records_round_trip_losslessly
    notes: >-
      evaluate_gate is a pure function of the durable task context
      (VerificationSpec: session_ref + goal_id + the frozen goal
      contract's verification commands as data) through the injectable
      Verifier boundary: every command is checked in order, all pass =>
      the mechanical GateVerdict.PASS (completion signal allowed),
      any fail => BLOCK with the failing verification recorded on the
      GateRecord and the first failing command (in command order,
      deterministic) naming the single FeedbackRecord. The
      UnavailableVerifier (the real thin wrapper) refuses every check
      with the typed VERIFIER_UNAVAILABLE_REPORT, so a verification
      that cannot be executed never passes -- the gate blocks, no
      fabricated completion. Both hook events (TaskCompleted and
      TeammateIdle) run the same gate, pinned equal. The gate is
      deterministic: no wall clock, no randomness, no I/O; the
      repeatability test runs the same inputs twice and asserts
      identical records and identical check sequences. Event/spec
      identity mismatch is a corrupt-payload data error; an unknown
      session is SessionNotFoundError (the DEV-M10-G02 discipline).
      An empty verification list passes vacuously -- documented and
      deliberate: the gate is mechanical and invents no requirement;
      the frozen goal contract governs what must be verified.
  AC-02:
    status: PASS
    evidence:
    - test_hook_ac02_feedback_record_is_actionable_and_typed
    - test_hook_ac02_blocked_gate_delivers_feedback_to_the_durable_outbox
    - test_hook_ac02_failure_never_fabricates_a_completion
    - test_hook_ac02_feedback_delivery_appends_to_the_outbox
    - test_hook_ac02_passing_gate_delivers_no_feedback
    notes: >-
      A failing gate produces exactly one typed, frozen FeedbackRecord
      carrying the actionable pieces -- failed_command, verifier_report,
      required_fix (the stable "re-run the goal verification and fix
      the failing verification before reporting task completion"
      directive) -- plus a deterministic computed feedback_id
      (generate_id("gate_feedback", session_ref, failed_command); a
      caller-supplied value is rejected and a stale serialized value
      self-corrects on from_dict, the house rule) and a canonical
      rendered durable-outbox directive naming the session, the failing
      verification, the verifier report and the required fix. The
      wiring (handle_hook_event) delivers that directive into the
      durable session outbox -- a pending command of the M10-G03
      SessionRegistry semantics, preserved for the replacement session
      (13-EXECUTION-MONITOR.md SS4) -- and NEVER marks the task
      complete: the failure test pins that the session record's state
      stays ACTIVE, the handle is unchanged, and the only durable
      difference is the appended outbox directive; the lifecycle has no
      completion state the hook could use. Repeated blocked gates
      append to the outbox in order; a passing gate delivers nothing.
  AC-03:
    status: PASS
    evidence:
    - test_hook_ac03_gate_verdict_is_mechanical_not_scientific
    - test_hook_ac03_no_acceptance_surface_in_the_hook_layer
    notes: >-
      The hook layer's verdict vocabulary is only the mechanical
      pass/block gate on the task-completion signal, and the absence of
      any acceptance surface is pinned structurally: GateRecord's fields
      are asserted exactly {session_ref, goal_id, verdict, outcomes,
      feedback} (no accepted/acceptance/outcome/goal_outcome/
      goal_review/verdict_authority field), HookAction's fields exactly
      {decision, gate}, and an export scan over the whole hooks package
      __all__ forbids any name containing accept/acceptance/
      goal_review/goal_outcome/verdict_authority. The returned
      HookAction is a typed recommendation the caller (the lead runtime
      owning the Supervisor review) acts on -- the hooks produce
      feedback and a mechanical recommendation; the Supervisor alone
      accepts (03-ROLE-AND-PERMISSION-SPEC.md SS4/SS5/SS7, the frozen
      VerdictAuthority vocabulary).

