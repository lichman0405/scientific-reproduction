design_review:
  gate_design: >-
    The quality gate is a pure descriptor layer over the durable task
    context: the verification commands are plain data (the verification:
    list of a DEV-GOAL YAML, passed in VerificationSpec), the Verifier
    ABC is the hermetically mockable execution boundary (scripted
    in-suite fakes; the real thin wrapper UnavailableVerifier refuses
    every check so an unexecuted verification never passes), and
    evaluate_gate is a pure function with no wall clock, no randomness
    and no I/O. The GateRecord invariant (PASS never carries feedback,
    BLOCK always carries it) is enforced in __post_init__. The wiring
    template (hook_events.handle_hook_event) is the boundary the real
    Claude Code TaskCompleted/TeammateIdle hook invocation would call:
    it validates the event's durable identity against the spec
    (mismatch is corrupt payload), resolves the durable registry
    (SessionNotFoundError on unknown sessions), runs the gate, and on
    BLOCK appends the feedback directive to the durable outbox -- never
    a completion. The real event delivery is deliberately not exercised:
    the deterministic suite drives the handler directly, exactly like
    the M10-G03 adapter boundaries.
  feedback_mechanism: >-
    AC-02 is delivered through the M10-G03 SessionRegistry outbox
    semantics without modifying the registry: handle_hook_event composes
    add_pending_command (a public registry method), so the pending
    directive survives into the replacement session (SS4
    reconstruction) and the failure test pins the session record
    unchanged except for the outbox append -- no completion state
    exists in the lifecycle for the hook to reach. The FeedbackRecord's
    computed fields follow the house self-correction rule (caller-
    supplied feedback_id/directive rejected at construction; stale
    serialized values ignored and recomputed on from_dict -- the
    WorkerSessionHandle.session_ref pattern from DEV-M10-G02).
  authority_containment: >-
    AC-03 is enforced structurally, not just by convention: the field-
    level assertions (dataclasses.fields) pin the exact GateRecord and
    HookAction shapes with no acceptance/outcome field, the verdict
    vocabulary is the two-member mechanical GateVerdict/HookDecision,
    and the export scan proves no hooks package export suggests an
    acceptance surface. The hook layer's only authority is to gate the
    mechanical task-completion signal and deliver feedback; the
    Supervisor's acceptance authority is untouched.
  config_generator: >-
    The configuration generator/documentation deliverable is complete:
    HookConfig is a frozen validated record (platform_id / version /
    command / events, round-tripping losslessly), build_hook_config
    takes the adapter capability context (refusing a foreign platform
    capability with a stable data error; version from the capability or
    the frozen adapter constants), and render_hook_config /
    to_settings_json produce the canonical installable JSON hooks
    fragment (indent=2, sort_keys, fixed event order; byte-identical
    for equal inputs -- pinned). The module docstring documents the
    Claude Code hook mechanism mapping honestly (settings.json hooks
    map keyed by event name; event JSON on stdin, decision JSON on
    stdout; a block decision prevents the event) and states that the
    real event delivery is not exercised; the named hook script
    (entry.main, stdin/stdout) exists behind the boundary, with the
    pure decide_from_payload seam (event + spec + durable registry
    snapshot => canonical decision dict) pinned by tests -- including
    that without an executing verifier the payload blocks, never
    fabricating a pass.
  house_style: >-
    The hooks package follows the house style exactly: frozen
    dataclass records with validating __post_init__ (VerificationOutcome,
    FeedbackRecord, GateRecord, VerificationSpec, HookEvent, HookAction,
    HookConfig), StrEnum vocabulary (GateVerdict, HookDecision,
    HookEventType), TypeError at the public boundaries, stable
    PlatformAdapterDataError for corrupt data with canonical
    serialization and lossless round-trip, deterministic ids via
    core.ids.generate_id (gate_feedback kind), module-level imports
    stdlib + scientific_reproduction only, and no wall clock, no
    randomness, no I/O anywhere -- the existing claude_code hygiene
    scans cover the new modules.
  observations: >-
    Three notes, none of them findings: (1) an empty verification list
    passes vacuously -- documented and deliberate ("the gate is
    mechanical and invents no requirement"; the frozen goal contract
    governs what must be verified), and the worker flagged it as a
    review note; defensible for the v0.1 gate-template deliverable. (2)
    handle_hook_event's default registry is a fresh empty SessionRegistry,
    so the default path raises SessionNotFoundError for any event --
    the durable context is effectively mandatory (the wiring resolves
    the session record before delivering feedback); this is the honest
    broken-reference discipline and pinned by tests. (3) The rendered
    settings.json shape (hooks map keyed by event name, each entry a
    command-type hook list) is documented as the assumed deployment
    format and not exercised against the real Claude Code mechanism --
    the honest boundary contract of the template deliverable. The
    pyright marks seen during development are all known noise classes
    (TypeError-boundary unreachable narrowing; "import could not be
    resolved" scanner artifacts from running pyright without an
    editable install) -- ruff and mypy (the authoritative gates) are
    clean.

