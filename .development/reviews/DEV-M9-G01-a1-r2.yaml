design_review:
  fix_boundary: >-
    The fix stays strictly inside the module's own validation function --
    no schema changes, no storage-format changes, no frozen AC
    reinterpretation. Rejection happens at the boundary before any glob
    expansion or write, which is the same pre-write position the original
    id validation already used; the change strengthens the predicate
    rather than adding flow paths.
  no_scope_creep: >-
    Diff is exactly 2 files: src/scientific_reproduction/analysis/
    protocols.py (+28/-7) and tests/analysis/test_protocols.py (+41).
    plan.py untouched (verified: its globs are fixed "*.json" patterns,
    no id interpolation, so the weak predicate there is harmless and out
    of scope per the fix brief).
  platform_consistency: >-
    The Windows raw-OSError leak (secondary defect in FND-M9-G01-01) is
    closed by construction: metacharacter ids never reach the filesystem
    now, so no platform-dependent failure mode remains; the error is the
    stable InvalidProtocolIdError everywhere.

