acceptance_criteria:
  AC-01:
    status: PASS
    evidence:
    - test_ac01_external_completion_moves_run_to_result_available_exactly_once
    - test_ac01_completion_after_crash_window_emits_single_event
    - test_ac01_already_recorded_completion_is_a_pure_noop
    notes: >-
      External completion moves the Run to RESULT_AVAILABLE exactly
      once. ReconcileEngine.reconcile: when the injected probe reports
      the completion signal (COMPLETION_SIGNALS ==
      {"RESULT_AVAILABLE"}) for a RUNNING_EXTERNAL run, the run is
      transitioned through the REAL core.transitions.transition
      machinery and persisted via the REAL schema-validating
      FilesystemStateBackend (test asserts the persisted lifecycle
      state is RESULT_AVAILABLE and the run file bytes changed), ONE
      external_status_change event (actor execution-monitor, from
      RUNNING_EXTERNAL, to RESULT_AVAILABLE, stable reason, sequence
      == 1) is appended through the REAL ProjectEventLog under the
      deterministic idempotency key reconcile.completed:<run_id>, and
      the checkpoint records the completion durably. Exactly-once holds
      across the failure matrix: (a) steady-state re-poll -- run
      record + event + checkpoint all recorded -- is a pure no-op
      (event log untouched, tree bytes and sequence identical); (b)
      crash window (run moved to RESULT_AVAILABLE but event/checkpoint
      bookkeeping cut short) converges on exactly the one missing event
      -- the deterministic event id resolves the replay to the single
      original record; (c) re-reconcile after full completion never
      re-transitions and never re-emits (run file byte-identical,
      list_events() == the single record).
  AC-02:
    status: PASS
    evidence:
    - test_ac02_unknown_state_does_not_fabricate_completion
    - test_ac02_temporary_unavailable_state_does_not_fabricate_completion
    - test_ac02_probe_transient_failure_does_not_fabricate_completion
    - test_ac02_unrecognized_external_state_does_not_fabricate_completion
    notes: >-
      Unknown/temporary adapter state never fabricates completion. Only
      an exact probe return of "RESULT_AVAILABLE" (the sole member of
      COMPLETION_SIGNALS, asserted in the unrecognized-state test) can
      trigger the transition. UNKNOWN, TEMPORARY_UNAVAILABLE, a
      transient probe RuntimeError (observed as TEMPORARY_UNAVAILABLE,
      message NEVER persisted -- credential-shaped content scanned out
      of every persisted byte) and unrecognized backend-specific
      strings ("SUBMITTING") are all observed and recorded in the
      checkpoint, with the Run staying in its state and zero events
      emitted. Reinforced in the contracts: a completion signal for a
      pre-external run (DISPATCHED) or a cancelled run (CANCELLED)
      raises the stable ReconcileContractError with the run unchanged
      and no event -- completion is never fabricated onto a lifecycle
      that cannot record it -- and the default probe (none injected)
      always reports unknown, so the default configuration can never
      complete a run.
  AC-03:
    status: PASS
    evidence:
    - test_ac03_fresh_engine_reconstructs_progress_and_reconciling_is_idempotent
    - test_ac03_byte_identical_durable_state_for_identical_inputs
    - test_ac03_empty_watch_set_yields_empty_summary
    notes: >-
      Reconciliation is idempotent across restart. A FRESH
      ReconcileEngine over the same state dir / run store / event log
      reconstructs progress from durable state alone (watch set from
      the registry entries, completion facts from the Run records +
      checkpoint, events from the log) with an order-independent probe;
      re-reconciling the same three-run mix (completed / running /
      unknown) yields identical outcomes (completed_count 0, all
      observations preserved) and byte-identical durable state (runs,
      events and state trees all equal). Identical injected inputs
      produce byte-identical durable state across two independent
      directories (canonical sorted JSON, fixed clock, deterministic
      event ids). The empty watch set yields a deterministic empty
      summary and writes nothing.

