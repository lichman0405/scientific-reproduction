design_review:
  exactly_once_construction: >-
    Exactly-once is engineered, not asserted: the completion sequence
    is ordered (transition + write Run -> append event under the
    deterministic idempotency key -> persist checkpoint), and each
    crash-cut prefix converges on the same single completion -- the Run
    record already at RESULT_AVAILABLE is never transitioned again, the
    deterministic event id (generate_id("event",
    external_status_change, run_id, from, to)) resolves a re-append to
    the original record via the event log's idempotency claim, and the
    checkpoint is the durable "completion recorded" marker that gates
    the steady-state re-poll into a pure no-op. The event describes the
    completion transition itself (from RUNNING_EXTERNAL even when the
    bookkeeping recovery runs after the run already shows
    RESULT_AVAILABLE) -- semantically correct, not a lie about the
    current pass.
  no_fabrication_discipline: >-
    The completion trigger is a single-member frozenset; every other
    probe outcome flows through one non-completion path (observe +
    checkpoint only). Probe exceptions are normalized to
    TEMPORARY_UNAVAILABLE with the exception message discarded --
    transient failures carry no state information and their text never
    reaches durable bytes (proven by credential-shaped scans). The
    identity-mismatch guard (Run record external vs watch entry) and
    the lifecycle-contract errors (pre-external / CANCELLED runs) close
    the remaining fabrication and mis-polling holes loudly.
  real_machinery_verification: >-
    The tests exercise the REAL transition, state-backend, event-log
    and model machinery end to end: persisted Run records are re-read
    through Run.from_dict, events through the real ProjectEventLog with
    sequence numbers, checkpoint through the real store -- no mocks at
    the core layer. The engine persists nothing itself; every write
    flows through the injected/derived registry, checkpoint store, run
    store and event log.
  determinism_and_discipline: >-
    Injected clock everywhere (FakeClock fixed stamp; the engine's
    clock is asserted consulted), deterministic event ids and sorted
    traversal (reconcile_all iterates list_watched() in sorted run-id
    order; ReconcileSummary itself validates sorted outcomes and
    completed_count consistency), canonical sorted JSON through the
    stores, byte-identity across directories proven. TypeError at every
    public boundary (state_dir/now/probe/run_store/event_log/run_id),
    stable MonitoringError subclasses (ReconcileError ->
    ReconcileContractError/CorruptProgressError), corrupt progress
    fails loudly (missing and corrupt run records), and the
    no-adapters boundary is proven in a fresh interpreter (monitoring
    package import leaves scientific_reproduction.adapters out of
    sys.modules).
  type_ignore_audit: >-
    All 6 # type: ignore[arg-type] comments (test_reconcile.py lines
    982-997) are deliberate wrong-type boundary passes under
    pytest.raises(TypeError) -- the house boundary-test pattern (same
    judgment as DEV-M7-G04 and DEV-M8-G01); none masks a real defect.
    No other ignores or noqas anywhere.

