design_review:
  coverage_and_mapping: >-
    The inventory is complete for the accessible material and no broader
    than it: every item is traceable to a concrete source (a G01 record,
    the acquisition log, a spec section 2 seed fact, or a spec section 4
    work package / parameter set) via provenance and requirement_mapping,
    and every candidate work package of the reference case (WP-10..WP-82)
    is represented. 65 of 82 items are honestly DEFERRED-TO-EXECUTION --
    existence implied by the spec, value/existence requiring the paper/SI
    that the registration-only policy excludes -- each with a reason and
    the goal that populates it. This is the correct boundary for a
    registration-time inventory.
  provenance_and_traceability: >-
    Provenance is not decorative: source_ids resolve to actual records in
    ../sources/records/ (asserted by self_check, zero unknown ids),
    evidence_basis values come from the frozen enum, and the G01
    cross-reference ties each acquisition-log item to its inventory items
    in both directions (counts match the log's own inventory block). The
    reviewer battery independently re-derived the 13-record id set from
    the records directory and re-asserted every referenced id exists.
  ambiguity_handling: >-
    AC-03 is met with the strongest available form: 14 explicit
    ambiguity entries, each with note/affected ids/resolution goal, and a
    bidirectional integrity contract now enforced in code (forward hard +
    backward-closed hard, backward-open warned). The supervisor's a1
    finding (FND-M12-G02-01: AMB-0008 omitted INV-0515) proved the
    forward-only assertion was insufficient; the hardened checker makes
    the exact class of asymmetry a hard failure, and the re-run of both
    the worker checker and the independent battery on the fix head is
    clean. The 18 backward-open warnings are a designed tolerance
    (coverage-style references), documented in README ambiguity policy
    and counted in the checker summary line.
  determinism: >-
    The inventory is deterministic by construction: fixed timestamp
    2026-08-14T00:00:00Z (asserted against the determinism block), no
    wall clock, no randomness, no network at runtime; the checker is an
    offline, deterministic gate (856 checks) that can be re-derived
    byte-identically. No counter updates on re-runs, no time-dependent
    fields.
  honesty_over_fabrication: >-
    Registration-only discipline held: no paper/SI/CIF content in the
    repository; reported numbers are tagged seed_fact_sourced with
    value_status REPORTED-NON-FINAL (14) pending revalidation against the
    primary source during execution; genuinely unknown values are MISSING
    with assumption_class A2 and an explicit reason (9); placeholder scan
    (TBD/TODO/FIXME/lorem/filler markers) is clean; the 18 warnings and
    the vacuous frozen gate are disclosed rather than hidden.
  scope_discipline: >-
    The change is exactly the frozen allowed_scope
    (benchmarks/fdm201/inventory/**): 3 files, +2136/-0 (INVENTORY.yaml,
    self_check.py, README.md). The fix commit is 2 files, +35/-3, one
    data line plus checker hardening plus the CI F541 fix -- no product
    code, no test files, no schema changes, nothing outside the
    benchmark inventory directory. The worker did not "fix" the vacuous
    frozen gate by creating tests (correct -- that scope belongs to
    G07).
  fix_quality: >-
    FND-M12-G02-01 was fixed minimally and correctly: exactly one data
    line changed (INV-0515 inserted in AMB-0008's affected_item_ids in
    canonical order), the checker hardened against the whole asymmetry
    class, and the CI F541 finding (flagged by unpinned ruff drift:
    CI's ruff enforces F541, local 0.16.3 does not) fixed by dropping
    the f-prefix. All gates re-run on the fix head: worker checker
    856/0, reviewer battery 597/0, whole-repo ruff clean, mypy clean,
    full suite 3016, both CI jobs PASS. The fix commit is single and
    conventionally titled with the goal id.
  house_style: >-
    Files follow repo conventions: explanatory header comments, explicit
    enums declared in the data file, block-sequence YAML with quoted
    strings matching .development/ style, cross-references documented in
    README.md (layout, evidence model, status semantics table, WP-70
    policy, ambiguity policy, relationship to G01 and later goals).
    self_check.py is a deterministic offline gate in the same style as
    other repo checkers.

