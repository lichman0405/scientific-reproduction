design_review:
  proposed_not_rule: >-
    AC-02's "proposed, never a rule" is honored structurally: the floor
    is a PROPOSAL record -- is_default flag, documented rationale,
    declared override field -- and the constant that feeds it
    (DEFAULT_REPLICATE_FLOOR) is a by-reference reuse of the frozen
    DEFAULT_MIN_INDEPENDENT (templates.py line 154), so there is exactly
    one definition of the n >= 3 floor in the system and this module
    never redefines it. The override path is honest bookkeeping:
    set_replicate_override returns a NEW record (is_default=False,
    override_n set) while minimum_n keeps the default floor for the
    audit trail, and effective_replicate_floor derives the active value.
    The discipline extends to the acceptance side: AcceptanceProposal
    derives its replicate_floor from the replicate design through
    effective_replicate_floor in __post_init__, so a frozen acceptance
    always records what the design actually was.
  no_universal_percentage: >-
    AC-01 is enforced as a closed structural proof plus a behavioral
    proof, so it does not depend on reviewer reading: (1) no percent
    literal and no percentage-candidate numeric token in either package
    source file; (2) the rule-table source segments (AST-recovered, so
    the scan covers the real table) carry no percentage tokens; (3) no
    module-level numeric constant exists -- the floor is a named
    reference, the version a string; (4) the default acceptance capture
    carries no numeric tolerance of any kind and decision_mode
    "equivalence"; (5) a numeric tolerance can only enter through
    explicit evidence-grounded arguments, enforced by the constructor
    (refusal message names "evidence" and "equivalence_margin"). The
    margin, when legitimately supplied, is instance data on a specific
    acceptance (evidence refs attached), never a universal default.
  evidence_before_freeze: >-
    AC-03 is a real pipeline with an audit trail, not a flag: evidence
    attaches to the unfrozen proposal (pure, accumulating, ordered);
    freezing is gated by the frozen role-action matrix (Action.
    PLAN_FREEZE) so Role.RESEARCH is denied with the full permission
    assessment; the freeze-eligibility evaluation is a full decision
    record (per-rule decisions with rule_id/eligible/matched, the
    matched_rule_id, and the missing evidence claims); the flow refuses
    the freeze of an acceptance whose recorded tolerance lacks the
    evidence that grounds it, naming the missing claims and the deciding
    rule; and the frozen record carries exactly the evidence that
    justified it. The matched_rule_id is never None by construction
    (assert in templates.py line 1201 backed by the trailing total
    default rule R-STAT-F0), and validate_statistics_rulesets proves
    the table's integrity (unique ids, non-empty, total default) with
    three sample proposals at import/validation time.
  defense_in_depth: >-
    The strongest test is test_statistic_freeze_refuses_margin_without_
    required_evidence: it builds AcceptanceProposal DIRECTLY
    (proposal_id="proposal-acc-no-evidence", equivalence_margin=5.0, no
    evidence refs), bypassing construct_acceptance_proposal entirely, and
    the freeze is still refused by R-STAT-F1 with the missing claim
    named. The evidence-grounded-margin discipline is therefore enforced
    at TWO independent layers -- the constructor AND the freeze
    eligibility gate -- so a record assembled outside the constructor
    cannot reach the frozen state with an ungrounded tolerance. The
    refusal leaves the proposal unfrozen (recoverable: evidence can then
    be attached and the freeze retried), and the assessment is carried
    on the exception itself for the audit trail.
  determinism_and_purity: >-
    The module is pure by construction and the tests PROVE it rather than
    assert it: import roots read off the AST and whitelisted to
    {__future__, scientific_reproduction, math, dataclasses, enum,
    typing}; no randomness/clock/network/IO surface anywhere in the
    source (random/time/datetime/os/pathlib/secrets/uuid/requests/
    urllib/socket/open(/read_text/write_text/input(/print( all absent);
    byte-identical captures across repeated calls and across unfrozen/
    frozen (determinism via json.dumps with sort_keys over the capture
    dicts); proposal ids deterministic pure functions of the goal id and
    safe under ID_PATTERN (FND-M9-G02-01 lesson applied to goal ids,
    proposal ids and evidence ids); every record a frozen dataclass
    refusing mutation on every field. No network, no sleeps, no wall
    clock, no randomness anywhere in the suite.
  house_style: >-
    The files follow house style: module docstrings mapping the goal and
    ACs to the test sections; one test per behavior with an explanatory
    docstring; comment-per-assertion density; the frozen core vocabulary
    used directly (DecisionMode from core.models, Role and
    PermissionDeniedError from core.permissions, ID_PATTERN/is_valid_id
    from core.ids, DEFAULT_MIN_INDEPENDENT from analysis.replication by
    reference); the naming rule (every test name contains "statistic")
    honored in all 41 new tests; the package __init__ re-exports the
    module surface without adding behavior (proven by an AST scan that
    the init defines no functions or classes and that its __all__ is a
    subset of the templates module's). No core module is modified.
  observations: >-
    Three notes, none of them findings: (1) The AST-based structural
    proofs (import-roots whitelist, rule-table segment recovery via
    ast.get_source_segment, module-level constant scan) verify the REAL
    source deterministically rather than scanning a hardcoded string, so
    a future edit that sneaks a percent literal or a numeric default into
    the package fails the suite loudly. (2) The percentage-candidate
    token list is intentionally broader than a single "10.0" (it includes
    "0.1", "±10", "+10", "-10", "10.0", "0.10") -- conservative, and
    harmless here since the package legitimately contains none of them;
    the only numeric data in the module are the evidence-driven margin
    values that flow in as arguments, not defaults. (3) The pyright marks
    seen during development are all known noise classes (reportMissingImports
    from scanning without the venv context, multiline-import scan
    artifacts, and "not accessed" hints on module re-exports); ruff,
    mypy and pytest -- the authoritative gates -- are clean, and pytest
    collected and passed all 42 tests, so the files parse and type-check.

