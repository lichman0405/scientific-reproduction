acceptance_criteria:
  AC-01:
    status: PASS
    evidence:
    - test_statistic_package_contains_no_universal_percentage_tolerance
    - test_statistic_rule_tables_contain_no_percentage_tokens
    - test_statistic_module_defines_no_numeric_constant_defaults
    - test_statistic_default_acceptance_capture_has_no_numeric_tolerance
    - test_statistic_default_acceptance_has_no_numeric_tolerance
    - test_statistic_tolerance_requires_explicit_evidence_arguments
    - test_statistic_tolerance_is_grounded_by_evidence_arguments
    - test_statistic_default_acceptance_can_be_frozen_without_tolerance
    notes: >-
      AC-01 (no universal fixed percent margin) is pinned structurally
      AND behaviorally, with no dependence on the reviewer reading the
      module by eye. Structurally: the purity suite proves the whole
      statistics package source contains no percent literal (no "%" in
      any form, no percent-candidate numeric token -- 0.1 / 0.10 / 10.0 /
      ±10 / +10 / -10 -- no \d+(\.\d+)?\s*[%‰] pattern, in both
      templates.py and __init__.py), the freeze-eligibility rule-table
      source segments (recovered deterministically via ast
      .get_source_segment from the AnnAssign for FREEZE_ELIGIBILITY_RULES)
      carry no percentage tokens, and no module-level numeric constant
      exists anywhere (AST scan of Assign/AnnAssign + Constant: the
      proposed replicate floor is a NAMED reference to the frozen core
      constant DEFAULT_MIN_INDEPENDENT, never a literal; the ruleset
      version is a string). Behaviorally: the default acceptance records
      no numeric tolerance at all (equivalence_margin is None, evidence
      refs empty, as_dict() capture contains no percent token and no
      numeric value besides the proposed floor 3 and decision_mode
      "equivalence"), and a numeric tolerance can only enter through
      explicit evidence-grounded arguments -- construct_acceptance_proposal
      with equivalence_margin=5.0 and NO EQUIVALENCE_MARGIN evidence
      reference is refused with InvalidAcceptanceProposalError whose
      message names both "evidence" and "equivalence_margin". The frozen
      core is untouched: no change to analysis.replication or any other
      core module.
  AC-02:
    status: PASS
    evidence:
    - test_statistic_default_replicate_floor_is_proposed_as_n_ge_three
    - test_statistic_default_replicate_floor_is_overridable_by_supervisor
    - test_statistic_replicate_override_cannot_weaken_floor_below_one
    - test_statistic_replicate_proposal_rejects_invalid_shape
    - test_statistic_effective_floor_requires_a_replicate_proposal
    notes: >-
      AC-02 (the default n >= 3 independent-replicate floor is PROPOSED,
      not a rule) is delivered as a proposal record, never a hard rule:
      default_replicate_design_proposal(GOAL_ID) returns a
      ReplicateDesignProposal carrying minimum_n == 3 ==
      DEFAULT_REPLICATE_FLOOR -- which is defined as
      DEFAULT_MIN_INDEPENDENT by reference (line 154 of templates.py),
      reusing the frozen analysis.replication constant rather than
      redefining it -- with is_default=True, override_n=None and an
      auditable non-empty rationale explicitly stating "n >= 3". The
      proposal shape is honest about its own status: the override field
      is a declared dataclass field, set_replicate_override produces a
      new record with override_n set and is_default=False while the
      default floor stays recorded for the audit trail (minimum_n remains
      3), effective_replicate_floor honors the override, and the input
      proposal is never mutated (pure function). The floor can never be
      weakened below 1, invalid shapes (default-with-override, non-default
      under the default flag, whitespace rationale, unsafe goal/proposal
      ids) are stable value errors, and calls are deterministic
      (same goal id -> identical proposal and proposal id). The proposal
      record is what the Supervisor acts on -- including not acting on it.
  AC-03:
    status: PASS
    evidence:
    - test_statistic_evidence_is_attached_before_freezing
    - test_statistic_evidence_cannot_be_attached_after_freezing
    - test_statistic_freeze_refuses_margin_without_required_evidence
    - test_statistic_freeze_carries_exactly_the_justifying_evidence
    - test_statistic_freeze_is_supervisor_only
    - test_statistic_freeze_eligibility_assessment_records_decisions
    - test_statistic_default_acceptance_can_be_frozen_without_tolerance
    - test_statistic_freezing_is_pure_and_immutable
    - test_statistic_freeze_flag_records_in_capture_dict
    - test_statistic_rulesets_validate
    notes: >-
      AC-03 (literature/method evidence is incorporated BEFORE freezing;
      freezing is Supervisor-only) is enforced as a pipeline with audit:
      attach_evidence accumulates EvidenceReferences (evidence_id /
      source_id / claim / claim_text) on the UNFROZEN proposal, is pure
      (the input keeps its original refs) and is refused on a frozen
      acceptance with FrozenAcceptanceError carrying the eligibility
      assessment. The freeze gate is role-gated through the frozen
      core.permissions role-action matrix (Action.PLAN_FREEZE): Role.
      RESEARCH is denied with PermissionDeniedError and the full
      assessment record, Role.SUPERVISOR proceeds. The flow refuses
      freezing an acceptance whose recorded tolerance lacks the evidence
      that grounds it: the strongest test constructs AcceptanceProposal
      DIRECTLY (bypassing the constructor) with equivalence_margin=5.0
      and no evidence -- the freeze is still refused by rule R-STAT-F1,
      the refusal names the missing claim (EQUIVALENCE_MARGIN) and
      matched_rule_id, and records BOTH rule decisions (R-STAT-F1
      matched, R-STAT-F0 total default matched) in the auditable
      FreezeEligibilityAssessment. A frozen acceptance carries exactly
      the evidence that justified it (nothing added, nothing dropped).
      Freezing is pure, idempotent, records the frozen flag in the
      deterministic capture dict, and the frozen record rejects mutation
      on every field (FrozenInstanceError). validate_statistics_rulesets
      returns the exact ordered rule ids ("R-STAT-F1", "R-STAT-F0").

