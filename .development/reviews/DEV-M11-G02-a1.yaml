ac_evidence:
  AC-01: >-
    The ordered CHARACTERIZATION_REQUIREMENT_RULES table (R-CHA-P1..P4 +
    the trailing R-CHA-P0 total default) declares the required raw data +
    instrument metadata set per characterization kind -- PXRD (7
    parameters), SCXRD (6), TGA (7), spectroscopy (6) -- with
    first-match-wins evaluation proven for every kind
    (test_character_requirement_rule_table_covers_every_kind) and the
    universal CHARACTERIZATION_VALUE_RULES (R-CHA-V1..V21, one rule per
    named parameter, total function) enforced at construction over
    present parameters (23 parametrized rejections; the atmosphere rule
    reuses the frozen synthesis CONTROLLED_ATMOSPHERES vocabulary).
    missing_metadata() detects every unrecorded required parameter, and
    assumptions_for_missing_metadata routes each through the REAL
    core.rules.assumptions pathway -- real core.models.Assumption records
    decided by the real assumption_effect and read back through the real
    evaluate_strict_label (A2 default per 16-...-DOMAIN-PACK SS5:
    R-STRICT-2 NOT_STRICT with R-EFF-1 DISQUALIFIES_PURE_STRICT; explicit
    A1 -> R-STRICT-3 STRICT_WITH_ASSUMPTIONS, A0 -> R-STRICT-4 STRICT,
    complete template -> R-STRICT-1 STRICT) -- never a parallel store;
    records pass the real schema gate (validate_and_reject);
    apply_assumption_routing carries the safe refs on the template
    without mutation; assumption ids are deterministic and safe
    (generate_id + ID_PATTERN + is_valid_id, FND-M9-G02-01).
  AC-02: >-
    AnalysisPlan is pure metadata (protocol, ordered protocol_steps,
    instance-data acceptance thresholds from the universal
    ACCEPTANCE_PARAMETERS vocabulary with one universal shape rule per
    name, R-CHA-AP1..AP7) that is frozen SEPARATELY from execution:
    freeze_analysis_plan is a pure permission-gated decision
    (check_action_allowed(role, Action.PLAN_FREEZE) -> PermissionDeniedError
    with the full assessment R-PRM-D1 for Research AND all four worker
    roles; R-PRM-SUP1 for the Supervisor) requiring NO execution
    artifacts (a bare template with no parameter values freezes
    identically); plan freeze and template freeze are independent states
    (test_character_analysis_plan_freeze_is_separate_from_template_
    freeze); a template with no recorded plan raises the stable
    InvalidAnalysisPlanError, never a placeholder freeze; frozen copies
    are immutable, the input never mutated. evaluate_acceptance is a
    pure function of recorded measurement facts and the plan's recorded
    thresholds: every ANALYSIS_ACCEPTANCE_RULES criterion (R-CHA-A1..A7)
    is applied as an explicit contract over all four kinds, the aggregate
    outcome is decided by CHECK_OUTCOME_RULES (R-CHA-O1/O2/O3, FAIL >
    PENDING > PASS, first match wins), every decision is recorded, and
    pending measurements are the exact input of
    assumptions_for_missing_measurements (real Assumption records,
    byte-identical sorted order to the evaluation's pending list) --
    never a silent skip.
  AC-03: >-
    The PXRD identity/quality checks of 16-...-DOMAIN-PACK SS5 (phase
    identification, peak-position agreement, intensity-pattern comparison
    with caution for preferred orientation, batch consistency) are
    REPRESENTED by the ordered PXRD_IDENTITY_CHECKS contract table
