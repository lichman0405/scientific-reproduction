- >-
    Observed boundary limitation (non-blocking, documented for the audit
    trail): the TGA mass-loss acceptance rule R-CHA-A6 consumes TWO
    recorded facts (observed_mass_loss_pct and reference_mass_loss_pct)
    but the AnalysisAcceptanceRule shape declares a single `measurement`
    field. If a caller records observed_mass_loss_pct but NOT
    reference_mass_loss_pct, evaluate_acceptance invokes the predicate
    (the single declared measurement is present) and _mass_loss_within
    raises a KeyError instead of a PENDING state. This is a loud failure,
    never a silent skip or a false PASS, and no AC requires multi-fact
    pending coverage for TGA; a correct fix (multi-measurement rules)
    would change the rule-table shape and is out of scope for this goal.
    Recorded here rather than in claim_corrections because it is an
    independent review observation, not a worker claim correction.
