      non-satisfied states block, distinguished only in the reason
      report). Tests: test_closure_fails_when_any_mandatory_gate_is_
      unresolved (parametrized over all 4 gates),
      test_closure_fails_when_any_mandatory_gate_is_evaluated_failing,
      test_closure_allowed_only_when_all_four_gates_satisfied,
      test_closure_blocked_reports_every_blocking_gate,
      test_closure_outcome_depends_only_on_the_four_mandatory_axes
      (1080-record exhaustive-grid bi-implication),
      test_closure_matched_rule_is_the_first_true_predicate. Independent
      rerun at head a9efa27: 46 closure tests passed, exit 0.
  - criterion_id: AC-02
    result: PASS
    evidence: >-
      No fixed failure-count shortcut can close a required goal: the
      ClosureRecord has no failure/attempt-count field (only tri-state
      axes and auditable recovery/literature counts), CLOSURE_RULES is
      exactly ["R-CLOSE-1","R-CLOSE-2"] with no failure-count predicate
      (regex scan of all rule descriptions in tests), and the outcome is a
      pure function of the four mandatory axes. Tests:
      test_closure_record_has_no_failure_count_input,
      test_closure_rule_table_has_no_failure_count_shortcut_rule,
      test_closure_outcome_depends_only_on_the_four_mandatory_axes,
      test_closure_auditable_counts_are_inert,
      test_closure_no_fixed_failure_count_shortcut_behavioral.
      Verification rerun at head: 290 tests/rules passed, exit 0.
  - criterion_id: AC-03
    result: PASS
    evidence: >-
      Eligible recovery hypothesis remaining >0 prevents non-reproduced
      closure: the recovery axis is satisfied exactly when the pool is
      exhausted (remaining == 0, R-RECOV-1); any remaining eligible
      hypothesis blocks closure with the exact count reported in the
      reason detail ("eligible recovery hypotheses remaining: N",
      R-RECOV-2); an unassessed pool (None) blocks as unresolved
      (R-RECOV-3). Tests: test_recovery_remaining_hypotheses_prevent_
      closure, test_recovery_any_remaining_count_blocks_closure_with_
      reported_count (1/3/100), test_recovery_pool_unassessed_blocks_
