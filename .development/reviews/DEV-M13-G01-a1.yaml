observations:
  - id: OBS-M13-G01-01
    detail: >-
      The double-pytest-process phenomenon recurred a third time (G07
      battery, G01 first suite, G01 authoritative re-run): the same command
      was launched twice (two python -m pytest -q tests processes, PIDs
      8796/27308 on the re-run). Both runs produced identical results (3146
      passed) -- harmless but wasteful (~6.5 min each). It is a harness-level
      duplicate launch, not a test defect; tracked for the M13 Release Gate.
  - id: OBS-M13-G01-02
    detail: >-
      pyright (non-authoritative) diagnostics on the head -- traceability.py
      L412/418 tuple-key size, L444 used_by / L527 run_ref unknown
      attributes, audit.py L246/428/430/433 unreachable code, and
      tests/reporting/helpers import failures -- were all manually
      dismissed: the links/gaps dict key tuples are declared and built with
      identical arity, the attribute accesses follow assert isinstance
      narrowing, the "unreachable" lines are reachable in the current file
      (stale diagnostics), and the helpers import resolution was a venv
      artifact (the file is reporting_helpers.py). mypy 113 files clean and
      the 3146-test runtime suite are authoritative; confirms the house
      position that pyright is not a gate.
  - id: OBS-M13-G01-03
    detail: >-
      The worker's five findings are all documented v0.1 vocabulary/storage
      limitations, not defects: no failed-run lifecycle state (RunStatus is
      a derived classification), EvidenceRegistry is in-memory only (taken
      as an explicit input), Supervisor decisions are not persisted
      (requirement records carry the SS7 Requirement-outcome hop),
      output_artifact_ids not traced (not persisted in v0.1), and the helper
      named reporting_helpers.py to avoid the tests/artifacts/helpers.py
      sys.modules bare-name collision. API-completeness candidates for a
      future milestone, consistent with OBS-M12-G07-02/03 (no decision
      registry, no register_assumption API); tracked for the M13 Release
      Gate.

