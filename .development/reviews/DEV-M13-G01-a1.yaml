acceptance_criteria:
  AC-01:
    status: PASS
    evidence:
    - >-
      supervisor read of the full implementation: traceability.py trace_claim
      resolves the SS7 chain (14-STATE-GIT-ARTIFACTS.md SS7) through 9 hops
      (evidence used_by -> requirement outcome; AcceptanceCriteria.evidence_refs
      -> acceptance; ResultRecord.acceptance_ref -> analysis; requirement_refs
      -> analysis; reverse evidence_refs -> analysis; run_ref -> run;
      input_artifact_ids -> artifact; Run.artifacts -> artifact; manifest
      producer run_id/analysis_id links), every hop recorded as a TraceLink
      naming the exact real record field (via); audit.py validate_package
      requires at least one ANALYSIS, RUN and ARTIFACT node per key claim
      (TRACE_INCOMPLETE otherwise)
    - >-
      tests: test_trace_claim_resolves_full_chain_ac01 (all 7 node kinds),
      test_trace_claim_records_every_hop_ac01 (9 vias),
      test_trace_claim_nodes_carry_typed_records_ac01,
      test_audit_validate_passes_valid_chain_ac01, test_audit_build_package_
      assembles_all_registries_ac01; goal command 33 passed in the supervisor
      independent run (11.53s, exit 0)
    notes: >-
      AC-01 "key claim traced to Analysis -> Run -> Artifact/Evidence" is
      evidenced by the traceability resolver (hop-by-hop with exact record
      fields) plus the audit validator's node-kind completeness rule and the
      ac01 test families in both suites. Every record is read through the
      real registration APIs (FilesystemStateBackend, ArtifactRegistry,
      list_results/list_acceptance/list_requirements/list_goals); nothing
      mocked, nothing rewritten.
  AC-02:
    status: PASS
    evidence:
    - >-
      supervisor read of the full implementation: trace_claim is TOTAL --
      every dangling reference is a TraceGap (source node, exact via field,
      ref id, stable reason), never an exception; a claim with no registered
      evidence resolves to a trace with only the CLAIM node; validate_package
      converts gaps to TRACE_GAP errors, an evidence-less claim to
      CLAIM_NOT_FOUND, an unreachable hop to TRACE_INCOMPLETE, and an
      unresolvable run-artifact ref to UNRESOLVED_RUN_ARTIFACT
    - >-
      tests: ac02 families of both suites (missing run, vanished manifest,
      dangling used_by ref, dangling acceptance evidence_refs, claim without
      evidence, unknown claim, unresolved run artifact, dangling acceptance
      evidence_refs)
    notes: >-
      AC-02 "every missing link fails validation" is evidenced by the gap
      semantics (data, not exceptions) plus the four ValidationErrorKinds and
      their ac02 tests; every failure names the offending record and the
      exact link field. Validation failures are data: validate_package
      returns the deterministic sorted error list, never raises for missing
      data.
  AC-03:
    status: PASS
    evidence:
    - >-
      supervisor read of the full implementation: build_audit_package
      assembles EVERY run of the run store (run_store.list_ids) with its
      real lifecycle_state / scientific_review and the derived RunStatus
      (FAILED for CANCELLED/INVALIDATED or ScientificReview.FAIL, SUCCEEDED
      for CLOSED, UNRESOLVED otherwise); failed runs are never filtered and
      stay visible in the package and its canonical JSON run table
    - >-
      tests: test_audit_failed_run_remains_visible_ac03 (CANCELLED run in the
      table while a valid chain still passes), test_audit_failed_review_run_
      is_failed_ac03 (CLOSED + FAIL review -> failed), test_audit_run_status_
      classification_ac03 (7-case pure-function table), determinism tests
    notes: >-
      AC-03 "failed Runs remain visible in package validation" is evidenced
      by the total run assembly (no filtering) plus the run-status
      classification as a pure function of the frozen Run fields. The frozen
      Run vocabulary has no failed state (scientific PASS/FAIL is a review
      decision stored separately per 05-GOAL-RUN-SCHEMA.md SS7), so
      FAILED_RUN_LIFECYCLE_STATES derives from the real
      TERMINAL_RUN_STATES - {CLOSED} rule table, keeping the vocabulary
      frozen; documented in the module docstring.

