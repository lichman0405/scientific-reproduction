design_review:
  rule_table: >-
    R-SLURM-S1..S27 is a first-match-wins ordered table (S1-12 active ->
    running, S13-14 COMPLETED -> completed, S15-16 CANCELLED -> cancelled,
    S17-26 FAILED-family -> failed, S27 total default -> failed +
    unknown=True), exactly one trailing default, validated by
    validate_slurm_state_rules (proves uniqueness + totality); decisions
    are frozen SlurmStateDecision records with the rule trace; the
    normalization strips, upper-cases and first-token-splits before
    matching (case-insensitive, reason suffixes stripped) with a
    post-assert that the default always matched.
  batch_script: >-
    _build_batch_script generates #!/bin/bash, set -e (module-load
    failures abort the launch), module load lines in order, key-sorted
    export KEY='value' lines (_single_quote escapes), set +e, then the
    shlex.joined command with `; _sr_exit_code=$?; echo $_sr_exit_code >
    <quoted statusfile>; exit $_sr_exit_code` so the scheduler's terminal
    state always agrees with the command's exit status. Every
    interpolated value is shell-quoted; space-bearing working directories
    are quoted (tested); environment values are validated (no NUL/
    newline) and keys are POSIX-safe names.
  six_operation_surface: >-
    prepare stages the durable record only (never touches the remote,
    asserted); submit writes the script locally, mkdir -p the remote
    workdir, pushes the script and invokes sbatch --chdir with absolute
    output log -- each step its own session under the retry policy
    (exact connect/run/disconnect sequence asserted), a mid-operation
    drop reconnects and re-runs the pending step; status probes squeue
    (active) then sacct (terminal) -- squeue active never queries sacct;
    collect pulls declared outputs to <state_dir>/staging/<job_id>/ and
    registers through the REAL DEV-M3-G02 ArtifactRegistry with
    deterministic generate_id("artifact", job_id, output_name), real
    SHA-256/size, producer stamp adapter:compute/slurm_ssh@v1.0 and
    idempotent re-collection with no remote contact (conflicting
    registration -> ComputeCollectError); cancel is local for prepared
    and scancel + post-probe for running (confirmed terminal -> no note,
    unconfirmed -> stable TERMINATE_PENDING_NOTE); resume re-attaches
    from the record alone. Frozen decision records with strict to_dict;
    byte-identical records/scripts/statuses for identical inputs;
    injectable clock (6 identical fixed reads in the full cycle);
    TypeError at type boundaries, ValueError-subclass stable errors.
  credential_discipline: >-
    Credentials live only on the constructor boundary: the durable record
    schema is asserted to be exactly the 18 documented keys with no
    credential-shaped tokens; the full-cycle state-file walk, the
    transport call log repr and every pushed script are asserted free of
    all four credential values; launch commands embed none (asserted via
    the shell lines).
  modules_environment: >-
    Modules (validated against a widened but metacharacter-free name
    alphabet) and key-sorted environment snapshots are captured on the
    durable record, re-validated by from_dict, embedded in the batch
    script, and part of the staged content (restaging with a different
    module set is rejected; identical restaging accepted).

