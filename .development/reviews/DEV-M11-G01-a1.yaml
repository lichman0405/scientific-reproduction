ac_evidence:
  AC-01: >-
    Batch planning produces the correct frozen contracts: (a) plan_independent_
    batches yields RunType.INDEPENDENT_REPLICATE runs with deterministic safe ids
    (generate_id("run", template_id, f"batch-{index:03d}"), ID_PATTERN safe
    registry segment -- no slash/backslash/whitespace/glob characters, the
    FND-M9-G02-01 lesson), carrying the template's goal track and the RECOVERY
    track when the template declares it (test_synth_batches_*). (b) The
    replication floor is frozen in the template: BatchReplicationDefaults
    minimum_n == 3 mirrors GoalReplication, and the batch floor rules
    (BATCH_FLOOR_RULES R-BF-1 n>=floor sufficient / R-BF-2 total default) decide
    plan_independent_batches -- a below-floor request is rejected with the
    decision record, an explicit floor (5) is respected (test_synth_batches_
    below_floor_request_rejected_with_decision_record,
    test_synth_batches_explicit_floor_respected). (c) Template freeze is
    Supervisor-only through the REAL DEV-M6-G03 matrix: freeze_synthesis_template
    calls check_action_allowed(role, Action.PLAN_FREEZE); the Supervisor's call
    succeeds (frozen=True, input template unchanged -- pure function, verified by
    mutation-leak test) and a Research-role call is denied with the complete
    PermissionDeniedError assessment (R-PRM-D1 denial record)
    (test_synth_freeze_*). (d) Determinism: identical inputs -> byte-identical
    capture_protocol output and identical generated ids (test_synth_batches_
    deterministic_ids, test_synth_templates_deterministic_capture).
  AC-02: >-
    Missing parameters create real, retrievable scientific assumptions through
    the core Assumption Registry pathway: (a) assumptions_for_missing_parameters
    records genuine Assumption objects (generate_id("assumption", template_id,
    parameter), is_valid_id verified, default label A2_SCIENTIFIC_ASSUMPTION)
    for exactly the parameters absent from the template value table, and reads
    them back through the real core.rules.assumptions API (assumption_effect +
    evaluate_strict_label) -- A2 -> R-STRICT-2 NOT_STRICT, A1 with evidence ->
    R-STRICT-3 STRICT_WITH_ASSUMPTIONS, A0 -> R-STRICT-4 STRICT, complete
    template -> R-STRICT-1 (test_synth_assumptions_ac02_*). (b) The assumption
    schema is enforced by the real schema persistence gate: a malformed
    assumption record is rejected by validate_and_reject("assumption")
    (test_synth_assumptions_malformed_assumption_rejected_by_schema_gate). (c)
    The routing is a pure function and the registry write is deterministic --
    same input -> identical records, no randomness, no wall clock
    (test_synth_assumptions_deterministic). The FDM-201 fixtures (fdm201_mof_
    synth_template / fictional_oxide) are used only as instance data for the
    batch/assumption/parameter machinery; no FDM-201 chemistry is hard-coded
    into the domain pack (AST-segment scan proves no instance tokens: PyBC /
    zinc / DMF / 393 / 298 / solvothermal / D5TA00771B).
  AC-03: >-
    The ruleset is complete, consistent and general -- no instance chemistry
    embedded: (a) validate_synthesis_rulesets enforces unique template ids,
    coverage of every unit-process kind (synthesis/activation/solvent_exchange
    each has exactly one template class with its _ALLOWED_KINDS narrowed),
    total-default presence for every parameter rule table (TEMPLATE_VALUE_RULES
    R-TPL-V1..V13, TEMPLATE_PARAMETER_RULES R-TPL-P0 total default + P1..P5
    per-kind required sets), and exactly one value rule per parameter
    (test_synth_templates_ruleset_*). (b) Value rules are general scientific
    constraints -- temperature_K positive, duration_h positive, stoichiometry
    positive, activation temperatures/durations positive, atmosphere in the
    CONTROLLED_ATMOSPHERES vocabulary {air, argon, nitrogen, vacuum, sealed},
    pressure non-negative, exchange_cycles int >= 1, names non-empty -- applied
    uniformly across 6 material families (MOF, oxide, metal, polymer, cement,
    electrolyte parametrized test) with no material-specific values in the
    module (test_synth_templates_value_rules_apply_to_materials_universally).
    (c) Purity by construction: AST import-root scan of the module allows only
    __future__/scientific_reproduction/math/dataclasses/enum/typing/collections/
    re/itertools; token scan forbids randomness/clock/network/IO and materials-
    chemistry vocabulary in the module; the package __init__ is a pure re-export
    wiring (no own definitions); capture_protocol output is byte-identical
    across calls (test_synth_purity_*). (d) Template ids are safe registry
    segments (9 unsafe ids parametrized -- whitespace, slashes, glob chars --
    all rejected at construction).
