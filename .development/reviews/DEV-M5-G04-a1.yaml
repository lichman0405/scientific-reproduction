comments:
  - >-
    Scope check: 2 files changed, both ADDED —
    src/scientific_reproduction/research/reliability.py (+672),
    tests/research/test_reliability.py (+758). No frozen file touched:
    research/evidence.py, research/requests.py, research/dedupe.py,
    core/rules/evidence.py and core/models.py are imported read-only (the
    cross-layer test consumes them). Single conventional commit 96420f8
    [DEV-M5-G04] above merge base faacbe5, no amend, no force-push, no
    tests deleted or weakened (purely additive, +27 tests). PR #29
    mergeStateStatus CLEAN; CI both jobs SUCCESS; head equals the reviewed
    head. M5-G04 is the reliability persistence/rule layer of the research
    subsystem; core.rules.evidence remains the frozen rubric hook (M2).
  - >-
    Design reviewed — AC-01 is enforced by construction: no score
    parameter, no score-accepting API, records un-creatable without a
    reference, registry evaluation only against stored records, and the
    produced (score, reference) pair is exactly the
    EvidenceAssessment.reliability/reliability_checklist_ref handoff the
    sibling data layer persists. The six-factors-vs-nine-dimensions
    tension of AC-02 vs 06-EVIDENCE-SYSTEM.md SS2 is resolved as
    documented: the six AC-02 factors are first-class named fields in AC-02
    order, the three remaining spec dimensions are recorded as additional
    frozen fields (CORE_FACTOR_KEYS / ADDITIONAL_DIMENSION_KEYS expose the
    split), and nothing from the frozen spec is dropped — consistent with
    the M2 core rules which score all nine. The UNKNOWN vocabulary member
    is distinct from NO and never counted as satisfied (conservative,
    tested). The rule table R-REL-D0 (disqualifying defect) / H1..H4
    (bands) / H5 (total default) is ordered first-match-wins and total;
    the 2**9 exhaustive grid proves score identity with the M2 core rubric
    for all YES/NO records, and the 3**9 grid proves schema-range
    conformance and totality for every possible record — the strongest
    reproducibility guarantee to date. Frozen records with versioned
    vocabulary (CHECKLIST_VOCABULARY_VERSION) and ruleset
    (RELIABILITY_RULESET_VERSION) recorded in every assessment keep old
    decisions interpretable; the registry is immutable-functional
    (register returns a new registry, duplicates rejected, never
    clobbering); from_dict is strict (unknown/missing keys rejected, bools
    and free text rejected, canonical-string coercion only). Error
    discipline: TypeError at public boundaries, ValueError-subclass
    hierarchy (ReliabilityChecklistError -> RecordError/DuplicateError)
    with stable, path-free messages. Paradigm: pure deterministic
    functions, no randomness/wall-clock, frozen dataclasses, __all__
    exports, docstrings citing the frozen spec sections
    (06-EVIDENCE-SYSTEM.md SS2, schemas/evidence.schema.yaml,
    schemas/research-request.schema.yaml, 09-RESEARCH-SUBSYSTEM.md SS5,
    agent-contracts/RESEARCH.md, CLAUDE-CODE-HANDOFF.md M5, and the
    sibling research/evidence.py handoff). The documented readings
    (six-vs-nine, UNKNOWN-never-satisfied, total default) are honest,
    correct resolutions. No flake occurrence on this PR (local runs and CI
    green).
  - >-
    Pyright IDE diagnostics are the established noise classes: the
    "unreachable" flags point at the defensive TypeError raises on typed
    parameters and the "unreachable default" matched_score initializer;
    the unused-lambda-parameter flags come from the uniform rule-table
    predicate signatures; remaining flags are stale snapshots from pyright
    resolving against the main repo instead of the worktree. mypy, the
    configured gate, is clean on 52 source files and CI both jobs PASS.
