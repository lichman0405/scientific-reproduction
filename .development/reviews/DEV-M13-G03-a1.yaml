acceptance_criteria:
  AC-01:
    status: PASS
    evidence:
    - >-
      supervisor read of the full implementation (summary.py, 506 lines):
      build_summary CONSUMES the Core aggregation results -- it calls
      core.rules.outcome.aggregate_project_outcome (over
      RequirementOutcomeRecord built by the Core's own input model
      from_reproduction_requirement, with the recorded closure decision of
      the registered closure contracts as closure_allowed) and
      aggregate_method_reproducibility (over MethodReproducibilityRecord)
      -- and renders the aggregation's own values verbatim: the
      ReproductionOutcome value, outcome_ruleset_version,
      outcome_matched_rule_id and outcome_blocking_reasons. Per-requirement
      entries render the recorded values exactly (OPEN stays OPEN; an
      unrated method_reproducibility renders the Core input model's
      canonical UNDETERMINED). Nothing is re-implemented or re-derived in
      the reporting layer.
    - >-
      tests: test_summary_project_outcome_equals_core_aggregation_ac01
      (independently re-derives the aggregation over the same recorded
      requirements and asserts identity of outcome, rule id R-PRJ-2,
      ruleset version and blocking reasons),
      test_summary_renders_recorded_outcome_verbatim_ac01,
      test_summary_open_outcome_rendered_as_recorded_ac01 (OPEN renders
      OPEN; the Core aggregation gates determination, R-PRJ-UND-1),
      test_summary_canonical_json_deterministic_ac01; goal command 17
      passed in the supervisor independent run (11.53s, 33 deselected,
      exit 0)
    notes: >-
      AC-01 "reporting reflects the Core aggregation exactly" is evidenced
      by the consume-not-implement architecture (the rendered values ARE
      the aggregation's own values over the same records) and the identity
      assertion against an independent re-derivation.
  AC-02:
    status: PASS
    evidence:
    - >-
      supervisor read of the full implementation: project_phase is rendered
      from the recorded ProjectPhase vocabulary (schemas/project.schema.yaml)
      in its own field/section, and every outcome value (RequirementOutcome,
      ReproductionOutcome, MethodReproducibility) is rendered verbatim from
      its own vocabulary; no symbol, section or rendering path maps a phase
      value onto an outcome value or vice versa
      (04-PROJECT-LIFECYCLE.md section 1: phase answers "where is the
      workflow now?", outcome answers "what is the final scientific
      reproduction conclusion?").
    - >-
      tests: test_summary_pins_every_outcome_value_verbatim_ac02 (all five
      RequirementOutcome values pinned AND the ProjectPhase/RequirementOutcome
      value sets asserted disjoint in both directions),
      test_summary_project_outcomes_rendered_verbatim_ac02 (four
      ReproductionOutcome cases with rule ids R-PRJ-1/2/3/4, each asserted
      never equal to a phase value),
      test_summary_method_reproducibility_verbatim_ac02 (R-MR-3)
    notes: >-
      AC-02 "outcome values never conflated with project_phase" is
      evidenced by the vocabulary-disjointness assertions in both
      directions plus the verbatim pinning of every value of every outcome
      vocabulary.
  AC-03:
    status: PASS
    evidence:
    - >-
      supervisor read of the full implementation: RecoverySummary counts
      and lists ONLY recorded values -- requirements whose recorded outcome
      is REPRODUCED_WITH_RECOVERY, goals whose recorded track is RECOVERY /
      METHOD_REDESIGN (GoalContract.track, 05-GOAL-RUN-SCHEMA.md SS4), the
      recorded closure_allowed of every registered closure contract and the
      recorded per-requirement MethodReproducibility ratings (the v0.1
      recovery-level encoding, 08-STRICT-RECOVERY-CLOSURE.md sections 1-2);
      the summary NEVER decides which recovery level a recorded recovery
      was and never invents a closure decision: no contract registered or
      conflicting decisions -> aggregation input None (unassessed),
      mirroring the unresolved-gate philosophy of rules.closure.
    - >-
      tests: test_summary_recovery_state_from_recorded_records_ac03
      (Scenario B of 18-TEST-AND-ACCEPTANCE-PLAN.md: recovered requirement
      renders REPRODUCED_WITH_RECOVERY, minor-recovery rating aggregates
      lower than direct reproducibility, R-MR-3; both requirements close
      REPRODUCED so the Core aggregates FULLY_REPRODUCED, R-PRJ-1),
      test_summary_no_recovery_nothing_invented_ac03,
      test_summary_closure_allowed_consumed_for_critical_not_reproduced_ac03
      (R-PRJ-3), test_summary_closure_not_allowed_blocks_negative_closure_ac03
      (R-PRJ-UND-2), test_summary_conflicting_closure_decisions_rendered_not_
      computed_ac03 (both decisions stay visible sorted by closure_id; the
      ambiguous state feeds unassessed, R-PRJ-UND-3)
    notes: >-
      AC-03 "recovery levels are summarized from the recorded state" is
      evidenced by the count-and-list-only architecture (sorted, verbatim)
      and the closure-decision tests covering allowed / not-allowed /
      conflicting / absent states, each through the REAL Core aggregation
      (rule ids R-PRJ-3 / R-PRJ-UND-2 / R-PRJ-UND-3 verified against
      core.rules.outcome).

