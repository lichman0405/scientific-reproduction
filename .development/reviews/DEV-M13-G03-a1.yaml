design_review:
  decomposition: >-
    One deliverable decomposed into: the OutcomeSummary surface
    (project-level outcome + Core aggregation metadata + per-requirement
    entries + method reproducibility + RecoverySummary), the verbatim
    RequirementOutcomeEntry, and an error hierarchy mirroring audit.py /
    report.py (SummaryError -> SummaryNotInitializedError /
    SummaryCorruptError). 17 tests map 1:1 to the three AC surfaces plus
    structural boundaries; the test-local make_summary_requirement helper
    is documented (mirrors reporting_helpers.make_requirement but allows
    the full outcome vocabulary the fixed helper pins).
  real_machinery: >-
    Only real registration APIs: read_project_state, list_requirements,
    list_goals, list_closure_contracts. The Core aggregation functions are
    called with records built by the Core's own input models
    (RequirementOutcomeRecord.from_reproduction_requirement /
    MethodReproducibilityRecord.from_reproduction_requirement) -- the
    renderer never transforms, derives or decides. The summary only reads;
    it creates no durable records. Nothing mocked.
  grounding: >-
    Every citation verified against the frozen specs:
    04-PROJECT-LIFECYCLE.md sections 1/3-6 (phase/outcome separation, the
    ReproductionOutcome vocabulary and the versioned-rule-module mandate),
    08-STRICT-RECOVERY-CLOSURE.md sections 1-2/4 (recovery levels,
    closure contracts), 18-TEST-AND-ACCEPTANCE-PLAN.md Scenario B,
    05-GOAL-RUN-SCHEMA.md SS2/SS4, schemas/project.schema.yaml. Rule ids
    R-PRJ-1/2/3/4, R-PRJ-UND-1/2/3 and R-MR-3 verified against the real
    core.rules.outcome aggregator (DEV-M2-G06).
  determinism: >-
    Pure function of the recorded state: requirements/goals/closures sorted
    by stable keys, no wall clock, no randomness, no network; byte-identical
    canonical JSON across repeated builds asserted. The conflicting-closure
    state is resolved deterministically to unassessed (None) with every
    recorded decision still visible.
  scope: >-
    git status on the head is clean; exactly 2 files added (1 src module,
    1 test module), all under the allowed scope. No .development changes,
    no AC changes, no --no-verify. Single commit a18f288 on base 8c7c171
    (PR base = dispatch-time origin/main); independent of PR #78 (no
    cross-dependency on report.py); PR mergeable.

