design_review:
  shared_battery_not_duplication: >-
    The goal deliverable is a shared contract battery, and the
    architecture proves it: PlatformRig wraps each adapter with the same
    scripted fake surface (both fakes expose records/live/submissions/
    stops/deliveries/accept/unavailable and spawns/accept), so 32
    parameterized tests execute identical assertion bodies against both
    platforms (pytest ids [claude] / [codex]), plus the one
    non-parameterized comparison test. The per-platform differences are
    contained to documented constants (the exported reason vocabulary,
    the platform ids, the transport-id derivation team_task vs
    codex_session) surfaced through rig.transport_id -- the battery never
    special-cases one platform inside an assertion. This is the honest
    reading of "the same core contract tests where capabilities overlap":
    where the frozen vocabulary is platform-neutral (session identity,
    capability records, error taxonomy, durable facts), the assertions
    are identical; where the adapters are documented to differ (reason
    wording, fallback channel naming), the differences test pins exactly
    those and nothing more -- including the shared verbatim vocabulary
    (SUBAGENT_FALLBACK_REASON equal on both platforms, "durable session
    registry" in both terminate-fallback reasons).
  semantics_defined_not_handwaved: >-
    AC-02's "do not alter Goal/Run/Evidence semantics" is given a precise
    operational meaning: the semantic_projection (Run record minus the
    documented platform-scoped identity fields) is byte-equal across
    platforms for identical inputs, and every record validates through
    the real core schema machinery -- no ad-hoc assertions of shape. The
    forced-fallback test proves the stronger claim: the SAME logical
    context answered through the documented fallback channels yields the
    same schema-valid Run as the all-NATIVE flow, and the durable
    session_ref survives every fallback unrewritten (the AC-02
    discipline of the M10-G03/G05 adapters, asserted here at the
    integration layer where the run record is built from the adapter
    answers).
  reconstruction_mirrors_the_siblings: >-
    The fresh-instance test is the M10-G03/G05 scenario-G reconstruction
    exercised at integration level with real machinery: durable snapshot
    (registry.to_records) persisted under the state directory, a brand
    new adapter with its own transport and a from_records-rehydrated
    registry answering resume (FALLBACK limitation with the same handle)
    and replace (NATIVE, same session_ref), the reconstructed Run
    byte-identical to the original worker's record, and the persisted
    goal/worker-context/run/evidence all validating through
    validate_object with the artifact manifest re-verified against the
    real file by the real registry and checksum. No mocks at the core
    layer anywhere (the M7-G05 discipline).
  determinism_hygiene: >-
    The suite holds the determinism discipline: fixed FIXED_STAMP for
    every timestamp, tmp_path for every filesystem artifact, ids
    exclusively via generate_id as pure functions of the canonical
    project/goal/run constants shared across both files, no network, no
    sleeps, no wall clock, no randomness, and byte-identical
    repeatability tests on both the battery flow and the full
    Goal -> Run -> Evidence flow.
  house_style: >-
    The files follow the house style: module docstrings mapping the goal
    and ACs to test names, comment-per-assertion density of the
    integration suites, frozen models from core.models used directly,
    schema validation through the core persistence gates, and the
    sibling-module import pattern (semantics file imports the rig from
    the battery file -- verified as the established house pattern via
    tests/integration/test_artifact_git.py:31 importing
    artifact_git_helpers; pytest resolves the sibling import through the
    rootdir path insertion).
  observations: >-
    Three notes, none of them findings: (1) The reason-vocabulary
    assertions are verbatim against the exported adapter constants
    (e.g. "in-process" in the claude outbox reason and absent from the
    codex one; "agent teams" / "codex sessions" in the resume reasons) --
    deliberate, matching the unit suites' verbatim assertions of the
    stable exported constants, so a wording change breaks the battery
    loudly rather than silently. (2)
    is_valid_session_ref in the semantics file is defined in the trailing
    "Supporting helpers" section (line ~505) though used at line ~308 --
    valid at runtime (module-level function called post-import) and
    documented, only slightly unconventional placement. (3) The pyright
    marks seen during development are all known noise classes (the
    "Expected symbol after as" / "(" was not closed diagnostics on the
    multiline claude_code import blocks and the reportMissingImports
    scanner artifacts are from pyright running without the venv context;
    ruff and mypy -- the authoritative gates -- are clean, and pytest
    collected and passed everything, so the files parse).

