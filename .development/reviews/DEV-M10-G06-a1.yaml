    - test_contract_alive_answers_observed_or_explicit_unsupported
    - test_contract_command_delivery_is_native_or_durable_outbox
    - test_contract_terminate_answers_typed_modes_and_durable_state
    - test_contract_fallback_subagent_always_answers_explicit_fallback
    - test_contract_unknown_session_is_session_not_found
    - test_contract_corrupt_data_is_data_error_and_bad_types_are_type_error
    - test_contract_result_records_serialize_canonically
    - test_contract_full_flow_is_deterministic_and_repeatable
    - test_contract_documented_differences_are_the_only_differences
    notes: >-
      AC-01 is delivered as a genuinely shared battery, not duplicated
      per-platform suites: the PlatformRig abstraction exposes the SAME
      scripted fake surface (records/live/submissions/stops/deliveries,
      accept/unavailable, spawns) for both adapters, and 32 parameterized
      tests drive ClaudeCodePlatformAdapter and CodexPlatformAdapter
      through byte-identical assertions (test ids [claude] and [codex]
      of every test_contract_*). The battery pins the frozen shared
      vocabulary of adapters/platform/base.py across BOTH adapters:
      capability declarations (the same six native PlatformOperation
      values in the same order, supports() consistency with the declared
      operations for every member of the frozen vocabulary, canonical
      serialization round-trip, and -- the honest part -- the capability
      record independent of runtime availability: an unavailable
      transport answers the same record); the locked abstract interface
      surface (no abstract method left unimplemented); session identity
      discipline (session_ref a pure deterministic function of the
      canonical context via derive_worker_session_ref, transport ids
      derived from session_ref via generate_id -- never the reverse, and
      rehydration self-correcting a stale/corrupt persisted session_ref,
      so the store is never authoritative); the typed result taxonomy
      (NATIVE vs FALLBACK vs UNSUPPORTED with stable non-empty reasons
      for the same scripted probe states -- resume limitation, liveness
      unobservable/durable-False, outbox preservation, idempotent
      terminate, refused/unavailable transports); the boundary error
      taxonomy (SessionNotFoundError for unknown sessions, corrupt
      records as PlatformAdapterDataError, TypeError at the public
      boundaries); and full-flow determinism (byte-identical results and
      snapshots across fresh executions). Where the adapters legitimately
      differ, the single non-parameterized
      test_contract_documented_differences_are_the_only_differences pins
      the differences as EXACTLY the documented ones (reason-string
      vocabulary, fallback-channel naming) and asserts everything else
      identical -- including the platform-neutral durable facts
      (terminated-session reasons and the "durable session registry"
      vocabulary shared verbatim by both platforms).
  AC-02:
    status: PASS
    evidence:
    - test_ac02_goal_through_each_adapter_yields_identical_run_semantics
    - test_ac02_forced_fallback_answers_leave_goal_run_evidence_unchanged
    - test_ac02_fresh_instance_over_same_state_directory_answers_same_identity
    - test_ac02_full_flow_is_deterministic_and_repeatable
    notes: >-
      AC-02 defines "identical semantics" precisely: Run records are
      byte-identical modulo the documented platform-scoped identity
      fields (worker_session_ref and external.backend), asserted through
      the semantic_projection helper -- and the flows use the REAL core
      machinery throughout (frozen GoalContract/Run/ClaimSpecificEvidence
      models, generate_id, compute_sha256 + the real ArtifactRegistry
      with its persistence gate, schema validation through
      core.schema_validation validate_object/validate_and_reject; only
      the platform transport boundaries are faked, exactly the M7-G05
      test_external_adapters pattern). Three axes: (1) one frozen Goal /
      worker-context package (carrying evidence refs) dispatched through
      BOTH adapters yields schema-valid Runs identical modulo the two
      documented fields, with the worker_session_ref of each Run equal
      to the canonical derive_worker_session_ref and never the reverse;
      (2) forcing each platform's documented FALLBACK answers (explicit
      subagent channel, resume limitation, durable outbox) on the same
      logical context leaves Goal/Run/Evidence state byte-identical to
      the all-NATIVE flow and every record still schema-valid, and the
      durable session_ref survives the fallbacks unrewritten (AC-02 of
      the sibling adapters); (3) the worker exits -- a fresh adapter over
      the same state directory (own transport, registry rehydrated from
      the durable snapshot, the 13-EXECUTION-MONITOR.md SS3-SS4
      reconstruction) answers the same identity, reconstructs a
      byte-identical Run, and the persisted state validates through the
      core machinery with the artifact checksum still verifying against
      the real file. Determinism is pinned end to end: fixed timestamps,
      no network/sleeps/randomness, and two fresh executions of the full
      flow produce byte-identical records, snapshots and state files.

