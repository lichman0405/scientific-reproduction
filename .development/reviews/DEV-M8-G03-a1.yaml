design_review:
  record_before_execute_discipline: >-
    Exactly-once per recorded decision is engineered, not asserted: the
    dispatcher resolves the deterministic decision event id and checks
    ProjectEventLog.get() BEFORE touching the resubmission hook, so a
    re-decided (or restart-replayed) decision returns the recorded
    history (replayed=True) and never re-invokes the hook; the decision
    record is the durable "retry was performed" fact, and the append
    carries the deterministic idempotency key retry.decision:<run_id>:
    <class>. The one honest gap -- a crash between the hook call and the
    record append re-invokes the hook on re-decision -- is documented
    explicitly in the module docstring (no durable intent marker was
    added to stay within the frozen scope), and once the record exists
    re-deciding is a pure idempotent replay. This is the same
    crash-window honesty as DEV-M8-G02's checkpoint-marker discipline.
  safe_by_construction_refusal: >-
    AC-02 is structural: the whitelist is a single-member frozenset and
    the authorization test is membership in it, so EVERYTHING outside --
    the scientific "job" class, unclassified None, unrecognized strings
    -- is refused by construction, with the default classifier (always
    unclassified) making the default configuration incapable of
    authorizing anything and the default hook failing loudly rather
    than silently dropping a resubmission. The dispatcher never writes
    the run store (no parameter mutation path exists), and a transient
    classifier exception is normalized to unclassified with the
    exception message discarded (proven by credential-shaped byte
    scans of every persisted file).
  real_machinery_verification: >-
    The tests exercise the REAL machinery end to end: persisted Run
    records re-read through Run.from_dict, decision records through the
    real ProjectEventLog with sequence numbers and the documented
    idempotency keys (asserted on disk), replay through
    ProjectEventLog.get() (confirmed to exist at core/events.py:263),
    canonical event bytes asserted byte-for-byte against
    json.dumps(indent=2, sort_keys=True). The dispatcher persists
    nothing itself; every write flows through the injected/derived
    registry, run store and event log.
  determinism_and_discipline: >-
    Injected clock (FakeClock fixed stamp; the dispatcher's clock
    consultation asserted), deterministic event ids (pure function of
    decision inputs), sorted traversal (decide_all iterates the
    registry's sorted watch set; RetrySummary self-validates sorted
    outcomes and count consistency), canonical sorted JSON through the
    stores, byte-identity across directories. TypeError at every public
    boundary (state_dir/now/classifier/resubmit/run_store/event_log and
    decide's run_id/failure_class), stable MonitoringError subclasses
    (RetryError -> RetryContractError/CorruptRetryStateError), corrupt
    recorded decisions fail replay loudly, the no-adapters boundary is
    proven in a fresh interpreter (monitoring package import leaves
    scientific_reproduction.adapters out of sys.modules), and the
    failure-class vocabulary mirrors adapters/compute/ssh.py exactly
    (FAILURE_CLASS_TRANSPORT == "transport", FAILURE_CLASS_JOB == "job")
    without importing it.
  type_ignore_audit: >-
    All 8 # type: ignore[arg-type] comments (test_retry_dispatcher.py
    lines 1276-1299) are deliberate wrong-type boundary passes under
    pytest.raises(TypeError) -- the house boundary-test pattern (same
    judgment as DEV-M7-G04, DEV-M8-G01, DEV-M8-G02 and DEV-M8-G04);
    none masks a real defect. The pyright "unreachable" diagnostics at
    retry.py lines 527-549 are the six TypeError boundary raises (static
    narrowing), the "_resubmit unknown at 706" and "import could not be
    resolved" diagnostics are stale mid-edit snapshots (the final code
    defines self._resubmit_fn at retry.py:558 and mypy passes 87
    clean), and the "_external is not accessed" info at retry.py:265 is
    the intentional underscore-named unused parameter of the default
    classifier. No other ignores or noqas anywhere.

