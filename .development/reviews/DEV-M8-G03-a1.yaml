acceptance_criteria:
  AC-01:
    status: PASS
    evidence:
    - test_ac01_whitelisted_transport_failure_triggers_identical_resubmission
    - test_ac01_resubmission_is_exactly_once_per_retry_decision
    notes: >-
      A failure class on the engineering retry whitelist
      (ENGINEERING_RETRY_WHITELIST == frozenset({FAILURE_CLASS_TRANSPORT}),
      asserted in the test) triggers an IDENTICAL resubmission through
      the injected hook: the hook receives the watch entry's external
      identity (same backend, same working directory), the resubmission
      receipt (the new external identity returned by the hook) is
      recorded, exactly one deterministic engineering_retry_decision
      event is appended (actor execution-monitor, stable reason
      engineering_failure_retry_authorized, payload carrying the failure
      class + decision + resubmitted identity, sequence 1), and the Run
      record -- parameters and lifecycle -- is byte-identical after the
      decision (an identical resubmission never mutates the run; the
      dispatcher never writes the run store). Exactly-once per recorded
      decision: re-deciding the same failure resolves the deterministic
      event id through ProjectEventLog.get() and replays the recorded
      history (replayed=True, original receipt and stamp) -- one hook
      call total, one record, sequence never advances twice.
  AC-02:
    status: PASS
    evidence:
    - test_ac02_scientific_compute_failure_never_resubmits_or_mutates
    - test_ac02_unclassified_failure_is_refused_and_recorded
    - test_ac02_unrecognized_failure_class_is_refused_safe_by_construction
    - test_ac02_default_configuration_never_authorizes_a_retry
    notes: >-
      A scientific compute failure never triggers parameter mutation:
      the "job" class (FAILURE_CLASS_JOB), an unclassified failure
      (None) and any unrecognized failure-class string are ALL refused
      (the whitelist membership test makes refusal the safe-by-
      construction default for every class outside the set). In each
      case the resubmission hook is never invoked (injected counter
      records zero calls), the Run's parameters and persisted state
      bytes are untouched (byte-identical file, Run equality,
      lifecycle/goal/type/external all unchanged), and the refusal is
      observed and recorded as one refused decision event (stable reason
      scientific_failure_retry_refused, no receipt in the payload). The
      default configuration (no classifier, no hook) can never authorize
      a retry: the default classifier always reports unclassified and
      the default hook raises loudly (never a silent no-op), with
      nothing recorded on the loud failure. The dispatcher has NO run-
      store write path anywhere in the module (verified in the code).
  AC-03:
    status: PASS
    evidence:
    - test_ac03_fresh_dispatcher_replays_recorded_decisions_without_reexecution
    - test_ac03_byte_identical_durable_state_for_identical_inputs
    - test_ac03_every_decision_is_auditable_in_the_event_log
    notes: >-
      Retry history remains auditable: every decision (authorized AND
      refused) is appended through the REAL append-only ProjectEventLog
      as an engineering_retry_decision event under the deterministic
      idempotency key retry.decision:<run_id>:<failure class>, with the
      event id a pure function of the decision inputs
      (generate_id("event", "engineering_retry_decision", run_id,
      normalized_class)) and the event vocabulary (actor, reasons,
      payload fields) documented in the module docstring. A FRESH
      dispatcher over the same state directory, run store and event log
      reconstructs the retry history from the recorded events alone:
      re-deciding the same failures replays the recorded outcomes
      (original stamp and receipt, replayed=True) with a fresh hook
      instance receiving ZERO calls, event-log and run-store bytes
      identical. Identical injected inputs produce byte-identical
      durable state across two independent directories (canonical
      sorted JSON asserted byte-for-byte: file content == json.dumps
      with indent=2/sort_keys). The 3-mixed-decision audit test proves
      the full vocabulary per record (deterministic sorted order,
      sequence 1-2-3, per-run reason/payload assertions). The empty
      watch set yields a deterministic empty summary with no events.

