ac_evidence:
  AC-01: >-
    Transient engineering failures authorized WHEN the frozen contract allows:
    (a) ssh_connection_lost / network_timeout / scheduler_node_failure in the
    policy's allowed_engineering_failures -> R-RET-A1 AUTHORIZED/AUTOMATIC with
    the whitelist entry and reasoning id recorded (test_retry_ac01_whitelisted_
    ssh_failure_authorized_for_automatic_action, ..._whitelisted_network_timeout_
    authorized, ..._whitelisted_scheduler_node_failure_authorized_when_contract_
    allows). (b) The "when the contract allows" reading enforced both ways: the
    same transient SSH failure under a policy that does not whitelist it is
    REJECTED by the total default R-RET-D1 (matched_policy_entries == (),
    REASON_NO_POLICY_ENTRY) -- the whitelist is the contract, not a
    classification of how the failure looks (test_retry_ac01_transient_failure_
    not_whitelisted_is_not_authorized, test_retry_ac01_whitelist_is_the_contract_
    not_the_failure_shape: identical kind authorized under one policy, rejected
    under another -- pure function of the contract). (c) Every assessment
    records the full decision record: all 7 rule evaluations in table order,
    the matched rule id, the matched whitelist entry, the reasoning id and the
    ruleset version (test_retry_ac01_authorized_assessment_records_full_decision_
    record -- R-RET-S1 not matched, trailing R-RET-D1 always matched but not
    deciding).
  AC-02: >-
    Identical checkpoint continuation authorized without scientific change,
    gated by max_identical_retries: (a) None = unlimited (count 5 authorized,
    REASON_IDENTICAL_CHECKPOINT_CONTINUATION + REASON_CEILING_UNLIMITED,
    ceiling None, ceiling_reached False); int = hard ceiling (counts 0/1 of 2
    authorized with REASON_CEILING_NOT_REACHED; 2/3/10 rejected by R-RET-C2 with
    REASON_CEILING_REACHED and ceiling_reached True; zero ceiling authorizes
    nothing) -- test_retry_ac02_* suite. (b) Authorization comes from the policy
    contract (the ceiling gate), not from a whitelist entry: a policy that lists
    no checkpoint kind at all still authorizes the identical continuation
    (test_retry_ac02_checkpoint_continuation_authorized_without_whitelist_entry).
    (c) Invalidation beats it: checkpoint_continuation in invalidate_run_on ->
    R-RET-I1 REJECTED/AUTOMATIC with the trigger recorded
    (test_retry_ac02_checkpoint_continuation_in_invalidate_run_on_situation_
    rejected); a policy invalidating a different kind does not block it
    (test_retry_ac02_checkpoint_continuation_not_in_invalidate_run_on_authorized).
    (d) The identical declaration is the input contract: checkpoint_
    continuation must be True exactly for the checkpoint_continuation kind, a
    contradictory input is rejected with a stable one-line message
    (test_retry_ac02_checkpoint_continuation_requires_identical_declaration).
    (e) The authorization is engineering-only: routing stays AUTOMATIC, no
    supervisor reasoning ids (test_retry_ac02_identical_checkpoint_continuation_
    is_never_scientific). (f) The assessment records the identical-retry count
    against the ceiling verbatim (ceiling == policy.max_identical_retries,
    ceiling_reached computed from the count) -- test_retry_ac02_ceiling_state_
    records_count_against_ceiling.
  AC-03: >-
    Scientific parameter modifications are never authorized for automatic worker
    action: (a) a kind in the policy's supervisor_required_changes (the
    authoritative list) -> R-RET-S1 REJECTED/SUPERVISOR with the entry and
    REASON_SUPERVISOR_REQUIRED_CHANGE recorded (test_retry_ac03_supervisor_
    required_change_routed_to_supervisor). (b) The frozen detection vocabulary
    (SCIENTIFIC_CHANGE_FAILURES, 13 kinds: functional/force field/k-point mesh/
    cutoff/convergence policy+tolerance/thermostat/integration/model/charge/
    mixing parameter+rule/smearing) catches kinds the policy does not list ->
    R-RET-V1 REJECTED/SUPERVISOR, parametrized over every vocabulary member
    (test_retry_ac03_every_vocabulary_scientific_change_routed_to_supervisor).
    (c) Strongest reading pinned: a known scientific modification that a
    (malformed) policy ALSO whitelists is STILL never authorized -- R-RET-V1
    fires before the whitelist rule (test_retry_ac03_scientific_change_never_
    authorized_even_when_whitelisted). (d) FDM-201 counter-case (simulated
    scenario S5): smearing/mixing/convergence-policy changes are never auto-
    authorized (test_retry_ac03_fdm201_counter_case_never_auto_authorized).
    (e) Supervisor routing is a decision record, never an error and never an
    execution: the assessment is a normal frozen record and the module has no
    execution API at all -- module-dict and source inspection prove no
    execute/apply/perform/dispatch surface (test_retry_ac03_supervisor_routing_
    is_a_decision_record_not_an_error, test_retry_boundary_module_exposes_pure_
    evaluation_only_no_execution_api). (f) Precedence: scientific classification
    first (S1 > V1 > I1 > A1 -- a kind in every list routes to the Supervisor,
    test_retry_ac03_supervisor_required_change_wins_over_whitelist_and_
    invalidation); invalidation beats the whitelist (test_retry_ac03_invalidate_
    run_on_wins_over_whitelist); the authoritative-list/detection/default
