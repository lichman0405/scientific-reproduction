    invented supervisor route) -- test_retry_ac03_supervisor_required_changes_
    are_authoritative_list. (g) The vocabulary is a frozen set disjoint from the
    automatic kinds (checkpoint continuation and the engineering kinds are never
    scientific) -- test_retry_ac03_vocabulary_is_frozen_and_disjoint_from_
    automatic_kinds.
review_notes:
- >-
  Security-review consideration (automated commit security review flagged a
  fail-open gate: the checkpoint_continuation declaration is caller-supplied).
  Evaluated and rejected as a defect in this context: (1) the design is the
  contractually frozen honest-declaration model -- RetryEvaluationInput
  documents "the evaluator cannot observe scientific change, it can only accept
  or refuse the caller's declaration" and DEV-M6-G04 AC-02 defines the identical
  declaration as the input; (2) this module is a pure decision layer with no
  execution API (proven by module-dict and source inspection tests), so a
  spoofed declaration yields an auditable decision record, never an execution;
  the execution boundary is the DEV-M6-G03 permission matrix (ENGINEERING_RETRY
  vs Supervisor-only SCIENTIFIC_PARAMETER_CHANGE); (3) known scientific
  modifications cannot be routed through this path: R-RET-S1 (authoritative
  list) and R-RET-V1 (frozen vocabulary) fire before the checkpoint rules, and
  the flag binding (checkpoint_continuation True exactly for the checkpoint_
  continuation kind) plus the tested disjointness of the vocabulary from
  automatic kinds closes the labeling channel for known scientific changes --
  only unknown kinds could be mislabeled, which is exactly what the
  whitelist-is-contract default (R-RET-D1) rejects; (4) the declaration is
  recorded verbatim in the assessment input for audit. Suggested fix was N/A.
  Recorded here so the consideration is part of the audit trail; no code change.
- >-
  Rule-table integrity verified by reading: ordered 7-rule RETRY_DECISION_RULES
  (R-RET-S1 > R-RET-V1 > R-RET-I1 > R-RET-A1 > R-RET-C1/C2 > R-RET-D1 total
  default), first match wins; validate_retry_ruleset proves non-empty, unique
  ids and that the trailing rule matches every probe input of the 7
  rule-triggering shapes; evaluate_automatic_retry post-asserts matched rule
  id/verdict/routing; RetryAssessment.__post_init__ enforces the recorded
  ceiling equals the policy's verbatim, ceiling_reached consistency, reasoning
  ids in the frozen vocabulary, and verdict/routing equal the matched rule's --
  each enforced invariant is adversarially tested via direct construction
  (test_retry_paradigm_assessment_ceiling_integrity_checks, test_retry_paradigm_
  value_errors_stable_and_one_line, test_retry_paradigm_ruleset_validation).
- >-
  AC mapping one-to-one: AC-01 -> R-RET-A1/D1 (whitelist is the contract);
  AC-02 -> R-RET-C1/C2/I1 (ceiling gate + invalidation precedence);
  AC-03 -> R-RET-S1/V1 + no-execution-API proof. The goal's verification command
