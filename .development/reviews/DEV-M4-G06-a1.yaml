acceptance_criteria:
  AC-01:
    status: PASS
    evidence:
    - test_planning_flow_ac01_incomplete_inventory_fails_freeze
    notes: >-
      The real modules, end to end, on a synthetic incomplete workspace
      (init -> inventory -> audit -> freeze). The fixture is a formally
      reported item referencing an unregistered requirement: the real
      completeness audit (recomputed from registered state) rules the
      item AMBIGUOUS (matched rule R-AUD-A1, offending_item_ids
      ("ITEM-1",)), verdict FAIL, freeze_eligible False; the real freeze
      (planning.freeze.freeze_plan over planning.plan.build_plan_v1)
      raises FreezeProhibitedError -- asserted as PlanningError and
      ValueError subclass with the offending id both structurally
      (offending_item_ids) and in the stable message -- and writes no
      plan records (neither v1-draft.json nor v1.json exist). The
      fixture-design note in the worker report explains why the
      incomplete state is AMBIGUOUS rather than UNMAPPED: mapping is
      recomputed from the item's own requirement_ids (registry records
      immutable), so an item with no references is permanently UNMAPPED
      and could not be completed on the same workspace -- the shipped
      fixture preserves the "same flow" property of AC-01/AC-02. Sound.
  AC-02:
    status: PASS
    evidence:
    - test_planning_flow_ac02_complete_inventory_produces_frozen_plan_v1
    notes: >-
      Same flow property: starts from the exact workspace AC-01 rejected
      (first freeze attempt still raises), then complete_inventory
      registers the two requirements, the second item, the goal contract
      family (goal/acceptance/analysis/closure drafts), and the same
      build_plan_v1 -> freeze_plan flow persists Plan v1 at plans/v1.json
      (version "v1", status FROZEN, frozen_at 2026-06-01T00:00:00Z, real
      pre-freeze git HEAD as frozen_commit == current_head(root)), with
      the embedded PASS audit (2/2 mapped, 0 unmapped, 0 ambiguous,
      coverage 1.0). The persisted record is verified by direct JSON
      read; the v1-draft record stays DRAFT; the goal-contract drafts
      are never rewritten by the freeze (record["frozen"] is False).
  AC-03:
    status: PASS
    evidence:
    - test_planning_flow_ac03_frozen_plan_reloaded_from_filesystem_and_audited
    notes: >-
      Fresh read_plan(root, "v1") reloads from filesystem state (no
      in-memory reuse of the freeze result) with the full frozen
      identity (version/status/frozen_at/frozen_commit/goal_ids/
      requirement_ids); the persisted plan record embeds the
      inventory_audit sub-object (status PASS, exact counts); the
      recomputed audit_inventory_registry matches the frozen plan's
      embedded audit view exactly (audit.plan_inventory_audit() ==
      reloaded.inventory_audit, matched R-AUD-P1, same summary counts);
      plan_lineage reports v1-draft DRAFT / v1 FROZEN (computed status).
  integration:
    status: PASS
    evidence:
    - test_planning_flow_dag_frozen_plan_v1_exports_semantic_dag
    - test_planning_flow_determinism_identical_fixtures_identical_frozen_plan
    notes: >-
      Bonus integration beyond the three ACs, at the milestone level
      ("frozen Plan v1 and semantic DAG"): build_plan_dag(root, "v1")
      on the real registered state exports the frozen plan verbatim
      (FROZEN, v1, resource_ids), exactly one edge (GOAL-1 -> GOAL-2,
      HARD_GATE with execution_gate True / acceptance_gate False,
      classified GateKind.HARD_EXECUTION -- the M4-G05 semantics),
      dependency-first topological order ("GOAL-1", "GOAL-2"), acyclic,
      no missing contracts/refs; the PROCURE resource blocks GOAL-1
      (blocking_resource_ids ("RES-1",)) while the AVAILABLE resource
      never blocks GOAL-2, plan-level plan_blocking_resource_ids
      ("RES-1",), and the blocked goal's acceptance sub-object is
      carried verbatim (criteria_ref ACC-1, frozen False -- blocking
      never alters scientific acceptance). Determinism: two identically
      built workspaces freeze byte-identical v1.json / v1-draft.json /
      project.yaml.

