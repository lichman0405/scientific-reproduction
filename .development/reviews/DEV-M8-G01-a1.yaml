acceptance_criteria:
  AC-01:
    status: PASS
    evidence:
    - test_ac01_fresh_registry_reconstructs_watch_set_from_persisted_state
    - test_ac01_fresh_registry_recovers_heartbeat_and_unwatch
    - test_ac01_empty_state_directory_yields_empty_watch_set
    notes: >-
      A fresh WatchedRunRegistry instance over the same state directory
      reconstructs the full watch set from the persisted entries alone:
      every operation re-hydrates from disk (the M1 recovery discipline
      -- never trust session state), list_watched()/get() answer from
      the <state_dir>/watched/<run_id>.json files only. The three
      AC-01 tests cover reconstruction of three different external
      shapes (slurm job id, lab dispatch id, both ids plus adapter
      stamps), durability of watch-set mutations across instances
      (heartbeat stamp and unwatch observed by the fresh instance), and
      empty state directories yielding an empty watch set. The fresh
      instance also agrees on the deterministic monitor identity
      (derive_monitor_id), so registry and checkpoint store over the
      same directory always name the same Monitor.
  AC-02:
    status: PASS
    evidence:
    - test_ac02_checkpoint_update_is_plain_atomic_file_write_without_git
    - test_ac02_heartbeat_update_is_plain_atomic_file_write_without_git
    - test_ac02_checkpoint_and_heartbeat_are_plain_json_state_files
    notes: >-
      Heartbeat and checkpoint updates are plain durable state files
      written atomically through core.atomic.atomic_write -- no git
      involvement of any kind, no audit commit, no repository
      bookkeeping. The tests prove it three ways: (1) after updates the
      state directory holds EXACTLY the durable JSON state files
      (rglob == [checkpoint.json] / [heartbeat.json] / both) with no
      .git, HEAD, index, objects or refs anywhere; (2) the update
      replaced the file content in place through the filesystem
      atomic-write mechanism (readable JSON, new content, record
      version present); (3) git rev-parse --is-inside-work-tree FAILS
      from the state directory -- it is not inside any git worktree, so
      no audit commit was or could be involved.
  AC-03:
    status: PASS
    evidence:
    - test_ac03_checkpoint_references_external_ids_needed_for_reconciliation
    - test_ac03_checkpoint_recoverable_by_fresh_instance
    - test_ac03_checkpoint_entry_requires_external_identity
    notes: >-
      The persisted checkpoint references the adapter/external ids
      needed for reconciliation: every MonitorRunCheckpoint entry
      carries the core RunExternal vocabulary (backend, dispatch_id
      and/or job_id, working_directory) and the persisted JSON is
      asserted to carry the full external identity verbatim; a fresh
      MonitorCheckpointStore instance recovers the same checkpoint
      (entries, monitor identity, timestamps) from checkpoint.json
      alone, in the deterministic sorted run-id order the store
      persists. The external-identity invariant is enforced at
      construction AND at from_dict by validate_external_identity
      (backend + at least one external id required -- an entry without
      an external identity could never be reconciled), and the store
      refuses to save a checkpoint of a different monitor (ownership
      guard).

