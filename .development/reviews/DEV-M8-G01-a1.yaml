design_review:
  durable_state_discipline: >-
    Both deliverables follow the house durable-state paradigm exactly:
    frozen dataclass records, canonical sorted JSON (shared
    _canonical_json helper -- byte-identical for identical inputs,
    proven by two-directory byte-equality tests), atomic_write
    persistence, strict from_dict validation with version checks, and
    stable ValueError-based error hierarchies (MonitoringError ->
    WatchRecordError/WatchNotFoundError/DuplicateWatchError/
    CheckpointRecordError) wrapping corrupt-file errors loudly --
    corrupt persisted state is never silently skipped (garbage, non-
    object JSON and contract-violating files all tested). No session
    state is ever trusted: every operation re-hydrates from disk.
  recovery_and_idempotence: >-
    The M8 recovery discipline is expressed at every level: watch
    re-establishment is idempotent for the identical entry (byte-
    identical file, no error), re-watching a run under a different
    external identity is refused with DuplicateWatchError until unwatch
    (unwatch itself idempotent), heartbeat stamps from the injected
    clock, and the monitor identity is a deterministic pure function of
    the state directory (generate_id("monitor", resolved path)) -- no
    randomness, no wall clock anywhere (FakeClock fixed stamp in every
    test; byte-identical persistence proven across directories).
  reconciliation_vocabulary: >-
    AC-03's vocabulary is exactly the core RunExternal contract from
    core/models.py (backend/dispatch_id/job_id/working_directory) --
    no adapter types leak in. The architectural boundary test runs the
    import in a fresh interpreter and asserts
    scientific_reproduction.adapters is absent from sys.modules after
    importing the monitoring package. The checkpoint's per-run entries
    are persisted in sorted run-id order for deterministic bytes, and
    a store only persists its own monitor's checkpoint (ownership
    guard with stable error).
  no_secrets: >-
    Records hold external ids only -- there are no credential fields in
    any record type, and the no-secrets tests walk EVERY persisted byte
    of watch entries, checkpoint and heartbeat against
    (password/passphrase/secret/credential/token/api_key) in both
    lowercase and the raw payload, including Windows-style working
    directories.
  type_ignore_audit: >-
    Every # type: ignore[arg-type] (8 in the registry tests, 6 in the
    checkpoint tests) is a deliberate wrong-type boundary pass under
    pytest.raises(TypeError) -- the house boundary-test pattern (same
    judgment as DEV-M7-G04); none masks a real defect. The single
    # noqa: F401 in the surface test is the intentional
    all-__all__-names-importable assertion. No other ignores/noqas.

