goal_id: DEV-M2-G02
milestone: M2
title: Implement dependency, execution-gate and acceptance-gate evaluation
objective: Implement hard/soft/informational dependency semantics and separate execution
  vs acceptance gates.
depends_on:
- DEV-M2-G01
allowed_scope:
- scientific_reproduction/core/rules/dependencies.py
- tests/rules/test_dependencies*
