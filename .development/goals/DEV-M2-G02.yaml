- dependency evaluator
- execution gate evaluator
- acceptance gate evaluator
acceptance_criteria:
- id: AC-01
  criterion: Hard gate blocks execution when unresolved.
- id: AC-02
  criterion: Soft/informational dependencies do not incorrectly serialize the DAG.
- id: AC-03
  criterion: Acceptance can remain blocked after execution is allowed.
verification:
- python -m pytest -q tests/rules -k depend
