goal_id: DEV-M1-G03
milestone: M1
title: Implement leases and file locks
objective: Implement bounded per-object leases/locks that prevent duplicate ownership
  while allowing expiry/recovery.
depends_on:
- DEV-M1-G02
allowed_scope:
- scientific_reproduction/core/leases.py
- scientific_reproduction/core/locks.py
- tests/state/test_leases*
deliverables:
- lease acquire/renew/release API
- atomic lock acquisition
- expiry/recovery behavior
acceptance_criteria:
- id: AC-01
  criterion: Two concurrent claimers cannot both acquire the same valid lease.
- id: AC-02
  criterion: Expired leases can be recovered deterministically.
- id: AC-03
  criterion: Lease metadata identifies owner and expiry.
verification:
- python -m pytest -q tests/state -k lease
forbidden_changes: []
worker_mode: agent_team_task
plan_approval_required: false
