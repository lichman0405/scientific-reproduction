goal_id: DEV-M1-G01
milestone: M1
title: Implement deterministic IDs and typed core models
objective: Implement deterministic identifier helpers and typed representations for
  all normative project objects without embedding workflow decisions in model constructors.
depends_on:
- DEV-M0-G04
allowed_scope:
- scientific_reproduction/core/ids.py
- scientific_reproduction/core/models.py
- scientific_reproduction/core/schema_validation.py
- tests/core/**
deliverables:
- deterministic ID API
- typed core object models
- schema validation adapter
acceptance_criteria:
- id: AC-01
  criterion: All normative object types can be represented and serialized.
- id: AC-02
  criterion: IDs are deterministic under the documented input contract and collision
    behavior is tested.
- id: AC-03
  criterion: Schema-invalid objects are rejected before persistence.
verification:
- python -m pytest -q tests/core
- python -m ruff check .
forbidden_changes: []
worker_mode: agent_team_task
plan_approval_required: false
