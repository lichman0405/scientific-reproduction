goal_id: DEV-M12-G02
milestone: M12
title: Build real FDM-201 Reproduction Inventory
objective: Create formal reported-item inventory from main text/SI/linked public data
  with source locations and requirement mapping candidates.
depends_on:
- DEV-M12-G01
allowed_scope:
- benchmarks/fdm201/inventory/**
deliverables:
- FDM-201 inventory
- source-to-result index
acceptance_criteria:
- id: AC-01
