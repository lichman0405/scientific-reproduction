- id: AC-02
  criterion: Items include source location/provenance.
- id: AC-03
  criterion: Ambiguities are explicit rather than silently omitted.
verification:
- python -m pytest -q tests/benchmarks -k inventory
forbidden_changes: []
worker_mode: agent_team_task
plan_approval_required: false
