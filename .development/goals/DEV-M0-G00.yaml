goal_id: DEV-M0-G00
milestone: M0
title: Establish GitHub branch, PR, CI, and merge governance
objective: Establish the repository-level GitHub workflow that makes one short-lived branch and one pull request the mandatory integration path for every repository-changing DEV-GOAL after the initial empty-repository baseline commit.
depends_on: []
allowed_scope:
  - .github/**
  - CONTRIBUTING.md
  - .gitignore
  - scripts/validate_development_contracts.py
deliverables:
  - pull request template wired for DEV-GOAL evidence
  - pull-request GitHub Actions bootstrap workflow
  - branch and PR governance documentation pointers
  - development-contract validation entry point
acceptance_criteria:
  - id: AC-01
    criterion: Pull requests targeting main run an initial deterministic governance/spec validation workflow.
  - id: AC-02
    criterion: PR template requires Goal ID, acceptance evidence, verification results, architecture impact, and known limitations.
  - id: AC-03
    criterion: Repository documentation explicitly forbids normal direct product commits to main and Worker self-merge.
  - id: AC-04
    criterion: This goal itself is delivered through a ci/DEV-M0-G00 branch and pull request rather than a direct main implementation commit.
  - id: AC-05
    criterion: Development contract validator checks milestone and DEV-GOAL YAML structure and detects malformed contracts.
verification:
  - python scripts/validate_development_contracts.py
forbidden_changes:
  - scientific_reproduction/**
change_type: CI
worker_mode: agent_team_task
plan_approval_required: false
git_notes:
  - This is the first governed implementation PR after the specification-only empty-repository bootstrap exception.
  - The PR CI bootstrap may validate specification/development contracts before package test tooling exists.
