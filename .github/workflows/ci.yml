name: CI

# Bootstrap CI: every pull request targeting `main` must pass the
# deterministic development-contract validation before it may merge.
# Package test tooling is added by later milestones (M0-G02+); until then
# this workflow validates specification/development contracts.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-development-contracts:
    name: Validate development contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: pip install pyyaml jsonschema

      - name: Validate development contracts
        # Exits non-zero on any malformed milestone/goal contract or DAG
        # issue, failing the pull request.
        run: python scripts/validate_development_contracts.py
